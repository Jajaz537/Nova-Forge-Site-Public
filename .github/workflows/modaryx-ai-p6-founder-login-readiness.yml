name: MODARYX IA P6 Founder login readiness

on:
  push:
    branches:
      - "chatgpt/modaryx-ai-founder-integration-20261005"
    paths:
      - ".github/workflows/modaryx-ai-p6-founder-login-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      ORIGIN: "https://272be97b.nova-forge-site-public.pages.dev"
    steps:
      - name: Verify real Auth0 login redirect on proof preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          headers="$(mktemp)"
          body="$(mktemp)"
          url="$ORIGIN/api/v1/auth/login?returnTo=%2Fapi%2Ffounder%2Fai%2Fe2e-proof"
          code="$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' --max-time 20 "$url" || true)"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/$/,""); sub(/^[^:]+:[[:space:]]*/,""); print; exit}' "$headers")"
          rm -f "$body" "$headers"

          test "$code" = "302"
          test -n "$location"

          python3 - "$ORIGIN" "$location" > evidence/login-readiness.json <<'PY'
import json,sys,urllib.parse
origin=sys.argv[1].rstrip("/")
location=sys.argv[2]
u=urllib.parse.urlparse(location)
q=urllib.parse.parse_qs(u.query)
redirect=(q.get("redirect_uri") or [""])[0]
state=(q.get("state") or [""])[0]
challenge=(q.get("code_challenge") or [""])[0]
safe={
  "schema":"modaryx-p6-founder-login-readiness-v1",
  "status":"PASS" if (
    u.scheme=="https" and
    bool(u.hostname) and
    redirect==origin+"/api/v1/auth/callback" and
    len(state)>=20 and
    len(challenge)>=20 and
    q.get("code_challenge_method",[""])[0]=="S256" and
    "client_secret" not in q
  ) else "FAIL",
  "auth0_host":u.hostname,
  "redirect_uri":redirect,
  "pkce":"S256" if q.get("code_challenge_method",[""])[0]=="S256" else "INVALID",
  "state_present":len(state)>=20,
  "client_secret_in_redirect":False if "client_secret" not in q else True,
  "cookies_recorded":False,
  "tokens_recorded":False,
  "awards_vf_points":False
}
print(json.dumps(safe,indent=2))
if safe["status"]!="PASS": raise SystemExit(3)
PY
          cat evidence/login-readiness.json
          echo "MODARYX_P6_FOUNDER_LOGIN_READY origin=$ORIGIN"

      - name: Upload login readiness evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: modaryx-ai-p6-founder-login-readiness
          path: evidence
          if-no-files-found: error
          retention-days: 30
