name: MODARYX Living World Offline State Proof

on:
  pull_request:
    branches:
      - design/modaryx-premium-hd-20260914-work
    paths:
      - '.github/workflows/modaryx-living-world-offline-state-proof.yml'
      - 'qa/check-living-world-offline-state.mjs'
      - 'assets/living-world.js'
      - 'assets/living-world.css'
      - 'data/living-world.json'
      - 'sw.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  living-world-offline-state:
    name: Living world offline freshness state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Check living world offline state
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-living-world-offline-state.mjs
