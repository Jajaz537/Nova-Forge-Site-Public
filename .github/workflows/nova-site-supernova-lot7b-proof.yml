name: Nova Site Super Nova Lot 7B Targeted Proof

on:
  push:
    branches:
      - supernova/accelerated-all-ideas-20260913
    paths:
      - 'assets/local-data-control.mjs'
      - 'assets/creator-workbench.mjs'
      - 'assets/resumable-upload.mjs'
      - 'assets/shell.js'
      - 'schemas/passkey-recovery.schema.json'
      - 'sw.js'
      - 'governance/SUPER-NOVA-SITE-LOT7B.json'
      - 'eng/site/Test-NovaSiteSuperNovaLot7B.ps1'
      - 'eng/site/test-resumable-upload.mjs'
      - '.github/workflows/nova-site-supernova-lot7b-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-site-lot7b:
    name: Targeted Site Lot 7B Windows proof
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Prove local privacy, OPFS, passkey recovery and resumable upload contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "SOURCE_COMMIT=$env:GITHUB_SHA"
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./eng/site/Test-NovaSiteSuperNovaLot7B.ps1
