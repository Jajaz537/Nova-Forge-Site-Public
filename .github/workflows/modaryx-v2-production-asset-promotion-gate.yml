name: MODARYX V2 Production Asset Promotion Gate

on:
  push:
    branches:
      - 'audit/modaryx-v2-legacy-boundary-20261003'
    paths:
      - '.github/workflows/modaryx-v2-production-asset-promotion-gate.yml'
      - 'qa/check-v2-production-asset-promotion-gate.mjs'
      - 'qa/modaryx-v2-asset-rights-manifest.json'
      - 'review-evidence/modaryx-v2-living-threshold-prototype-20261003/public/assets/**'
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.jsx'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.css'
      - '**/*.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Block prototype-only assets from production promotion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate production asset promotion gate
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-v2-production-asset-promotion-gate.mjs
