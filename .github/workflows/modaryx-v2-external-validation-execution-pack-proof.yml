name: MODARYX V2 External Validation Execution Pack Proof

on:
  push:
    branches:
      - 'chatgpt/modaryx-v2-external-validation-execution-pack-20261006'
      - 'chatgpt/modaryx-v2-current-preview-refresh-20261006-1648'
    paths:
      - '.github/workflows/modaryx-v2-external-validation-execution-pack-proof.yml'
      - 'qa/modaryx-v2-external-validation-execution-pack.json'
      - 'qa/external-validation/evidence-template.json'
      - 'qa/check-v2-external-validation-execution-pack.mjs'
      - 'qa/check-v2-external-validation-evidence.mjs'
      - 'qa/modaryx-v2-preproduction-contract-registry.json'
  pull_request:
    branches:
      - 'design/modaryx-v2-blue-violet-product-20261005'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modaryx-v2-external-validation-pack-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Prove external validation pack stays non-simulated
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate execution pack
        run: |
          set -euo pipefail
          node qa/check-v2-external-validation-execution-pack.mjs
          node qa/check-v2-preproduction-contract-registry.mjs
          echo PASS_V2_EXTERNAL_VALIDATION_EXECUTION_PACK_PROOF
