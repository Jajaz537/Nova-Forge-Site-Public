name: MODARYX VF release projects premium

on:
  push:
    branches:
      - site/modaryx-vf-premium-hd-v2
    paths:
      - '.github/modaryx-vf-release-projects-premium-trigger.json'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site/modaryx-vf-premium-hd-v2
          fetch-depth: 0
      - name: Premiumize release verification and project hubs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one target, got {count}')
              return text.replace(old, new, 1)

          pages = {
              'downloads.html': ('Téléchargements publics — MODARYX MODS', 'https://modaryxmods.com/downloads'),
              'verify.html': ('Vérificateur SHA-256 — MODARYX MODS', 'https://modaryxmods.com/verify'),
              'project.html': ('Projets — MODARYX MODS', 'https://modaryxmods.com/project'),
              'project-ember-textures.html': ('Ember Textures — MODARYX MODS', 'https://modaryxmods.com/project-ember-textures'),
              'project-balanced-latency-pack.html': ('Balanced Latency Pack — MODARYX MODS', 'https://modaryxmods.com/project-balanced-latency-pack'),
              'project-forge-night-experience.html': ('Forge Night Experience — MODARYX MODS', 'https://modaryxmods.com/project-forge-night-experience'),
          }

          nav = '<nav aria-label="Navigation principale"><a href="./index.html">Accueil</a><a href="./games.html">Jeux</a><a href="./catalog.html">Mods</a><a href="./creator-studio.html">Créer</a><a href="./ecosystem.html">Écosystème</a><a href="./community.html">Communauté</a><a href="./search.html">Recherche</a><a href="./security.html">Sécurité</a><a href="./documentation.html">Documentation</a></nav>'
          style_anchor = '  <link rel="stylesheet" href="./assets/nova-premium-hd-secondary.css">\n'
          style_extra = '  <link rel="stylesheet" href="./assets/modaryx-secondary-premium.css?v=20260911-1">\n  <link rel="stylesheet" href="./assets/modaryx-release-projects-premium.css?v=20260911-1">\n'

          for name, (title, canonical) in pages.items():
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              title_line = f'  <title>{title}</title>\n'
              if f'rel="canonical" href="{canonical}"' not in text:
                  if text.count(title_line) != 1:
                      raise SystemExit(f'{name}: title target mismatch')
                  text = text.replace(title_line, title_line + f'  <link rel="canonical" href="{canonical}">\n', 1)
              if 'modaryx-release-projects-premium.css' not in text:
                  if text.count(style_anchor) != 1:
                      raise SystemExit(f'{name}: style anchor mismatch')
                  text = text.replace(style_anchor, style_anchor + style_extra, 1)
              text, count = re.subn(r'<nav\b[^>]*>.*?</nav>', nav, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{name}: navigation replacement failed')
              p.write_text(text, encoding='utf-8', newline='\n')

          p = Path('downloads.html')
          text = p.read_text(encoding='utf-8')
          text = replace_once(text,
              '<p class="eyebrow">Distribution publique · fail-closed</p>\n        <h1 id="downloads-page-title">Aucun fichier sans chaîne de confiance.</h1>',
              '<p class="eyebrow">MODARYX MODS · distribution publique</p>\n        <h1 id="downloads-page-title">Publier moins vite.<br>Vérifier mieux.</h1>',
              'downloads hero')
          p.write_text(text, encoding='utf-8', newline='\n')

          p = Path('verify.html')
          text = p.read_text(encoding='utf-8')
          text = replace_once(text,
              '<p class="eyebrow">Intégrité locale · SHA-256</p>\n        <h1 id="verify-title">Vérifier un fichier sans l’envoyer.</h1>',
              '<p class="eyebrow">MODARYX MODS · intégrité locale</p>\n        <h1 id="verify-title">Une empreinte.<br>Une vérification locale.</h1>',
              'verify hero')
          p.write_text(text, encoding='utf-8', newline='\n')

          p = Path('project.html')
          text = p.read_text(encoding='utf-8')
          text = replace_once(text,
              '<section class="section" aria-labelledby="project-directory-title"><p class="eyebrow">Mini-hubs publics</p><h1 id="project-directory-title">Une URL stable par entrée.</h1><p class="section-intro">',
              '<section class="project-hero project-directory-hero" aria-labelledby="project-directory-title"><div><p class="eyebrow">MODARYX MODS · mini-hubs publics</p><h1 id="project-directory-title">Chaque création garde son identité.</h1><p class="lede">',
              'project directory hero start')
          text = replace_once(text,
              'une autre entrée.</p></section>\n    <section class="project-grid"',
              'une autre entrée.</p></div><aside class="project-section"><p class="eyebrow">Contrat public</p><h2>Static-first. Provider-neutral.</h2><p>Compatibilité, provenance, droits et distribution restent qualifiés séparément ; aucune preuve absente n’est remplacée par une promesse visuelle.</p></aside></section>\n    <section class="project-grid"',
              'project directory hero end')
          p.write_text(text, encoding='utf-8', newline='\n')

          if not Path('assets/modaryx-release-projects-premium.css').is_file():
              raise SystemExit('premium stylesheet file missing')

          checks = {
              'downloads.html': ('assets/downloads.js','data-download-state','available=false','artifacts=[]','Publier moins vite.','https://modaryxmods.com/downloads'),
              'verify.html': ('assets/verify.js','id="verify-file"','data-verify-file','id="expected-sha256"','Une empreinte.','https://modaryxmods.com/verify'),
              'project.html': ('project-hero project-directory-hero','project-ember-textures.html','project-balanced-latency-pack.html','project-forge-night-experience.html','https://modaryxmods.com/project'),
              'project-ember-textures.html': ('data-project-id="ember-textures"','assets/project-hub.js','id="project-favorite"','https://modaryxmods.com/project-ember-textures'),
              'project-balanced-latency-pack.html': ('data-project-id="balanced-latency-pack"','assets/project-hub.js','id="project-favorite"','https://modaryxmods.com/project-balanced-latency-pack'),
              'project-forge-night-experience.html': ('data-project-id="forge-night-experience"','assets/project-hub.js','id="project-favorite"','https://modaryxmods.com/project-forge-night-experience'),
          }
          for name, needles in checks.items():
              content = Path(name).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in content:
                      raise SystemExit(f'{name}: missing {needle}')
              if 'modaryx-release-projects-premium.css' not in content:
                  raise SystemExit(f'{name}: premium stylesheet missing')
              for forbidden in ('Nova Forge','NOVA FORGE','getnovaforge.com'):
                  if forbidden in content:
                      raise SystemExit(f'{name}: stale public brand {forbidden}')

          print('MODARYX_RELEASE_PROJECTS_PREMIUM_PROOF=PASS')
          print('DOWNLOAD_FAIL_CLOSED_MARKERS=PRESERVED')
          print('VERIFY_LOCAL_SHA256_MARKERS=PRESERVED')
          print('PROJECT_HUB_IDENTITIES=PRESERVED')
          print('PUBLIC_BRAND=MODARYX MODS')
          PY
      - name: Commit targeted release and project polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads.html verify.html project.html project-ember-textures.html project-balanced-latency-pack.html project-forge-night-experience.html
          git commit -m "feat(site): premiumize release and project surfaces"
          git push origin HEAD:site/modaryx-vf-premium-hd-v2
