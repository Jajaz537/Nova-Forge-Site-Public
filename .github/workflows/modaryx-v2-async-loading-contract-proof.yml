name: MODARYX V2 Async Loading Contract Proof

on:
  push:
    branches:
      - 'audit/modaryx-v2-legacy-boundary-20261003'
    paths:
      - '.github/workflows/modaryx-v2-async-loading-contract-proof.yml'
      - 'qa/modaryx-v2-async-loading-contract.json'
      - 'docs/MODARYX-V2-ASYNC-LOADING-STATE-CONTRACT-20261004.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Validate async loading contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate contract
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.schemaVersion == 1' qa/modaryx-v2-async-loading-contract.json >/dev/null
          jq -e '.states | index("LOADING_INITIAL") != null' qa/modaryx-v2-async-loading-contract.json >/dev/null
          jq -e '.states | index("REFRESHING_STALE") != null' qa/modaryx-v2-async-loading-contract.json >/dev/null
          jq -e '.states | index("ERROR_RECOVERABLE") != null' qa/modaryx-v2-async-loading-contract.json >/dev/null
          jq -e '.states | index("OFFLINE_STALE") != null' qa/modaryx-v2-async-loading-contract.json >/dev/null
          jq -e '.invariants | index("RIGHTS_LOADING_FAILS_CLOSED") != null' qa/modaryx-v2-async-loading-contract.json >/dev/null
          jq -e '.invariants | index("NO_FAKE_PROGRESS_PERCENT") != null' qa/modaryx-v2-async-loading-contract.json >/dev/null
          jq -e '.skeletonRules.reducedMotionStatic == true' qa/modaryx-v2-async-loading-contract.json >/dev/null
          echo "ASYNC_STATE_COUNT $(jq '.states | length' qa/modaryx-v2-async-loading-contract.json)"
          echo "ASYNC_INVARIANT_COUNT $(jq '.invariants | length' qa/modaryx-v2-async-loading-contract.json)"
          echo "PASS_V2_ASYNC_LOADING_CONTRACT"
