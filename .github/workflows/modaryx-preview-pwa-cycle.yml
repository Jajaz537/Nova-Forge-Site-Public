name: MODARYX Preview HTTPS PWA Cycle

on:
  pull_request:
    branches:
      - design/modaryx-premium-hd-20260914-work
    paths:
      - '.github/workflows/modaryx-preview-pwa-cycle.yml'
      - 'qa/check-preview-pwa-cycle.mjs'
      - 'sw.js'
      - 'assets/shell.js'
      - 'assets/app.js'
      - 'catalog.html'
      - 'games/**'
      - 'data/catalog.json'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: modaryx-preview-pwa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-pwa:
    name: Chromium HTTPS offline online cycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Locate Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --version
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Resolve immutable Cloudflare preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          WORK_PR_NUMBER: '12'
        run: |
          set -euo pipefail
          test -n "$PR_NUMBER"

          FILES="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100")"

          QA_ONLY="$(FILES="$FILES" node -e '
            const files=JSON.parse(process.env.FILES);
            const allowed=new Set([
              ".github/workflows/modaryx-preview-pwa-cycle.yml",
              "qa/check-preview-pwa-cycle.mjs"
            ]);
            process.stdout.write(files.length>0 && files.every((item)=>allowed.has(item.filename)) ? "true" : "false");
          ')"

          TARGET_PR="$PR_NUMBER"
          TARGET_SHA="$HEAD_SHA"
          if test "$QA_ONLY" = "true"; then
            TARGET_PR="$WORK_PR_NUMBER"
            TARGET_SHA="$BASE_SHA"
            echo "QA-only candidate: using immutable preview for unchanged base $TARGET_SHA"
          fi

          SHORT_SHA="${TARGET_SHA:0:7}"
          for attempt in {1..60}; do
            COMMENTS="$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$TARGET_PR/comments?per_page=100")"
            PREVIEW="$(COMMENTS="$COMMENTS" SHORT_SHA="$SHORT_SHA" node -e '
              const comments=JSON.parse(process.env.COMMENTS);
              const short=process.env.SHORT_SHA;
              for (const item of [...comments].reverse()) {
                const body=item.body||"";
                const user=item.user?.login||"";
                if (user!=="cloudflare-workers-and-pages[bot]") continue;
                if (!body.includes("Deploy successful") || !body.includes("<code>"+short+"</code>")) continue;
                const marker="Preview URL:</strong></td><td>";
                const markerAt=body.indexOf(marker);
                if (markerAt<0) continue;
                const hrefMarker="<a href=\x27";
                const hrefAt=body.indexOf(hrefMarker,markerAt);
                if (hrefAt<0) continue;
                const start=hrefAt+hrefMarker.length;
                const end=body.indexOf("\x27",start);
                if (end<0) continue;
                const url=body.slice(start,end);
                if (url.startsWith("https://")) {
                  process.stdout.write(url);
                  break;
                }
              }
            ')"
            if test -n "$PREVIEW"; then
              echo "MODARYX_PREVIEW_ORIGIN=$PREVIEW" >> "$GITHUB_ENV"
              echo "Resolved preview: $PREVIEW"
              exit 0
            fi
            sleep 5
          done
          echo "No Cloudflare preview found for target $TARGET_SHA" >&2
          exit 1

      - name: Run deployed HTTPS PWA cycle proof
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node qa/check-preview-pwa-cycle.mjs
