name: MODARYX V2 Backend Client Candidate Proof

on:
  push:
    branches:
      - 'chatgpt/modaryx-v2-backend-client-20261006'
    paths:
      - '.github/workflows/modaryx-v2-backend-client-proof.yml'
      - 'v2/src/App.jsx'
      - 'v2/src/api/modaryx-api.js'
      - 'qa/modaryx-v2-backend-client-contract.json'
      - 'qa/check-v2-backend-client.mjs'
      - 'qa/modaryx-v2-preproduction-contract-registry.json'
  pull_request:
    branches:
      - 'design/modaryx-v2-blue-violet-product-20261005'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modaryx-v2-backend-client-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Prove V2 same-origin backend client without fake auth
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate backend client contract
        run: |
          set -euo pipefail
          node qa/check-v2-backend-client.mjs
          node qa/check-v2-preproduction-contract-registry.mjs
      - name: Build exact V2 root
        working-directory: v2
        run: |
          npm ci
          npm run build
      - name: Start V2 candidate
        working-directory: v2
        run: |
          node ./node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4184 >/tmp/modaryx-v2-backend-client.log 2>&1 &
          echo $! >/tmp/modaryx-v2-backend-client.pid
          for attempt in {1..80}; do curl --fail --silent http://127.0.0.1:4184/ >/dev/null && exit 0; sleep 0.25; done
          cat /tmp/modaryx-v2-backend-client.log
          exit 1
      - name: Re-run product flows with backend absent
        env:
          MODARYX_REVIEW_ORIGIN: http://127.0.0.1:4184
        run: |
          node qa/check-v2-living-threshold-product-flows.mjs
          echo PASS_V2_BACKEND_CLIENT_CANDIDATE
      - name: Cleanup
        if: always()
        run: |
          if test -f /tmp/modaryx-v2-backend-client.pid; then kill "$(cat /tmp/modaryx-v2-backend-client.pid)" 2>/dev/null || true; fi
