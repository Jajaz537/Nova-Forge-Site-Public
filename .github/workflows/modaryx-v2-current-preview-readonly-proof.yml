name: MODARYX V2 Current Preview Read-Only Proof

on:
  push:
    branches:
      - 'chatgpt/modaryx-v2-current-preview-readonly-proof-20261006'
    paths:
      - '.github/workflows/modaryx-v2-current-preview-readonly-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modaryx-v2-current-preview-readonly-proof
  cancel-in-progress: true

jobs:
  proof:
    name: Probe exact current Cloudflare preview with GET/HEAD only
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact proof branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Verify source relation
        env:
          MODARYX_EXPECTED_SOURCE_SHA: 5a8e66f096a1482bb98044b12894c9b615364104
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$MODARYX_EXPECTED_SOURCE_SHA"
          echo "PROBED_SOURCE_SHA=$MODARYX_EXPECTED_SOURCE_SHA"

      - name: Read-only PRE_CUTOVER probe
        env:
          MODARYX_PRODUCTION_ORIGIN: https://ca255dbb.nova-forge-site-public.pages.dev
          MODARYX_EXPECTED_MODE: PRE_CUTOVER
        run: |
          set -euo pipefail
          node qa/check-v2-production-evidence-origin.mjs
          echo PASS_V2_CURRENT_PREVIEW_READ_ONLY_PROOF
