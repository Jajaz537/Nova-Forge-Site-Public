name: MODARYX IA P6 final cloud evidence

on:
  workflow_dispatch:
    inputs:
      site_origin:
        description: Immutable Cloudflare Pages preview origin
        required: true
        type: string
        default: "https://2f4f6f67.nova-forge-site-public.pages.dev"
      site_sha:
        description: Exact Git SHA deployed to that origin
        required: true
        type: string
        default: "0c193b4c42e1dcc05adeda483596eff8c557beee"

permissions:
  contents: read
  checks: read

jobs:
  consolidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    env:
      SITE_ORIGIN: ${{ inputs.site_origin }}
      EXPECTED_SITE_SHA: ${{ inputs.site_sha }}
      FOUNDATION_VERSION: "0.144.0"
      FOUNDATION_SHA256: "799607c09f20ecade4c50cd78b96d5d67856ca789b7551a9fd8634aa6ae5f2d2"
    steps:
      - name: Verify immutable preview origin against exact deployed Git SHA
        env:
          GH_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import json, os, re, urllib.request
          from html.parser import HTMLParser
          from pathlib import Path
          origin=os.environ['SITE_ORIGIN']
          sha=os.environ['EXPECTED_SITE_SHA']
          if not re.fullmatch(r'https://[0-9a-f]{8}\.nova-forge-site-public\.pages\.dev',origin):
              raise SystemExit('P6 invalid immutable preview origin')
          if not re.fullmatch(r'[0-9a-f]{40}',sha):
              raise SystemExit('P6 invalid deployed Git SHA')
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(); self.urls=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='a':
                      self.urls.extend(v for k,v in attrs if k=='href')
          api=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/commits/{sha}/check-runs?per_page=100"
          request=urllib.request.Request(api,headers={
              'Authorization':'Bearer '+os.environ['GH_READ_TOKEN'],
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
          })
          try:
              with urllib.request.urlopen(request,timeout=20) as response:
                  data=json.load(response)
          except Exception:
              raise SystemExit('P6 deployed SHA provenance unavailable')
          matches=[]
          for check in data.get('check_runs',[]):
              if check.get('head_sha')!=sha or check.get('name')!='Cloudflare Pages' or check.get('conclusion')!='success':
                  continue
              links=Links(); links.feed((check.get('output') or {}).get('summary') or '')
              if origin in links.urls:
                  matches.append({'check_id':check['id'],'check_url':check.get('html_url'),'deployment_id':check.get('external_id')})
          if not matches:
              raise SystemExit('P6 origin does not match successful exact-SHA Pages deployment')
          Path('evidence/deployment-provenance.json').write_text(json.dumps({
              'schema':'modaryx-p6-deployment-provenance-v1',
              'site_origin':origin,'site_sha':sha,'checks':matches,
              'status':'PASS','awards_vf_points':False,
          },indent=2),encoding='utf-8')
          print('MODARYX_P6_DEPLOYMENT_PROVENANCE_PASS')
          PY

      - name: Wait for Founder receipt and consolidate all five P6 gates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/assets

          ready=false
          for i in $(seq 1 360); do
            body="$(mktemp)"
            code="$(curl -sS -o "$body" -w '%{http_code}' --max-time 10 "${SITE_ORIGIN}/api/p6/evidence" || true)"
            if [ "$code" = "200" ] && [ "$(jq -r '.ready == true' "$body" 2>/dev/null || echo false)" = "true" ]; then
              cp "$body" evidence/founder-receipt-wrapper.json
              jq '.receipt' "$body" > evidence/founder-receipt.json
              rm -f "$body"
              ready=true
              break
            fi
            rm -f "$body"
            sleep 5
          done

          if [ "$ready" != "true" ]; then
            jq -n '{
              schema:"modaryx-p6-final-cloud-evidence-v1",
              status:"NOT_RUN",
              reason:"founder_receipt_not_available",
              secret_values_recorded:false,
              awards_vf_points:false
            }' > evidence/result.json
            echo "MODARYX_P6_FINAL_CLOUD_NOT_RUN founder_receipt_not_available"
            exit 4
          fi

          receipt="evidence/founder-receipt.json"
          python3 - "$receipt" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          if data.get('deployment_origin')!=os.environ['SITE_ORIGIN']:
              raise SystemExit('P6 Founder receipt origin mismatch')
          try:
              created=datetime.fromisoformat(data['created_at'].replace('Z','+00:00'))
              expires=datetime.fromisoformat(data['expires_at'].replace('Z','+00:00'))
              now=datetime.now(timezone.utc)
              valid=created<=now<expires and 0<(expires-created).total_seconds()<=1200
          except Exception:
              valid=False
          if not valid:
              raise SystemExit('P6 Founder receipt missing, expired, or invalid')
          PY

          test "$(jq -r '.schema' "$receipt")" = "modaryx-p6-founder-e2e-receipt-v1"
          test "$(jq -r '.overall_status' "$receipt")" = "PASS"
          test "$(jq -r '.founder_session.status' "$receipt")" = "PASS"
          test "$(jq -r '.private_status.status' "$receipt")" = "PASS"
          test "$(jq -r '.signed_chat.status' "$receipt")" = "PASS"
          test "$(jq -r '.secrets_recorded' "$receipt")" = "false"
          test "$(jq -r '.identity_recorded' "$receipt")" = "false"
          test "$(jq -r '.chat_content_recorded' "$receipt")" = "false"

          status_code="$(curl -sS -o evidence/public-status-body.txt -w '%{http_code}' --max-time 20 "${SITE_ORIGIN}/api/founder/ai/status" || true)"
          chat_code="$(curl -sS -o evidence/public-chat-body.txt -w '%{http_code}' --max-time 20 \
            -X POST -H 'Content-Type: application/json' \
            --data '{"conversation_id":"public-proof","message":"hello"}' \
            "${SITE_ORIGIN}/api/founder/ai/chat" || true)"
          test "$status_code" = "404"
          test "$chat_code" = "404"
          jq -n '{
            status:"INCONCLUSIVE",
            unauthenticated_status:{status:"PASS",http:404},
            unauthenticated_chat:{status:"PASS",http:404},
            authenticated_non_founder:{status:"NOT_RUN"},
            awards_vf_points:false
          }' > evidence/public-denial-partial.json

          curl -fsSL --max-time 30 "${SITE_ORIGIN}/" -o evidence/index.html
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin
          import hashlib, json, os, re, urllib.request

          origin=os.environ["SITE_ORIGIN"]
          html=Path("evidence/index.html").read_text("utf-8",errors="replace")
          urls=[]
          for attr in ("src","href"):
              for m in re.finditer(rf'{attr}=["\']([^"\']+)["\']',html,re.I):
                  raw=m.group(1)
                  if re.search(r'\.(?:js|mjs|css)(?:\?|$)',raw,re.I):
                      urls.append(urljoin(origin+"/",raw))
          urls=sorted(set(urls))
          if not urls:
              raise SystemExit('browser assets missing; proof incomplete')
          corpus=html
          rows=[]
          for i,u in enumerate(urls):
              try:
                  data=urllib.request.urlopen(u,timeout=30).read()
              except Exception:
                  raise SystemExit('browser asset unavailable; proof incomplete')
              p=Path("evidence/assets")/f"{i:03d}.asset"
              p.write_bytes(data)
              text=data.decode("utf-8",errors="replace")
              corpus+="\n"+text
              rows.append({"url":u,"sha256":hashlib.sha256(data).hexdigest(),"bytes":len(data)})
          forbidden=[
              "MODARYX_AI_BRIDGE_KEY_HEX",
              "x-modaryx-signature",
              "x-modaryx-body-sha256",
              "x-modaryx-nonce",
          ]
          hits={x:(x.lower() in corpus.lower()) for x in forbidden}
          if any(hits.values()):
              raise SystemExit("browser secret/signature material found")
          Path("evidence/browser-secret-absence.json").write_text(json.dumps({
              "status":"INCONCLUSIVE","bundle_scan_status":"PASS",
              "browser_storage_status":"NOT_RUN","client_logs_status":"NOT_RUN",
              "assets":rows,"forbidden_hits":hits
          },indent=2),encoding="utf-8")
          PY

          created_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          run_id="site-$(date -u +%Y%m%d-%H%M%S)"
          jq -n \
            --arg schema "modaryx-site-founder-integration-v1" \
            --arg run_id "$run_id" \
            --arg created_at "$created_at" \
            --arg site_origin "$SITE_ORIGIN" \
            --arg version "$FOUNDATION_VERSION" \
            --arg sha "$FOUNDATION_SHA256" \
            '{
              schema:$schema,
              run_id:$run_id,
              created_at:$created_at,
              site_origin:$site_origin,
              foundation:{version:$version,sha256:$sha},
              gates:{
                founder_session:{status:"PASS",evidence:["evidence/founder-receipt.json"],details:{source:"real_founder_session"}},
                public_denial:{status:"INCONCLUSIVE",evidence:["evidence/public-denial-partial.json","evidence/public-status-body.txt","evidence/public-chat-body.txt"],details:{unauthenticated_status_http:404,unauthenticated_chat_http:404,authenticated_non_founder:"NOT_RUN"}},
                private_status:{status:"PASS",evidence:["evidence/founder-receipt.json"],details:{protocol:"modaryx-founder-bridge-v1"}},
                signed_chat:{status:"PASS",evidence:["evidence/founder-receipt.json"],details:{source:"real_founder_signed_chat"}},
                browser_secret_absence:{status:"INCONCLUSIVE",evidence:["evidence/browser-secret-absence.json"],details:{bundle_scan:"PASS",browser_storage:"NOT_RUN",client_logs:"NOT_RUN"}}
              },
              overall_status:"INCONCLUSIVE",
              notes:["Real Founder receipt is short-lived and excludes identity, chat content and secrets.","Authenticated non-Founder denial and browser storage/client-log observation are NOT_RUN; no P6 points are eligible."]
            }' > evidence/site-integration.json

          jq -n \
            --arg schema "modaryx-p6-final-cloud-evidence-v1" \
            --arg created_at "$created_at" \
            '{
              schema:$schema,
              status:"INCONCLUSIVE",
              created_at:$created_at,
              founder_session:"PASS",
              public_denial:"INCONCLUSIVE",
              private_status:"PASS",
              signed_chat:"PASS",
              browser_secret_absence:"INCONCLUSIVE",
              identity_recorded:false,
              secrets_recorded:false,
              chat_content_recorded:false,
              native_foundation_gate:"INCOMPLETE_EVIDENCE",
              suggested_points_P6:0,
              applied:false
            }' > evidence/result.json

          echo "MODARYX_P6_FINAL_CLOUD_INCONCLUSIVE authenticatedNonFounder=NOT_RUN browserStorage=NOT_RUN clientLogs=NOT_RUN"
          exit 3

      - name: Upload final P6 cloud evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: modaryx-ai-p6-final-cloud-evidence
          path: evidence
          if-no-files-found: warn
          retention-days: 30

