name: MODARYX project hubs browser microproof

on:
  push:
    branches:
      - site/modaryx-vf-premium-hd-v3
    paths:
      - '.github/workflows/modaryx-project-hubs-browser-microproof.yml'
      - 'project.html'
      - 'project-ember-textures.html'
      - 'project-balanced-latency-pack.html'
      - 'project-forge-night-experience.html'
      - 'assets/project-hub.css'
      - 'assets/modaryx-release-projects-premium.css'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-hubs-browser-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZONE_NAME: modaryxmods.com
      PROJECT_NAME: nova-forge-site-public
      TARGET_BRANCH: site/modaryx-vf-premium-hd-v3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site/modaryx-vf-premium-hd-v3
          fetch-depth: 1

      - name: Resolve successful Cloudflare preview
        id: preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          zones="$(curl -fsS "${auth[@]}" "$api/zones?name=$ZONE_NAME")"
          account_id="$(jq -r '.result[0].account.id' <<<"$zones")"
          test -n "$account_id" && test "$account_id" != "null"
          preview_url=""
          for attempt in $(seq 1 36); do
            deployments="$(curl -fsS "${auth[@]}" "$api/accounts/$account_id/pages/projects/$PROJECT_NAME/deployments")"
            candidate="$(DEPLOYMENTS="$deployments" python3 - <<'PY'
          import json, os
          data=json.loads(os.environ['DEPLOYMENTS']); target=os.environ['TARGET_BRANCH']; rows=[]
          for dep in data.get('result',[]):
              meta=((dep.get('deployment_trigger') or {}).get('metadata') or {})
              if meta.get('branch')==target and dep.get('environment')=='preview': rows.append(dep)
          rows.sort(key=lambda d:d.get('created_on',''), reverse=True)
          if rows:
              d=rows[0]; print((d.get('latest_stage') or {}).get('status','unknown')+'|'+d.get('url',''))
          PY
            )"
            status="${candidate%%|*}"; url="${candidate#*|}"
            echo "preview_wait attempt=$attempt status=${status:-none}"
            if [ "$status" = "success" ] && [ -n "$url" ]; then preview_url="$url"; break; fi
            sleep 5
          done
          test -n "$preview_url"
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Capture project hubs responsive proofs
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          mkdir -p project-hubs-proof
          shot(){
            local name="$1" width="$2" height="$3" path="$4"
            "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --disable-dev-shm-usage --force-device-scale-factor=1 --window-size="${width},${height}" --screenshot="project-hubs-proof/${name}.png" "${PREVIEW_URL}${path}" >/tmp/${name}.log 2>&1
          }
          for spec in \
            'directory|/project.html' \
            'ember|/project-ember-textures.html' \
            'latency|/project-balanced-latency-pack.html' \
            'night|/project-forge-night-experience.html'; do
            name="${spec%%|*}"; path="${spec#*|}"
            shot "${name}-desktop" 1440 900 "$path"
            shot "${name}-tablet" 1024 768 "$path"
            shot "${name}-mobile" 390 844 "$path"
          done

          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1440,900 --dump-dom "$PREVIEW_URL/project.html" > project-hubs-proof/directory-dom.html 2>/tmp/directory-dom.log
          grep -Fq 'Chaque création garde son identité.' project-hubs-proof/directory-dom.html
          grep -Fq 'Static-first. Provider-neutral.' project-hubs-proof/directory-dom.html
          grep -Fq 'Ember Textures' project-hubs-proof/directory-dom.html
          grep -Fq 'Balanced Latency Pack' project-hubs-proof/directory-dom.html
          grep -Fq 'Forge Night Experience' project-hubs-proof/directory-dom.html

          for page in ember-textures balanced-latency-pack forge-night-experience; do
            "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1440,900 --dump-dom "$PREVIEW_URL/project-${page}.html" > "project-hubs-proof/${page}-dom.html" 2>/tmp/${page}-dom.log
            grep -Fq 'data-project-id=' "project-hubs-proof/${page}-dom.html"
            grep -Fq 'project-favorite' "project-hubs-proof/${page}-dom.html"
          done

          python3 - <<'PY'
          from pathlib import Path
          import struct,zlib
          expected={}
          for name in ('directory','ember','latency','night'):
              expected[f'{name}-desktop.png']=(1440,900)
              expected[f'{name}-tablet.png']=(1024,768)
              expected[f'{name}-mobile.png']=(390,844)
          for name,dims in expected.items():
              data=(Path('project-hubs-proof')/name).read_bytes()
              if len(data)<12000: raise SystemExit(f'{name}: unexpectedly small {len(data)}')
              if data[:8]!=b'\x89PNG\r\n\x1a\n': raise SystemExit(f'{name}: not PNG')
              w,h=struct.unpack('>II',data[16:24])
              if (w,h)!=dims: raise SystemExit(f'{name}: dimensions {(w,h)} != {dims}')
              pos=8; raw=b''; bd=ct=None
              while pos<len(data):
                  n=struct.unpack('>I',data[pos:pos+4])[0]; typ=data[pos+4:pos+8]; chunk=data[pos+8:pos+8+n]; pos+=12+n
                  if typ==b'IHDR': bd=chunk[8]; ct=chunk[9]
                  elif typ==b'IDAT': raw+=chunk
                  elif typ==b'IEND': break
              if bd!=8 or ct not in (2,6): raise SystemExit(f'{name}: PNG mode drift')
              decoded=zlib.decompress(raw); sample=decoded[::max(1,len(decoded)//10000)]
              if len(set(sample))<12: raise SystemExit(f'{name}: low entropy')
          print('PROJECT_HUBS_RESPONSIVE_RENDER_PASS')
          print('PROJECT_HUBS_DOM_MARKERS_PASS')
          print('PRODUCTION_NOT_CHANGED=yes')
          print('DNSSEC_NOT_CHANGED=yes')
          PY

      - name: Upload project hubs proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modaryx-project-hubs-browser-proof
          path: project-hubs-proof/*
          if-no-files-found: warn
          retention-days: 7
