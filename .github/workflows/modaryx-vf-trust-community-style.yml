name: MODARYX VF trust community style

on:
  push:
    branches:
      - site/modaryx-vf-premium-hd-v2
    paths:
      - '.github/modaryx-vf-trust-community-style-trigger.json'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site/modaryx-vf-premium-hd-v2
          fetch-depth: 0
      - name: Apply premium visual layer without changing behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          targets = {
              'community.html': ('Communauté — MODARYX MODS', 'https://modaryxmods.com/community'),
              'profiles.html': ('Profiles & Passkeys — MODARYX MODS', 'https://modaryxmods.com/profiles'),
              'security.html': ('Sécurité & provenance — MODARYX MODS', 'https://modaryxmods.com/security'),
              'documentation.html': ('Documentation publique — MODARYX MODS', 'https://modaryxmods.com/documentation'),
          }
          for name, (title, canonical) in targets.items():
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              title_line = f'  <title>{title}</title>\n'
              if f'rel="canonical" href="{canonical}"' not in text:
                  if text.count(title_line) != 1:
                      raise SystemExit(f'{name}: title target mismatch')
                  text = text.replace(title_line, title_line + f'  <link rel="canonical" href="{canonical}">\n', 1)
              style_line = '  <link rel="stylesheet" href="./assets/nova-premium-hd-secondary.css">\n'
              premium = '  <link rel="stylesheet" href="./assets/modaryx-secondary-premium.css?v=20260911-1">\n  <link rel="stylesheet" href="./assets/modaryx-trust-community-premium.css?v=20260911-1">\n'
              if 'modaryx-trust-community-premium.css' not in text:
                  if text.count(style_line) != 1:
                      raise SystemExit(f'{name}: stylesheet target mismatch')
                  text = text.replace(style_line, style_line + premium, 1)
              p.write_text(text, encoding='utf-8', newline='\n')

          functional = {
              'community.html': ('id="collection-form"','id="submission-form"','assets/community.js'),
              'profiles.html': ('assets/profiles.js',),
              'security.html': ('id="chain"','id="states"','id="proofs"'),
              'documentation.html': ('id="verification"','id="status"','id="privacy"','id="limits"'),
          }
          for name, needles in functional.items():
              text = Path(name).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'{name}: missing functional marker {needle}')
              for forbidden in ('Nova Forge','NOVA FORGE','getnovaforge.com'):
                  if forbidden in text:
                      raise SystemExit(f'{name}: stale public brand {forbidden}')
              if 'modaryx-trust-community-premium.css' not in text:
                  raise SystemExit(f'{name}: premium layer missing')
          print('MODARYX_TRUST_COMMUNITY_STYLE_PROOF=PASS')
          print('BEHAVIORAL_MARKERS=PRESERVED')
          print('PUBLIC_BRAND=MODARYX MODS')
          PY
      - name: Commit targeted premium styling
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community.html profiles.html security.html documentation.html
          git commit -m "feat(site): premiumize trust and community surfaces"
          git push origin HEAD:site/modaryx-vf-premium-hd-v2
