name: MODARYX v3 wire exact baby homepage scene

on:
  push:
    branches:
      - site/modaryx-vf-premium-hd-v3
    paths:
      - '.github/workflows/modaryx-v3-wire-baby-home.yml'

permissions:
  contents: write

jobs:
  wire-baby-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site/modaryx-vf-premium-hd-v3
          fetch-depth: 1

      - name: Wire exact board-02 babies into hero only
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/modaryx-home-babies.webp
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          asset = Path('assets/modaryx-home-babies.webp').read_bytes()
          assert len(asset) == 69960
          assert hashlib.sha256(asset).hexdigest() == '2e1aa635fae4f6ea882e153db2ee096fb345d8560f5ba67e033580e5384a9f1e'
          assert asset[:4] == b'RIFF' and asset[8:12] == b'WEBP'

          css_path = Path('assets/modaryx-vf.css')
          css = css_path.read_text()
          old_desktop = ".mx-hero-scene{min-height:560px;isolation:isolate;background:linear-gradient(90deg,rgba(5,7,10,.38),transparent 13%,transparent 87%,rgba(5,7,10,.4)),url('./modaryx-rar-hero.webp') 52% 50%/cover no-repeat}"
          new_desktop = ".mx-hero-scene{min-height:560px;isolation:isolate;background:linear-gradient(90deg,rgba(5,7,10,.28),transparent 11%,transparent 89%,rgba(5,7,10,.32)),url('./modaryx-home-babies.webp') 50% 50%/cover no-repeat}"
          old_mobile = ".mx-hero-scene{min-height:360px;background:linear-gradient(180deg,rgba(6,8,11,.1),rgba(6,8,11,.6))}"
          new_mobile = ".mx-hero-scene{min-height:360px;background:linear-gradient(180deg,rgba(6,8,11,.06),rgba(6,8,11,.42)),url('./modaryx-home-babies.webp') 50% 50%/cover no-repeat}"
          assert css.count(old_desktop) == 1, 'desktop hero source marker changed'
          assert css.count(old_mobile) == 1, 'mobile hero source marker changed'
          css = css.replace(old_desktop, new_desktop).replace(old_mobile, new_mobile)
          assert 'modaryx-rar-hero.webp' not in css
          assert css.count("url('./modaryx-home-babies.webp')") == 2
          css_path.write_text(css)

          html_path = Path('index.html')
          html = html_path.read_text()
          old_label = 'Loup et Dragon devant le royaume MODARYX, illustration issue de la maquette de référence'
          new_label = 'Bébé Loup et Bébé Dragon devant le royaume MODARYX, extrait fidèle de la planche 02 de référence'
          assert html.count(old_label) == 1, 'homepage scene aria marker changed'
          html = html.replace(old_label, new_label)
          html_path.write_text(html)

          print('BOARD02_BABY_ASSET_HASH=PASS')
          print('HERO_DESKTOP_BABIES_WIRED=PASS')
          print('HERO_MOBILE_BABIES_WIRED=PASS')
          print('HERO_BABY_ARIA=PASS')
          PY

      - name: Commit targeted hero wiring to preview branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/modaryx-vf.css index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No hero wiring change.'
            exit 0
          fi
          git commit -m "fix(site): show exact baby companions in v3 homepage hero"
          git push origin HEAD:site/modaryx-vf-premium-hd-v3
