name: MODARYX v3 rebuild exact homepage scene

on:
  push:
    branches:
      - site/modaryx-vf-premium-hd-v3
    paths:
      - '.github/workflows/modaryx-v3-rebuild-clean-art.yml'
      - '.github/modaryx-v3-clean-art-trigger.json'
      - '.github/v3-home-scene-exact/**'

permissions:
  contents: write

jobs:
  rebuild-home-scene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site/modaryx-vf-premium-hd-v3
          fetch-depth: 0

      - name: Recover exact scene from Git history
        id: recover
        shell: bash
        run: |
          set -euo pipefail
          target_sha='0e13399167bf0e50ba21aba143a1379b39501265f4254654b7f7d5e1078e5101'
          candidate="$(mktemp)"
          found='false'
          found_object=''
          found_path=''

          while read -r oid path; do
            [[ -n "$oid" ]] || continue
            [[ "$(git cat-file -t "$oid" 2>/dev/null || true)" == 'blob' ]] || continue
            [[ "$(git cat-file -s "$oid")" == '40840' ]] || continue
            git cat-file blob "$oid" > "$candidate"
            sha="$(sha256sum "$candidate" | awk '{print $1}')"
            if [[ "$sha" == "$target_sha" ]]; then
              cp "$candidate" assets/modaryx-reference-home-v3.webp
              found='true'
              found_object="$oid"
              found_path="$path"
              break
            fi
          done < <(git rev-list --objects --all)

          echo "HISTORY_REFERENCE_FOUND=$found"
          if [[ "$found" == 'true' ]]; then
            echo "HISTORY_REFERENCE_OBJECT=$found_object"
            echo "HISTORY_REFERENCE_PATH=$found_path"
            echo 'complete=true' >> "$GITHUB_OUTPUT"
          else
            echo 'complete=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild exact scene from reference board 02
        id: rebuild
        if: steps.recover.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t parts < <(find .github/v3-home-scene-exact -maxdepth 1 -type f -name 'part-*.b64' | sort)
          if [[ ${#parts[@]} -eq 0 ]]; then
            echo 'No exact source chunks found.'
            echo 'complete=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          joined="$(mktemp)"
          cat "${parts[@]}" | tr -d '\n\r ' > "$joined"
          chars="$(wc -c < "$joined" | tr -d ' ')"
          echo "EXACT_SOURCE_PARTS=${#parts[@]}"
          echo "EXACT_SOURCE_BASE64_CHARS=$chars"

          if [[ "$chars" -ne 54456 ]]; then
            echo 'V3_REFERENCE_HOME_SOURCE=INCOMPLETE'
            echo 'complete=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base64 -d "$joined" > assets/modaryx-reference-home-v3.webp
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          p = Path('assets/modaryx-reference-home-v3.webp')
          data = p.read_bytes()
          sha = hashlib.sha256(data).hexdigest()
          print(f'BYTES={len(data)}')
          print(f'SHA256={sha}')
          print(f'HEAD={data[:12]!r}')
          assert len(data) == 40840, f'unexpected size {len(data)}'
          assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', 'not a WebP RIFF container'
          assert int.from_bytes(data[4:8], 'little') + 8 == len(data), 'RIFF size mismatch'
          assert sha == '0e13399167bf0e50ba21aba143a1379b39501265f4254654b7f7d5e1078e5101', 'reference asset hash mismatch'
          print('V3_REFERENCE_HOME_ASSET=PASS')
          PY
          echo 'complete=true' >> "$GITHUB_OUTPUT"

      - name: Commit exact reference scene
        if: steps.recover.outputs.complete == 'true' || steps.rebuild.outputs.complete == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/modaryx-reference-home-v3.webp
          if git diff --cached --quiet; then
            echo 'No asset change.'
            exit 0
          fi
          git commit -m "feat(site): add exact v3 homepage reference scene"
          git push origin HEAD:site/modaryx-vf-premium-hd-v3
