name: MODARYX v3 diagnose clean reference art

on:
  push:
    branches:
      - site/modaryx-vf-premium-hd-v3
    paths:
      - '.github/workflows/modaryx-v3-rebuild-clean-art.yml'
      - '.github/modaryx-v3-clean-art-trigger.json'

permissions:
  contents: read

jobs:
  diagnose-clean-art:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site/modaryx-vf-premium-hd-v3
          fetch-depth: 0
      - name: Diagnose staged clean RAR chunks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, re, hashlib

          paths=[Path(f'.github/rar-art-clean/part-{i:02d}.b64') for i in range(4)]
          chunks=[]
          for p in paths:
              raw=p.read_text(encoding='utf-8')
              clean=''.join(raw.split())
              bad=sorted(set(re.sub(r'[A-Za-z0-9+/=]','',clean)))
              print(f'{p.name}: raw={len(raw)} clean={len(clean)} mod4={len(clean)%4} bad={bad!r}')
              print(f'  head={clean[:48]!r}')
              print(f'  tail={clean[-48:]!r}')
              chunks.append(clean)

          joined=''.join(chunks)
          print(f'JOINED_LEN={len(joined)} MOD4={len(joined)%4}')
          print(f'JOINED_BAD={sorted(set(re.sub(r"[A-Za-z0-9+/=]","",joined)))!r}')
          padded=joined + '='*((-len(joined))%4)
          try:
              data=base64.b64decode(padded, validate=False)
              print(f'DECODED_BYTES={len(data)}')
              print(f'DECODED_HEAD={data[:16]!r}')
              print(f'DECODED_SHA256={hashlib.sha256(data).hexdigest()}')
              if len(data)>=12:
                  print(f'RIFF={data[:4]==b"RIFF"} WEBP={data[8:12]==b"WEBP"}')
          except Exception as exc:
              print(f'DECODE_ERROR={type(exc).__name__}: {exc}')
              raise
          PY
