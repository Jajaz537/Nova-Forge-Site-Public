name: MODARYX V2 D1 Readiness Proof

on:
  push:
    branches:
      - 'chatgpt/modaryx-v2-d1-readiness-20261006'
    paths:
      - '.github/workflows/modaryx-v2-d1-readiness-proof.yml'
      - 'functions/_lib/d1-readiness.mjs'
      - 'functions/api/v1/status/d1-readiness.js'
      - 'qa/modaryx-v2-d1-readiness-contract.json'
      - 'qa/check-v2-d1-readiness.mjs'
      - 'qa/modaryx-v2-preproduction-contract-registry.json'
  pull_request:
    branches:
      - 'design/modaryx-v2-blue-violet-product-20261005'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modaryx-v2-d1-readiness-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Prove D1 readiness endpoint is read-only and fail-closed
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate read-only D1 readiness
        run: |
          set -euo pipefail
          node qa/check-v2-d1-readiness.mjs
          node qa/check-v2-preproduction-contract-registry.mjs
          echo PASS_V2_D1_READINESS_PROOF
      - name: Mirror Cloudflare root build
        run: npm run build
