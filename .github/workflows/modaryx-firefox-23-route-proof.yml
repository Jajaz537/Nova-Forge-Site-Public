name: MODARYX Firefox 23 Route Proof

on:
  pull_request:
    branches:
      - design/modaryx-premium-hd-20260914-work
    paths:
      - '.github/workflows/modaryx-firefox-23-route-proof.yml'
      - 'qa/check-firefox-23-route.mjs'
      - '*.html'
      - 'games/**'
      - 'gta-6/**'
      - 'red-dead-redemption-2/**'
      - 'assets/**'
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modaryx-firefox-23-route-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firefox-parity:
    name: Firefox 23-route targeted proof
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install pinned Playwright library
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.63.0
          npx playwright --version

      - name: Install Firefox runtime
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps firefox

      - name: Start local HTTP server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4182 --bind 127.0.0.1 >"$RUNNER_TEMP/modaryx-firefox-http.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/modaryx-firefox-http.pid"
          for attempt in {1..40}; do
            curl --fail --silent http://127.0.0.1:4182/index.html >/dev/null && exit 0
            sleep 0.25
          done
          cat "$RUNNER_TEMP/modaryx-firefox-http.log"
          exit 1

      - name: Run Firefox 23-route proof
        shell: bash
        env:
          MODARYX_TEST_ORIGIN: http://127.0.0.1:4182
          MODARYX_FIREFOX_OUT: ${{ runner.temp }}/modaryx-firefox-23-route
        run: |
          set -euo pipefail
          node qa/check-firefox-23-route.mjs

      - name: Upload Firefox evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: modaryx-firefox-23-route-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/modaryx-firefox-23-route
          if-no-files-found: error
          retention-days: 7

      - name: Stop local HTTP server
        if: always()
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/modaryx-firefox-http.pid" && kill "$(cat "$RUNNER_TEMP/modaryx-firefox-http.pid")" 2>/dev/null || true
