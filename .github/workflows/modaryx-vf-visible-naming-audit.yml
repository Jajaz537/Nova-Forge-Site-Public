name: MODARYX VF visible naming audit

on:
  push:
    branches:
      - site/modaryx-vf-premium-hd-v3
    paths:
      - '.github/modaryx-vf-visible-naming-audit-trigger.json'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site/modaryx-vf-premium-hd-v3
      - name: Audit final visible naming
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          exact_bad = (
              'Nova Forge',
              'NOVA FORGE',
              'getnovaforge.com',
          )
          old_asset_tokens = (
              'nova-mark.svg',
              'nova-mark-192.png',
              'nova-mark-512.png',
          )
          allowed_suffixes = {'.html', '.js', '.json', '.xml', '.webmanifest', '.txt'}
          explicit = {'robots.txt'}
          skip_dirs = {'.git', '.github', 'docs'}
          skip_files = {'SHA256SUMS.txt', 'NOVA-CONTINUITY-PUBLIC.md'}
          failures=[]
          checked=0
          for p in Path('.').rglob('*'):
              if not p.is_file():
                  continue
              if any(part in skip_dirs for part in p.parts):
                  continue
              if p.name in skip_files:
                  continue
              if p.suffix.lower() not in allowed_suffixes and p.name not in explicit:
                  continue
              try:
                  text=p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              checked += 1
              for token in exact_bad + old_asset_tokens:
                  if token in text:
                      for i,line in enumerate(text.splitlines(),1):
                          if token in line:
                              failures.append(f'{p}:{i}: {token}')
          if failures:
              print('MODARYX_VISIBLE_NAMING_AUDIT=FAIL')
              print('\n'.join(failures))
              raise SystemExit(1)
          print(f'MODARYX_VISIBLE_NAMING_AUDIT=PASS files={checked}')
          print('PUBLIC_BRAND=MODARYX MODS')
          print('OS_PUBLIC=Modaryx OS Public')
          print('OS_FONDATEUR=Modaryx OS Fondateur')
          print('GUIDE=Modaryx Guide')
          print('DOMAIN=modaryxmods.com')
          PY