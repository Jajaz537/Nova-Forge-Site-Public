name: MODARYX V2 Controlled R2 DEV Plan Proof

on:
  push:
    branches:
      - 'ops/modaryx-v2-r2-dev-controlled-20261007'
    paths:
      - '.github/workflows/modaryx-v2-r2-dev-controlled-plan-proof.yml'
      - 'qa/check-v2-r2-controlled-plan.mjs'
      - '.github/workflows/modaryx-v2-r2-dev-controlled-apply.yml'
      - 'functions/api/v1/qa/r2-proof.js'

permissions:
  contents: read

jobs:
  proof:
    name: Prove R2 DEV plan stays manual and fail-closed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout plan
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate controlled R2 plan
        run: |
          set -euo pipefail
          node qa/check-v2-r2-controlled-plan.mjs
          echo PASS_MODARYX_V2_CONTROLLED_R2_DEV_PLAN_PROOF
