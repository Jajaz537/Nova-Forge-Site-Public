name: MODARYX IA P6 Cloudflare API readiness

on:
  push:
    branches:
      - "chatgpt/modaryx-ai-founder-integration-20261005"
    paths:
      - ".github/workflows/modaryx-ai-p6-cloudflare-api-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZONE_NAME: modaryxmods.com
      PROJECT_NAME: nova-forge-site-public
      BRIDGE_HOSTNAME: ai-bridge.modaryxmods.com
    steps:
      - name: Probe Cloudflare API permissions and P6 configuration read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            jq -n --arg schema "modaryx-p6-cloudflare-api-readiness-v1"               '{schema:$schema,status:"NOT_RUN",reason:"CLOUDFLARE_API_TOKEN_missing",secret_values_logged:false,awards_vf_points:false}'               > evidence/readiness.json
            echo "MODARYX_P6_CF_API_NOT_RUN missing_token"
            exit 0
          fi

          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          verify="$(curl -fsS "${auth[@]}" "${api}/user/tokens/verify")"
          token_active="$(jq -r '.success == true and .result.status == "active"' <<<"$verify")"

          zones="$(curl -fsS "${auth[@]}" "${api}/zones?name=${ZONE_NAME}")"
          zone_count="$(jq '.result|length' <<<"$zones")"
          test "$zone_count" -eq 1
          zone_id="$(jq -r '.result[0].id' <<<"$zones")"
          account_id="$(jq -r '.result[0].account.id' <<<"$zones")"

          project="$(curl -fsS "${auth[@]}" "${api}/accounts/${account_id}/pages/projects/${PROJECT_NAME}")"
          project_ok="$(jq -r '.success == true' <<<"$project")"
          production_keys="$(jq -c '[.result.deployment_configs.production.env_vars // {} | to_entries[] | {key:.key,type:(.value.type // "unknown")}]' <<<"$project")"
          preview_keys="$(jq -c '[.result.deployment_configs.preview.env_vars // {} | to_entries[] | {key:.key,type:(.value.type // "unknown")}]' <<<"$project")"
          has_bridge_url="$(jq -r 'any(.[]; .key=="MODARYX_AI_BRIDGE_URL")' <<<"$production_keys")"
          has_bridge_key="$(jq -r 'any(.[]; .key=="MODARYX_AI_BRIDGE_KEY_HEX")' <<<"$production_keys")"

          tunnel_body="$(mktemp)"
          tunnel_code="$(curl -sS -o "$tunnel_body" -w '%{http_code}' "${auth[@]}" "${api}/accounts/${account_id}/cfd_tunnel?is_deleted=false&per_page=100")"
          tunnel_api_access=false
          tunnel_count=0
          if [ "$tunnel_code" = "200" ] && [ "$(jq -r '.success' "$tunnel_body")" = "true" ]; then
            tunnel_api_access=true
            tunnel_count="$(jq '.result|length' "$tunnel_body")"
          fi
          rm -f "$tunnel_body"

          dns="$(curl -fsS "${auth[@]}" "${api}/zones/${zone_id}/dns_records?name=${BRIDGE_HOSTNAME}&per_page=100")"
          dns_count="$(jq '.result|length' <<<"$dns")"
          dns_types="$(jq -c '[.result[].type] | unique' <<<"$dns")"

          jq -n             --arg schema "modaryx-p6-cloudflare-api-readiness-v1"             --argjson token_active "$token_active"             --argjson project_ok "$project_ok"             --argjson tunnel_api_access "$tunnel_api_access"             --argjson tunnel_count "$tunnel_count"             --argjson production_env_keys "$production_keys"             --argjson preview_env_keys "$preview_keys"             --argjson has_bridge_url "$has_bridge_url"             --argjson has_bridge_key "$has_bridge_key"             --argjson bridge_dns_record_count "$dns_count"             --argjson bridge_dns_types "$dns_types"             --arg tunnel_http_status "$tunnel_code"             '{
              schema:$schema,
              token_active:$token_active,
              pages_project_readable:$project_ok,
              tunnel_api_access:$tunnel_api_access,
              active_tunnel_count:$tunnel_count,
              tunnel_http_status:$tunnel_http_status,
              production_env_keys:$production_env_keys,
              preview_env_keys:$preview_env_keys,
              production_has_bridge_url:$has_bridge_url,
              production_has_bridge_key:$has_bridge_key,
              bridge_dns_record_count:$bridge_dns_record_count,
              bridge_dns_types:$bridge_dns_types,
              secret_values_logged:false,
              external_changes_made:false,
              awards_vf_points:false
            }' > evidence/readiness.json

          echo "MODARYX_P6_CF_API_READINESS token=${token_active} pages=${project_ok} tunnelApi=${tunnel_api_access} tunnels=${tunnel_count} bridgeUrlKey=${has_bridge_url} bridgeHmacKey=${has_bridge_key} dnsRecords=${dns_count}"

      - name: Upload P6 Cloudflare API readiness
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: modaryx-ai-p6-cloudflare-api-readiness
          path: evidence
          if-no-files-found: error
          retention-days: 30
