name: MODARYX V2 Fullstack Profile Proof Preview

on:
  push:
    branches:
      - 'feat/modaryx-v2-profile-editor-turnstile-20261007'
    paths:
      - '.github/workflows/modaryx-v2-fullstack-profile-proof-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modaryx-v2-fullstack-profile-proof-preview
  cancel-in-progress: true

env:
  CLOUDFLARE_ZONE_NAME: modaryxmods.com
  CLOUDFLARE_PROJECT_NAME: nova-forge-site-public
  PREVIEW_BRANCH: v2-profile-proof
  PREVIEW_ORIGIN: https://v2-profile-proof.nova-forge-site-public.pages.dev

jobs:
  deploy:
    name: Deploy V2 plus Pages Functions to isolated preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build V2
        working-directory: v2
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm run test:sites
          test -f dist/client/index.html

      - name: Add isolated preview guards and SPA fallback
        shell: bash
        run: |
          set -euo pipefail
          printf '/* /index.html 200\n' > v2/dist/client/_redirects
          cat > v2/dist/client/_headers <<'EOF'
          /*
            X-Robots-Tag: noindex, nofollow, noarchive
            Referrer-Policy: no-referrer
          EOF
          grep -q 'noindex,nofollow,noarchive' v2/dist/client/index.html
          echo PREVIEW_GUARDS=READY

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          zones="$(curl -fsS "${auth[@]}" "${api}/zones?name=${CLOUDFLARE_ZONE_NAME}")"
          test "$(jq -r '.success' <<<"$zones")" = "true"
          account_id="$(jq -r '.result[0].account.id' <<<"$zones")"
          test -n "$account_id"
          echo "::add-mask::$account_id"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"

      - name: Deploy full-stack V2 preview
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy v2/dist/client             --project-name="$CLOUDFLARE_PROJECT_NAME"             --branch="$PREVIEW_BRANCH"             --commit-hash="$GITHUB_SHA"             --commit-message="MODARYX V2 full-stack profile proof preview"             --commit-dirty=false
          echo FULLSTACK_PREVIEW_DEPLOYED=yes

      - name: Verify V2 static shell and Functions
        shell: bash
        run: |
          set -euo pipefail
          html=""
          for attempt in $(seq 1 30); do
            if html="$(curl -fsSL --max-time 20 "$PREVIEW_ORIGIN/account")"; then
              if grep -q 'MODARYX V2 — Candidat de production' <<<"$html"; then
                break
              fi
            fi
            sleep 2
          done
          grep -q 'MODARYX V2 — Candidat de production' <<<"$html"
          headers="$(curl -fsSI --max-time 20 "$PREVIEW_ORIGIN/account")"
          grep -qi 'x-robots-tag:.*noindex' <<<"$headers"

          status=""
          readiness=""
          for attempt in $(seq 1 24); do
            status="$(curl -fsS --max-time 20 "$PREVIEW_ORIGIN/api/v1/status" || true)"
            readiness="$(curl -fsS --max-time 20 "$PREVIEW_ORIGIN/api/v1/production/readiness" || true)"
            d1="$(jq -r '.bindings.d1 // false' <<<"$status" 2>/dev/null || echo false)"
            login="$(jq -r '.auth0.loginConfigured // false' <<<"$status" 2>/dev/null || echo false)"
            writes="$(jq -r '.remoteWritesReady // false' <<<"$status" 2>/dev/null || echo false)"
            count="$(jq -r '.technical.d1Schema.presentCount // 0' <<<"$readiness" 2>/dev/null || echo 0)"
            ready="$(jq -r '.technical.d1Schema.ready // false' <<<"$readiness" 2>/dev/null || echo false)"
            if [ "$d1" = "true" ] && [ "$login" = "true" ] && [ "$writes" = "true" ] && [ "$count" = "32" ] && [ "$ready" = "true" ]; then
              echo "FUNCTIONS_PROPAGATION_ATTEMPT=$attempt"
              break
            fi
            sleep 3
          done

          test "$(jq -r '.bindings.d1' <<<"$status")" = "true"
          test "$(jq -r '.auth0.configured' <<<"$status")" = "true"
          test "$(jq -r '.auth0.loginConfigured' <<<"$status")" = "true"
          test "$(jq -r '.turnstile.secretConfigured' <<<"$status")" = "true"
          test "$(jq -r '.turnstile.siteKeyConfigured' <<<"$status")" = "true"
          test "$(jq -r '.remoteWritesReady' <<<"$status")" = "true"

          session="$(curl -fsS --max-time 20 "$PREVIEW_ORIGIN/api/v1/auth/session")"
          test "$(jq -r '.authenticated' <<<"$session")" = "false"

          tmp="$(mktemp)"
          history_status="$(curl -sS -o "$tmp" -w '%{http_code}' --max-time 20 "$PREVIEW_ORIGIN/api/v1/history?limit=5")"
          test "$history_status" = "401"
          test "$(jq -r '.error' "$tmp")" = "authentication-required"

          test "$(jq -r '.technical.d1Schema.presentCount' <<<"$readiness")" = "32"
          test "$(jq -r '.technical.d1Schema.ready' <<<"$readiness")" = "true"
          test "$(jq -r '.productionPass' <<<"$readiness")" = "false"

          echo "MODARYX_V2_FULLSTACK_PROFILE_PROOF_ORIGIN=$PREVIEW_ORIGIN"
          echo "NO_DNS_CHANGE=yes"
          echo "NO_MAIN_CHANGE=yes"
          echo "NO_CUTOVER=yes"
          echo PASS_MODARYX_V2_FULLSTACK_PROFILE_PROOF_PREVIEW
