name: MODARYX IA P6 signed bridge probe

on:
  push:
    branches:
      - "chatgpt/modaryx-ai-founder-integration-20261005"
    paths:
      - ".github/workflows/modaryx-ai-p6-signed-bridge-probe.yml"
      - "functions/api/p6/bridge-probe.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZONE_NAME: modaryxmods.com
      PROJECT_NAME: nova-forge-site-public
      TARGET_BRANCH: chatgpt/modaryx-ai-founder-integration-20261005
    steps:
      - name: Poll latest preview deployment and probe signed bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence

          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          zones="$(curl -fsS "${auth[@]}" --get --data-urlencode "name=$ZONE_NAME" "$api/zones")"
          account_id="$(jq -r '.result[0].account.id' <<<"$zones")"
          test -n "$account_id"

          target_id=""
          target_url=""
          target_sha=""
          target_stage=""
          target_stage_status=""
          code=""
          ok=false
          protocol=""
          inner_http=""
          bridge_error=""
          diagnostic_name=""
          diagnostic_message=""

          for i in $(seq 1 90); do
            deployments="$(curl -fsS "${auth[@]}" --get \
              --data-urlencode "env=preview" \
              "$api/accounts/$account_id/pages/projects/$PROJECT_NAME/deployments")"
            test "$(jq -r '.success' <<<"$deployments")" = "true"

            target="$(jq -c \
              --arg b "$TARGET_BRANCH" \
              '[.result[] | select((.deployment_trigger.metadata.branch // "") == $b)] | sort_by(.created_on) | reverse | .[0] // null' \
              <<<"$deployments")"

            if [ "$(jq -r '. != null' <<<"$target")" = "true" ]; then
              target_id="$(jq -r '.id // ""' <<<"$target")"
              target_url="$(jq -r '.url // ""' <<<"$target")"
              target_sha="$(jq -r '.deployment_trigger.metadata.commit_hash // ""' <<<"$target")"
              target_stage="$(jq -r '.latest_stage.name // ""' <<<"$target")"
              target_stage_status="$(jq -r '.latest_stage.status // ""' <<<"$target")"

              if [ "$target_sha" = "$GITHUB_SHA" ] && [ "$target_stage_status" = "success" ] && [ -n "$target_url" ]; then
                body="$(mktemp)"
                code="$(curl -sS -o "$body" -w '%{http_code}' --max-time 20 "${target_url%/}/api/p6/bridge-probe" || true)"
                ok="$(jq -r '.ok == true' "$body" 2>/dev/null || echo false)"
                protocol="$(jq -r '.protocol // ""' "$body" 2>/dev/null || true)"
                inner_http="$(jq -r '.http // ""' "$body" 2>/dev/null || true)"
                bridge_error="$(jq -r '.bridge_error // ""' "$body" 2>/dev/null || true)"
                diagnostic_name="$(jq -r '.bridge_diagnostic.name // ""' "$body" 2>/dev/null || true)"
                diagnostic_message="$(jq -r '.bridge_diagnostic.message // ""' "$body" 2>/dev/null || true)"
                if [ "$code" != "200" ]; then
                  ok=false
                fi
                rm -f "$body"

                break
              fi
            fi

            sleep 4
          done

          if [ -z "$target_url" ]; then
            jq -n \
              --arg schema "modaryx-p6-signed-bridge-probe-v1" \
              --arg branch "$TARGET_BRANCH" \
              '{
                schema:$schema,
                status:"NOT_RUN",
                reason:"preview_deployment_not_ready",
                target_branch:$branch,
                awards_vf_points:false
              }' > evidence/probe.json
            echo "MODARYX_P6_SIGNED_BRIDGE_NOT_RUN preview_deployment_not_ready"
            exit 4
          fi

          jq -n \
            --arg schema "modaryx-p6-signed-bridge-probe-v1" \
            --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg deployment_id "$target_id" \
            --arg deployment_url "$target_url" \
            --arg deployment_sha "$target_sha" \
            --arg deployment_stage "$target_stage" \
            --arg http "$code" \
            --arg protocol "$protocol" \
            --arg inner_http "$inner_http" \
            --arg bridge_error "$bridge_error" \
            --arg diagnostic_name "$diagnostic_name" \
            --arg diagnostic_message "$diagnostic_message" \
            --argjson ok "$ok" \
            '{
              schema:$schema,
              created_at:$created_at,
              deployment_id:$deployment_id,
              deployment_url:$deployment_url,
              deployment_sha:$deployment_sha,
              deployment_stage:$deployment_stage,
              http_status:($http|tonumber),
              bridge_ok:$ok,
              protocol:$protocol,
              inner_http:(if $inner_http=="" then null else ($inner_http|tonumber) end),
              bridge_error:(if $bridge_error=="" then null else $bridge_error end),
              bridge_diagnostic:(if $diagnostic_name=="" and $diagnostic_message=="" then null else {name:$diagnostic_name,message:$diagnostic_message} end),
              secret_values_recorded:false,
              founder_bypass:false,
              awards_vf_points:false
            }' > evidence/probe.json

          if [ "$code" != "200" ] || [ "$ok" != "true" ] || [ "$protocol" != "modaryx-founder-bridge-v1" ]; then
            cat evidence/probe.json
            echo "MODARYX_P6_SIGNED_BRIDGE_FAIL outer=$code inner=$inner_http ok=$ok protocol=$protocol bridgeError=$bridge_error diagnosticName=$diagnostic_name diagnosticMessage=$diagnostic_message" >&2
            exit 5
          fi

          echo "MODARYX_P6_SIGNED_BRIDGE_PASS deployment=$target_id protocol=$protocol"

      - name: Upload signed bridge probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: modaryx-ai-p6-signed-bridge-probe
          path: evidence
          if-no-files-found: warn
          retention-days: 30
# replay-trigger: safe-fetch-diagnostic-current-sha
