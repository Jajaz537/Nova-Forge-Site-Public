name: MODARYX V2 Isolated Pages Preview

on:
  push:
    branches:
      - 'deploy/modaryx-v2-isolated-preview-20261006'
    paths:
      - '.github/workflows/modaryx-v2-isolated-pages-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modaryx-v2-isolated-pages-preview
  cancel-in-progress: true

env:
  CLOUDFLARE_ZONE_NAME: modaryxmods.com
  CLOUDFLARE_PROJECT_NAME: nova-forge-site-public
  MODARYX_V2_PREVIEW_BRANCH: v2-engineering
  MODARYX_CANON_SHA: acd424a3d4abf0eb4cb153dc24d5202db7412afe

jobs:
  deploy:
    name: Build and deploy isolated V2 preview only
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout exact canonical candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: acd424a3d4abf0eb4cb153dc24d5202db7412afe
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MODARYX_CANON_SHA"
          echo "V2_PREVIEW_SOURCE_SHA=$MODARYX_CANON_SHA"

      - name: Resolve Cloudflare account read-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          zones="$(curl -fsS "${auth[@]}" "${api}/zones?name=${CLOUDFLARE_ZONE_NAME}")"
          test "$(jq -r '.success' <<<"$zones")" = "true"
          test "$(jq '.result | length' <<<"$zones")" -eq 1
          account_id="$(jq -r '.result[0].account.id' <<<"$zones")"
          test -n "$account_id"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_RESOLVED=yes"

      - name: Build isolated V2 preview
        working-directory: v2-preview
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm run test:sites
          test -f dist/client/index.html
          grep -q 'MODARYX V2 — Preview engineering' dist/client/index.html
          grep -q 'noindex,nofollow,noarchive' dist/client/index.html

      - name: Add Pages-only SPA and noindex guards
        working-directory: v2-preview
        shell: bash
        run: |
          set -euo pipefail
          printf '/* /index.html 200\n' > dist/client/_redirects
          cat > dist/client/_headers <<'EOF'
          /*
            X-Robots-Tag: noindex, nofollow, noarchive
            Referrer-Policy: no-referrer
          EOF
          echo "PREVIEW_GUARDS_READY=yes"

      - name: Deploy V2 assets to isolated Pages preview branch
        working-directory: v2-preview
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist/client             --project-name="$CLOUDFLARE_PROJECT_NAME"             --branch="$MODARYX_V2_PREVIEW_BRANCH"             --commit-hash="$MODARYX_CANON_SHA"             --commit-message="MODARYX V2 isolated engineering preview"             --commit-dirty=false
          echo "ISOLATED_PREVIEW_DEPLOYED=yes"

      - name: Verify isolated V2 preview without touching production
        shell: bash
        run: |
          set -euo pipefail
          origin="https://${MODARYX_V2_PREVIEW_BRANCH}.${CLOUDFLARE_PROJECT_NAME}.pages.dev"
          html=""
          for attempt in $(seq 1 30); do
            if html="$(curl -fsSL --max-time 20 "$origin/")"; then
              break
            fi
            sleep 2
          done
          test -n "$html"
          grep -q 'MODARYX V2 — Preview engineering' <<<"$html"
          headers="$(curl -fsSI --max-time 20 "$origin/")"
          grep -qi 'x-robots-tag:.*noindex' <<<"$headers"
          echo "MODARYX_V2_INTERACTIVE_ORIGIN=$origin"
          echo "NO_DNS_CHANGE=yes"
          echo "NO_MAIN_CHANGE=yes"
          echo "NO_CUTOVER=yes"
          echo "PASS_MODARYX_V2_ISOLATED_PAGES_PREVIEW"
