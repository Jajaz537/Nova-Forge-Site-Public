name: MODARYX Profiles State Browser Proof

on:
  pull_request:
    branches:
      - design/modaryx-premium-hd-20260914-work
    paths:
      - '.github/workflows/modaryx-profiles-state-browser-proof.yml'
      - 'qa/check-profiles-state-browser.mjs'
      - 'profiles.html'
      - 'assets/profiles.js'
      - 'assets/profiles.css'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modaryx-profiles-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profiles-state:
    name: Chromium profiles state proof
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Locate Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --version
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Start local HTTP server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >"$RUNNER_TEMP/modaryx-profiles-http.log" 2>&1 &
          SERVER_PID=$!
          echo "MODARYX_PROFILES_SERVER_PID=$SERVER_PID" >> "$GITHUB_ENV"
          for attempt in {1..40}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/profiles.html >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat "$RUNNER_TEMP/modaryx-profiles-http.log"
          exit 1

      - name: Run profiles state proof
        shell: bash
        env:
          MODARYX_TEST_ORIGIN: http://127.0.0.1:4173
        run: |
          set -euo pipefail
          export MODARYX_PROFILES_OUT="$RUNNER_TEMP/modaryx-profiles-state"
          node --version
          node qa/check-profiles-state-browser.mjs

      - name: Upload profile state screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: modaryx-profiles-state-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/modaryx-profiles-state
          if-no-files-found: warn
          retention-days: 7

      - name: Stop local HTTP server
        if: always()
        shell: bash
        run: |
          if test -n "${MODARYX_PROFILES_SERVER_PID:-}"; then
            kill "$MODARYX_PROFILES_SERVER_PID" 2>/dev/null || true
          fi
