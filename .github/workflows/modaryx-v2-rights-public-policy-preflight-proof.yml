name: MODARYX V2 Rights Public Policy Preflight Proof

on:
  push:
    branches:
      - 'chatgpt/modaryx-v2-rights-public-policy-preflight-20261006'
    paths:
      - '.github/workflows/modaryx-v2-rights-public-policy-preflight-proof.yml'
      - 'qa/modaryx-v2-rights-public-policy-preflight.json'
      - 'qa/check-v2-rights-public-policy-preflight.mjs'
      - 'qa/modaryx-v2-preproduction-contract-registry.json'
      - 'docs/MODARYX-V2-RIGHTS-PUBLIC-POLICY-PREFLIGHT-20261006.md'
  pull_request:
    branches:
      - 'design/modaryx-v2-blue-violet-product-20261005'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    name: Validate public policy snapshot stays non-authorizing
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - run: |
          set -euo pipefail
          node qa/check-v2-rights-public-policy-preflight.mjs
          node qa/check-v2-preproduction-contract-registry.mjs
          echo PASS_V2_RIGHTS_PUBLIC_POLICY_PREFLIGHT_PROOF
