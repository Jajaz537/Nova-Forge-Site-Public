name: MODARYX V2 SEO I18n Content Contract Proof

on:
  push:
    branches:
      - 'audit/modaryx-v2-legacy-boundary-20261003'
    paths:
      - '.github/workflows/modaryx-v2-seo-i18n-content-contract-proof.yml'
      - 'qa/modaryx-v2-seo-i18n-content-contract.json'
      - 'qa/check-v2-seo-i18n-content-contract.mjs'
      - 'docs/MODARYX-V2-SEO-I18N-CONTENT-CONTRACT-20261003.md'
      - 'review-evidence/modaryx-v2-living-threshold-prototype-20261003/index.html'
      - 'review-evidence/modaryx-v2-living-threshold-prototype-20261003/src/App.jsx'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Validate SEO i18n content invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate SEO i18n content contract
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-v2-seo-i18n-content-contract.mjs
