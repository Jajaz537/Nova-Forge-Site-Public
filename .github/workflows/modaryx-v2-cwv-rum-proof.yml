name: MODARYX V2 CWV RUM Candidate Proof

on:
  push:
    branches:
      - 'chatgpt/modaryx-v2-cwv-rum-readiness-20261006'
    paths:
      - '.github/workflows/modaryx-v2-cwv-rum-proof.yml'
      - 'migrations/0014_modaryx_v2_cwv_rum.sql'
      - 'functions/_lib/cwv-rum.mjs'
      - 'functions/api/v1/rum/cwv.js'
      - 'v2/src/cwv-rum.js'
      - 'v2/src/main.jsx'
      - 'qa/modaryx-v2-cwv-rum-contract.json'
      - 'qa/check-v2-cwv-rum.mjs'
      - 'qa/modaryx-v2-preproduction-contract-registry.json'
  pull_request:
    branches:
      - 'design/modaryx-v2-blue-violet-product-20261005'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modaryx-v2-cwv-rum-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Prove CWV field collection stays private and disabled by default
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate CWV candidate
        run: |
          set -euo pipefail
          node --experimental-sqlite qa/check-v2-cwv-rum.mjs
          node qa/check-v2-preproduction-contract-registry.mjs
      - name: Build default V2 with collection disabled
        working-directory: v2
        run: |
          npm ci
          npm run build
          if grep -R --fixed-strings 'VITE_MODARYX_FIELD_CWV=1' dist/client; then
            echo "CWV collection flag leaked as enabled"
            exit 1
          fi
      - name: Mirror Cloudflare root build
        run: npm run build
      - name: Marker
        run: echo PASS_V2_CWV_RUM_CANDIDATE_PROOF
