name: MODARYX force visible M v3

on:
  push:
    branches:
      - modaryxmods-force-visible-m-v3
    paths:
      - '.github/modaryx-force-visible-m-v3-trigger.json'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modaryxmods-force-visible-m-v3
          fetch-depth: 0
      - name: Point every visible MODARYX mark to fresh versioned M asset
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          old = './assets/modaryx-mark.svg'
          fresh = './favicon.svg?v=modaryx-visible-m-3'
          changed=[]
          for p in Path('.').glob('*.html'):
              text=p.read_text(encoding='utf-8')
              new=text.replace(old, fresh)
              if new != text:
                  p.write_text(new, encoding='utf-8', newline='\n')
                  changed.append(str(p))
          failures=[]
          for p in Path('.').glob('*.html'):
              text=p.read_text(encoding='utf-8')
              if old in text:
                  failures.append(str(p))
          if failures:
              print('OLD_VISIBLE_MARK_REFS_REMAIN')
              print('\n'.join(failures))
              raise SystemExit(1)
          if not changed:
              raise SystemExit('No visible MODARYX mark references changed')
          print('VISIBLE_M_CACHE_BUST_PROOF=PASS')
          print('\n'.join(changed))
          PY
      - name: Commit targeted refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "fix(site): force fresh visible MODARYX M asset"
          git push origin HEAD:modaryxmods-force-visible-m-v3
