name: MODARYX Visual QA

on:
  workflow_dispatch:
  push:
    branches:
      - design/modaryx-true-finishline-20261002
    paths:
      - '.github/workflows/modaryx-visual-qa.yml'

permissions:
  contents: read

jobs:
  route-capture:
    name: Capture ${{ matrix.name }} desktop
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: home
            file: 'index.html'
          - name: univers
            file: 'univers.html'
          - name: compagnons
            file: 'compagnons.html'
          - name: aventures
            file: 'aventures.html'
          - name: lieux
            file: 'lieux.html'
          - name: factions
            file: 'factions.html'
          - name: communaute
            file: 'communaute.html'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Capture route through local HTTP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pf86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $browserCandidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "$pf86\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "$pf86\Microsoft\Edge\Application\msedge.exe"
          )
          $browser = $browserCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $browser) {
            $cmd = Get-Command chrome.exe, msedge.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($cmd) { $browser = $cmd.Source }
          }
          if (-not $browser) { throw 'BROWSER_NOT_FOUND' }

          $node = Get-Command node.exe, node -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $node) { throw 'NODE_NOT_FOUND' }
          $port = 4173
          $serverScript = Join-Path $env:GITHUB_WORKSPACE 'qa\modaryx-static-server.mjs'
          if (-not (Test-Path -LiteralPath $serverScript)) { throw 'STATIC_SERVER_SCRIPT_MISSING' }
          $server = Start-Process -FilePath $node.Source -ArgumentList @($serverScript,"$port") -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru -WindowStyle Hidden

          try {
            $target = 'http://127.0.0.1:' + $port + '/${{ matrix.file }}'
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri $target -TimeoutSec 2
                if ($response.StatusCode -eq 200) { break }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $response -or $response.StatusCode -ne 200) { throw ('LOCAL_HTTP_UNAVAILABLE ' + $target) }

            New-Item -ItemType Directory -Force -Path visual-qa | Out-Null
            $profile = Join-Path $env:RUNNER_TEMP ('modaryx-http-${{ matrix.name }}-' + $env:GITHUB_RUN_ATTEMPT)
            Remove-Item -Recurse -Force $profile -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $profile | Out-Null
            $shot = Join-Path $PWD 'visual-qa\${{ matrix.name }}-desktop.png'
            $args = @(
              '--headless=new','--disable-gpu','--hide-scrollbars',
              '--no-first-run','--no-default-browser-check',
              ('--user-data-dir=' + $profile),
              '--window-size=1440,1000','--virtual-time-budget=8000',
              ('--screenshot=' + $shot), $target
            )
            $p = Start-Process -FilePath $browser -ArgumentList $args -PassThru
            for ($i = 0; $i -lt 40 -and -not (Test-Path -LiteralPath $shot); $i++) { Start-Sleep -Milliseconds 500 }
            if (-not (Test-Path -LiteralPath $shot)) { throw 'SCREENSHOT_MISSING' }
            if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            Write-Host ('CAPTURED ${{ matrix.name }} ' + $target)
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload route screenshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: modaryx-visual-${{ matrix.name }}
          path: visual-qa/${{ matrix.name }}-desktop.png
          if-no-files-found: error
          retention-days: 3

  mobile-capture:
    name: Capture home mobile
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Capture mobile homepage through local HTTP
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pf86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $browserCandidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "$pf86\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "$pf86\Microsoft\Edge\Application\msedge.exe"
          )
          $browser = $browserCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $browser) {
            $cmd = Get-Command chrome.exe, msedge.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($cmd) { $browser = $cmd.Source }
          }
          if (-not $browser) { throw 'BROWSER_NOT_FOUND' }

          $node = Get-Command node.exe, node -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $node) { throw 'NODE_NOT_FOUND' }
          $port = 4173
          $serverScript = Join-Path $env:GITHUB_WORKSPACE 'qa\modaryx-static-server.mjs'
          if (-not (Test-Path -LiteralPath $serverScript)) { throw 'STATIC_SERVER_SCRIPT_MISSING' }
          $server = Start-Process -FilePath $node.Source -ArgumentList @($serverScript,"$port") -WorkingDirectory $env:GITHUB_WORKSPACE -PassThru -WindowStyle Hidden

          try {
            $target = 'http://127.0.0.1:' + $port + '/index.html'
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri $target -TimeoutSec 2
                if ($response.StatusCode -eq 200) { break }
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            if (-not $response -or $response.StatusCode -ne 200) { throw ('LOCAL_HTTP_UNAVAILABLE ' + $target) }

            New-Item -ItemType Directory -Force -Path visual-qa | Out-Null
            $profile = Join-Path $env:RUNNER_TEMP ('modaryx-http-mobile-' + $env:GITHUB_RUN_ATTEMPT)
            Remove-Item -Recurse -Force $profile -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $profile | Out-Null
            $shot = Join-Path $PWD 'visual-qa\home-mobile.png'
            $args = @(
              '--headless=new','--disable-gpu','--hide-scrollbars',
              '--no-first-run','--no-default-browser-check',
              ('--user-data-dir=' + $profile),
              '--window-size=390,1600','--force-device-scale-factor=1',
              '--virtual-time-budget=8000',
              ('--screenshot=' + $shot), $target
            )
            $p = Start-Process -FilePath $browser -ArgumentList $args -PassThru
            for ($i = 0; $i -lt 40 -and -not (Test-Path -LiteralPath $shot); $i++) { Start-Sleep -Milliseconds 500 }
            if (-not (Test-Path -LiteralPath $shot)) { throw 'MOBILE_SCREENSHOT_MISSING' }
            if ($p -and -not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            Write-Host 'CAPTURED home mobile through local HTTP'
          } finally {
            if ($server -and -not $server.HasExited) { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload mobile screenshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: modaryx-visual-home-mobile
          path: visual-qa/home-mobile.png
          if-no-files-found: error
          retention-days: 3

# qa-trigger: node-static-server
