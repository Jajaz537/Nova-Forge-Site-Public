name: MODARYX Visual QA

on:
  workflow_dispatch:
  push:
    branches:
      - design/modaryx-true-finishline-20261002
    paths:
      - '.github/workflows/modaryx-visual-qa.yml'

permissions:
  contents: read

jobs:
  route-capture:
    name: Capture ${{ matrix.name }} desktop
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: home
            path: ''
          - name: univers
            path: '/univers'
          - name: compagnons
            path: '/compagnons'
          - name: aventures
            path: '/aventures'
          - name: lieux
            path: '/lieux'
          - name: factions
            path: '/factions'
          - name: communaute
            path: '/communaute'
    steps:
      - name: Capture route
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://design-modaryx-true-finishli.nova-forge-site-public.pages.dev'
          $target = $base + '${{ matrix.path }}'
          $pf86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "$pf86\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "$pf86\Microsoft\Edge\Application\msedge.exe"
          )
          $browser = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $browser) {
            $cmd = Get-Command chrome.exe, msedge.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($cmd) { $browser = $cmd.Source }
          }
          if (-not $browser) { throw 'BROWSER_NOT_FOUND' }
          New-Item -ItemType Directory -Force -Path visual-qa | Out-Null
          $profile = Join-Path $env:RUNNER_TEMP ('modaryx-qa-${{ matrix.name }}-' + $env:GITHUB_RUN_ATTEMPT)
          New-Item -ItemType Directory -Force -Path $profile | Out-Null
          $shot = Join-Path $PWD 'visual-qa\${{ matrix.name }}-desktop.png'
          $args = @(
            '--headless=new','--disable-gpu','--hide-scrollbars',
            '--no-first-run','--no-default-browser-check',
            ('--user-data-dir=' + $profile),
            '--window-size=1440,1000','--virtual-time-budget=8000',
            ('--screenshot=' + $shot), $target
          )
          $p = Start-Process -FilePath $browser -ArgumentList $args -Wait -PassThru
          for ($i = 0; $i -lt 20 -and -not (Test-Path -LiteralPath $shot); $i++) { Start-Sleep -Milliseconds 500 }
          if (-not (Test-Path -LiteralPath $shot)) { throw ('SCREENSHOT_MISSING exit=' + $p.ExitCode) }
          Write-Host ('CAPTURED ${{ matrix.name }} ' + $target)

      - name: Upload route screenshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: modaryx-visual-${{ matrix.name }}
          path: visual-qa/${{ matrix.name }}-desktop.png
          if-no-files-found: error
          retention-days: 3

  mobile-capture:
    name: Capture home mobile
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - name: Capture mobile homepage
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'https://design-modaryx-true-finishli.nova-forge-site-public.pages.dev'
          $pf86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "$pf86\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "$pf86\Microsoft\Edge\Application\msedge.exe"
          )
          $browser = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $browser) {
            $cmd = Get-Command chrome.exe, msedge.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($cmd) { $browser = $cmd.Source }
          }
          if (-not $browser) { throw 'BROWSER_NOT_FOUND' }
          New-Item -ItemType Directory -Force -Path visual-qa | Out-Null
          $profile = Join-Path $env:RUNNER_TEMP ('modaryx-qa-mobile-' + $env:GITHUB_RUN_ATTEMPT)
          New-Item -ItemType Directory -Force -Path $profile | Out-Null
          $shot = Join-Path $PWD 'visual-qa\home-mobile.png'
          $args = @(
            '--headless=new','--disable-gpu','--hide-scrollbars',
            '--no-first-run','--no-default-browser-check',
            ('--user-data-dir=' + $profile),
            '--window-size=390,1600','--force-device-scale-factor=1',
            '--virtual-time-budget=8000',
            ('--screenshot=' + $shot), $target
          )
          $p = Start-Process -FilePath $browser -ArgumentList $args -Wait -PassThru
          for ($i = 0; $i -lt 20 -and -not (Test-Path -LiteralPath $shot); $i++) { Start-Sleep -Milliseconds 500 }
          if (-not (Test-Path -LiteralPath $shot)) { throw ('MOBILE_SCREENSHOT_MISSING exit=' + $p.ExitCode) }
          Write-Host 'CAPTURED mobile homepage'

      - name: Upload mobile screenshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: modaryx-visual-home-mobile
          path: visual-qa/home-mobile.png
          if-no-files-found: error
          retention-days: 3

# qa-trigger: one-route-per-job
