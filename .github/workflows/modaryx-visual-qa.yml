name: MODARYX Visual QA

on:
  workflow_dispatch:
  push:
    branches:
      - design/modaryx-true-finishline-20261002
    paths:
      - '.github/workflows/modaryx-visual-qa.yml'

permissions:
  contents: read

jobs:
  capture:
    name: Capture desktop and mobile preview
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Find browser and capture MODARYX preview
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://design-modaryx-true-finishli.nova-forge-site-public.pages.dev'
          $pf86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "$pf86\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "$pf86\Microsoft\Edge\Application\msedge.exe"
          )
          $browser = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $browser) {
            $cmd = Get-Command chrome.exe, msedge.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($cmd) { $browser = $cmd.Source }
          }
          if (-not $browser) { throw 'BROWSER_NOT_FOUND' }

          New-Item -ItemType Directory -Force -Path visual-qa | Out-Null

          Write-Host ('BROWSER=' + [IO.Path]::GetFileName($browser))
          $profile = Join-Path $env:RUNNER_TEMP 'modaryx-visual-qa-profile'
          New-Item -ItemType Directory -Force -Path $profile | Out-Null

          $desktop = Join-Path $PWD 'visual-qa\desktop.png'
          $desktopArgs = @(
            '--headless=new','--disable-gpu','--hide-scrollbars',
            '--no-first-run','--no-default-browser-check',
            ('--user-data-dir=' + $profile),
            '--window-size=1440,1200','--virtual-time-budget=8000',
            ('--screenshot=' + $desktop), $url
          )
          $p1 = Start-Process -FilePath $browser -ArgumentList $desktopArgs -Wait -PassThru
          if (-not (Test-Path -LiteralPath $desktop)) { throw ('DESKTOP_SCREENSHOT_MISSING exit=' + $p1.ExitCode) }

          Remove-Item -Recurse -Force $profile -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $profile | Out-Null

          $mobile = Join-Path $PWD 'visual-qa\mobile.png'
          $mobileArgs = @(
            '--headless=new','--disable-gpu','--hide-scrollbars',
            '--no-first-run','--no-default-browser-check',
            ('--user-data-dir=' + $profile),
            '--window-size=390,1600','--force-device-scale-factor=1',
            '--virtual-time-budget=8000',
            ('--screenshot=' + $mobile), $url
          )
          $p2 = Start-Process -FilePath $browser -ArgumentList $mobileArgs -Wait -PassThru
          if (-not (Test-Path -LiteralPath $mobile)) { throw ('MOBILE_SCREENSHOT_MISSING exit=' + $p2.ExitCode) }

          Write-Host 'VISUAL_QA_CAPTURED'

      - name: Upload visual QA screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: modaryx-visual-qa
          path: visual-qa/*.png
          if-no-files-found: error
          retention-days: 3




