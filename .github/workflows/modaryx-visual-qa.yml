name: MODARYX Visual QA

on:
  workflow_dispatch:
  push:
    branches:
      - design/modaryx-true-finishline-20261002
    paths:
      - '.github/workflows/modaryx-visual-qa.yml'

permissions:
  contents: read

jobs:
  route-capture:
    name: Capture ${{ matrix.name }} desktop
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: home
            file: 'index.html'
          - name: univers
            file: 'univers.html'
          - name: compagnons
            file: 'compagnons.html'
          - name: aventures
            file: 'aventures.html'
          - name: lieux
            file: 'lieux.html'
          - name: factions
            file: 'factions.html'
          - name: communaute
            file: 'communaute.html'
    steps:
      - name: Checkout exact branch snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Capture local route
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $local = Join-Path $PWD '${{ matrix.file }}'
          if (-not (Test-Path -LiteralPath $local)) { throw 'ROUTE_FILE_NOT_FOUND' }
          $target = ([System.Uri]::new($local)).AbsoluteUri
          $pf86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "$pf86\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "$pf86\Microsoft\Edge\Application\msedge.exe"
          )
          $browser = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $browser) {
            $cmd = Get-Command chrome.exe, msedge.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($cmd) { $browser = $cmd.Source }
          }
          if (-not $browser) { throw 'BROWSER_NOT_FOUND' }
          Write-Host ('BROWSER=' + $browser)
          Write-Host ('TARGET=' + $target)
          New-Item -ItemType Directory -Force -Path visual-qa | Out-Null
          $profile = Join-Path $env:RUNNER_TEMP ('modaryx-local-${{ matrix.name }}-' + $env:GITHUB_RUN_ATTEMPT)
          New-Item -ItemType Directory -Force -Path $profile | Out-Null
          $shot = Join-Path $PWD 'visual-qa\${{ matrix.name }}-desktop.png'
          $args = @(
            '--headless=new','--disable-gpu','--hide-scrollbars','--allow-file-access-from-files',
            '--no-first-run','--no-default-browser-check',
            ('--user-data-dir=' + $profile),
            '--window-size=1440,1000','--virtual-time-budget=5000',
            ('--screenshot=' + $shot), $target
          )
          $p = Start-Process -FilePath $browser -ArgumentList $args -Wait -PassThru
          for ($i = 0; $i -lt 20 -and -not (Test-Path -LiteralPath $shot); $i++) { Start-Sleep -Milliseconds 500 }
          if (-not (Test-Path -LiteralPath $shot)) { throw ('SCREENSHOT_MISSING exit=' + $p.ExitCode) }
          Write-Host 'CAPTURED_LOCAL_ROUTE'

      - name: Upload route screenshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: modaryx-visual-${{ matrix.name }}
          path: visual-qa/${{ matrix.name }}-desktop.png
          if-no-files-found: error
          retention-days: 3

  mobile-capture:
    name: Capture home mobile
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - name: Checkout exact branch snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Capture local mobile homepage
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $local = Join-Path $PWD 'index.html'
          $target = ([System.Uri]::new($local)).AbsoluteUri
          $pf86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "$pf86\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "$pf86\Microsoft\Edge\Application\msedge.exe"
          )
          $browser = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $browser) {
            $cmd = Get-Command chrome.exe, msedge.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($cmd) { $browser = $cmd.Source }
          }
          if (-not $browser) { throw 'BROWSER_NOT_FOUND' }
          New-Item -ItemType Directory -Force -Path visual-qa | Out-Null
          $profile = Join-Path $env:RUNNER_TEMP ('modaryx-local-mobile-' + $env:GITHUB_RUN_ATTEMPT)
          New-Item -ItemType Directory -Force -Path $profile | Out-Null
          $shot = Join-Path $PWD 'visual-qa\home-mobile.png'
          $args = @(
            '--headless=new','--disable-gpu','--hide-scrollbars','--allow-file-access-from-files',
            '--no-first-run','--no-default-browser-check',
            ('--user-data-dir=' + $profile),
            '--window-size=390,1600','--force-device-scale-factor=1','--virtual-time-budget=5000',
            ('--screenshot=' + $shot), $target
          )
          $p = Start-Process -FilePath $browser -ArgumentList $args -Wait -PassThru
          for ($i = 0; $i -lt 20 -and -not (Test-Path -LiteralPath $shot); $i++) { Start-Sleep -Milliseconds 500 }
          if (-not (Test-Path -LiteralPath $shot)) { throw ('MOBILE_SCREENSHOT_MISSING exit=' + $p.ExitCode) }

      - name: Upload mobile screenshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: modaryx-visual-home-mobile
          path: visual-qa/home-mobile.png
          if-no-files-found: error
          retention-days: 3

# qa-trigger: local-static-capture
