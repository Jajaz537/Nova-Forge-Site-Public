name: MODARYX V2 Preview Root Proof

on:
  push:
    branches:
      - 'chatgpt/modaryx-v2-preview-root-20261006'
    paths:
      - '.github/workflows/modaryx-v2-preview-root-proof.yml'
      - 'qa/modaryx-v2-preview-root-contract.json'
      - 'qa/check-v2-preview-root-contract.mjs'
      - 'qa/check-v2-living-threshold-browser-a11y.mjs'
      - 'qa/check-v2-living-threshold-product-flows.mjs'
      - 'qa/capture-v2-living-threshold-multiscreen.mjs'
      - 'qa/check-v2-multiscreen-capture-integrity.mjs'
      - 'v2-preview/**'
  pull_request:
    branches:
      - 'design/modaryx-v2-blue-violet-product-20261005'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modaryx-v2-preview-root-proof-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Build and exercise isolated V2 preview root
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify preview contract
        run: |
          set -euo pipefail
          node qa/check-v2-preview-root-contract.mjs

      - name: Locate Chrome
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --version
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Build isolated preview root
        working-directory: v2-preview
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm run test:sites

      - name: Start preview root
        working-directory: v2-preview
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4175 >/tmp/modaryx-v2-preview-root.log 2>&1 &
          echo $! >/tmp/modaryx-v2-preview-root.pid
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:4175/ >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/modaryx-v2-preview-root.log
          exit 1

      - name: Browser accessibility and touch proof
        env:
          MODARYX_REVIEW_ORIGIN: http://127.0.0.1:4175
        run: |
          set -euo pipefail
          node qa/check-v2-living-threshold-browser-a11y.mjs

      - name: Product flows page by page
        env:
          MODARYX_REVIEW_ORIGIN: http://127.0.0.1:4175
        run: |
          set -euo pipefail
          node qa/check-v2-living-threshold-product-flows.mjs

      - name: Capture page tab module matrix
        env:
          MODARYX_REVIEW_ORIGIN: http://127.0.0.1:4175
        run: |
          set -euo pipefail
          node qa/capture-v2-living-threshold-multiscreen.mjs
          node qa/check-v2-multiscreen-capture-integrity.mjs
          echo PASS_V2_PREVIEW_ROOT_BROWSER_PROOF

      - name: Upload browser matrix
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: modaryx-v2-preview-root-browser-matrix
          path: review-evidence/modaryx-v2-living-threshold-prototype-20261003/visual-proof/multiscreen
          if-no-files-found: error
          retention-days: 30

      - name: Stop preview root
        if: always()
        run: |
          if test -f /tmp/modaryx-v2-preview-root.pid; then
            kill "$(cat /tmp/modaryx-v2-preview-root.pid)" 2>/dev/null || true
          fi
