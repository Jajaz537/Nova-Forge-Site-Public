name: MODARYX V2 CDP Readiness Micro-Proof

on:
  push:
    branches:
      - 'audit/modaryx-v2-legacy-boundary-20261003'
    paths:
      - '.github/workflows/modaryx-v2-cdp-readiness-micro-proof.yml'
      - 'qa/check-v2-cdp-readiness.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cdp-readiness:
    name: Prove Chrome DevTools readiness
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Locate Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --version
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Run CDP readiness micro-proof
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-v2-cdp-readiness.mjs
