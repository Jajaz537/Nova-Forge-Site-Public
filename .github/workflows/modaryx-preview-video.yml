name: MODARYX Fresh Full-Site Video

on:
  pull_request:
    branches:
      - design/modaryx-premium-hd-20260914-work
    paths:
      - '.github/workflows/modaryx-preview-video.yml'
      - 'qa/capture-preview-video.mjs'
      - 'assets/*.css'
      - 'assets/*.js'
      - 'assets/*.mjs'
      - 'index.html'
      - '*.html'
      - 'games/**'
      - 'gta-6/**'
      - 'red-dead-redemption-2/**'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: modaryx-preview-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fresh-video:
    name: Fresh desktop + mobile 23-route browser video
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Locate browser and encoder
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          command -v ffmpeg
          "$CHROME_BIN" --version
          ffmpeg -version >"$RUNNER_TEMP/ffmpeg-version.txt" 2>&1
          head -n 1 "$RUNNER_TEMP/ffmpeg-version.txt"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Resolve immutable Cloudflare preview
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -n "$PR_NUMBER"
          SHORT_SHA="${HEAD_SHA:0:7}"
          for attempt in {1..72}; do
            COMMENTS_JSON="$RUNNER_TEMP/modaryx-video-comments.json"
            curl --fail --silent --show-error -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -o "$COMMENTS_JSON" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100"
            PREVIEW="$(SHORT_SHA="$SHORT_SHA" node -e '
              const comments=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));
              for(const item of [...comments].reverse()){
                const body=item.body||"";
                if(item.user?.login!=="cloudflare-workers-and-pages[bot]")continue;
                if(!body.includes("Deploy successful")||!body.includes("<code>"+process.env.SHORT_SHA+"</code>"))continue;
                const m=body.match(/Preview URL:<\/strong><\/td><td>[\s\S]*?<a href=\x27(https:\/\/[^\x27]+)\x27/);
                if(m){process.stdout.write(m[1]);break;}
              }
            ' "$COMMENTS_JSON")"
            if test -n "$PREVIEW"; then
              echo "MODARYX_VIDEO_ORIGIN=$PREVIEW" >> "$GITHUB_ENV"
              echo "Resolved preview: $PREVIEW"
              exit 0
            fi
            sleep 5
          done
          echo "No Cloudflare preview found for $HEAD_SHA" >&2
          exit 1
      - name: Capture fresh 23-route desktop and mobile video
        shell: bash
        run: |
          set -euo pipefail
          export MODARYX_VIDEO_OUT="$RUNNER_TEMP/modaryx-preview-video"
          node qa/capture-preview-video.mjs
      - name: Upload fresh videos
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: modaryx-preview-video-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/modaryx-preview-video
          if-no-files-found: error
          retention-days: 7
