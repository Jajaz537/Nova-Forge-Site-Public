name: MODARYX V2 Publisher Inbound Quarantine Proof

on:
  push:
    branches:
      - 'chatgpt/modaryx-v2-publisher-inbound-quarantine-20261006'
    paths:
      - '.github/workflows/modaryx-v2-publisher-inbound-quarantine-proof.yml'
      - 'migrations/0012_modaryx_v2_publisher_inbound_quarantine.sql'
      - 'functions/_lib/publisher-inbound.mjs'
      - 'functions/api/v1/rights/inbound/**'
      - 'qa/modaryx-v2-publisher-inbound-contract.json'
      - 'qa/check-v2-publisher-inbound-contract.mjs'
      - 'qa/check-v2-publisher-inbound-quarantine.mjs'
      - 'qa/modaryx-v2-preproduction-contract-registry.json'
  pull_request:
    branches:
      - 'design/modaryx-v2-blue-violet-product-20261005'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modaryx-v2-publisher-inbound-quarantine-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Prove opaque inbound quarantine without mailbox or execution
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate inbound product contract and quarantine adapter
        run: |
          set -euo pipefail
          node qa/check-v2-publisher-inbound-contract.mjs
          node --experimental-sqlite qa/check-v2-publisher-inbound-quarantine.mjs
          node qa/check-v2-preproduction-contract-registry.mjs
          echo PASS_V2_PUBLISHER_INBOUND_QUARANTINE_PROOF
      - name: Mirror Cloudflare root build
        run: npm run build
