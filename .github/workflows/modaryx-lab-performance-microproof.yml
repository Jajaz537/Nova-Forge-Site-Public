name: MODARYX Lab Performance Micro-Proof

on:
  pull_request:
    branches:
      - design/modaryx-premium-hd-20260914-work
    paths:
      - '.github/workflows/modaryx-lab-performance-microproof.yml'
      - 'qa/check-lab-performance.mjs'
      - '*.html'
      - 'games/**'
      - 'assets/**'
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lab-performance:
    name: Chromium lab performance
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Locate Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --version
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Start loopback server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4176 --bind 127.0.0.1 >/tmp/modaryx-perf-http.log 2>&1 &
          echo $! >/tmp/modaryx-perf-http.pid
          for attempt in {1..40}; do
            curl --fail --silent http://127.0.0.1:4176/index.html >/dev/null && exit 0
            sleep 0.25
          done
          cat /tmp/modaryx-perf-http.log
          exit 1
      - name: Run lab performance proof
        shell: bash
        env:
          MODARYX_TEST_ORIGIN: http://127.0.0.1:4176
        run: |
          set -euo pipefail
          node qa/check-lab-performance.mjs
      - name: Stop loopback server
        if: always()
        shell: bash
        run: |
          test -f /tmp/modaryx-perf-http.pid && kill "$(cat /tmp/modaryx-perf-http.pid)" 2>/dev/null || true
