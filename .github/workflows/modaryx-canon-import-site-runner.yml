name: MODARYX Canon Import - Site Runner

on:
  push:
    branches:
      - design/modaryx-true-finishline-20261002
    paths:
      - '.github/workflows/modaryx-canon-import-site-runner.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modaryx-canon-import-site-runner
  cancel-in-progress: false

jobs:
  import-exact-canon:
    name: Locate and import exact Finish Line canon
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 8
    steps:
      - name: Checkout isolated Finish Line branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: design/modaryx-true-finishline-20261002
          fetch-depth: 1

      - name: Locate exact canonical PNG without exposing local paths
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $expectedHash = '141F90DD3AB403627A8279DB8C66C2E9711AD88771B359C1EA4CE26C212ED81E'
          $expectedSize = 4231234
          $names = @('nouveaux design 3(1).png','nouveaux design 3 (1).png')

          # Search only user-facing folders plus likely ChatGPT/Codex caches.
          # Never print matched local paths.
          $roots = New-Object System.Collections.Generic.List[string]
          $seedRoots = @(
            (Join-Path $env:USERPROFILE 'Desktop'),
            (Join-Path $env:USERPROFILE 'Documents'),
            (Join-Path $env:USERPROFILE 'Downloads'),
            (Join-Path $env:USERPROFILE '.codex'),
            (Join-Path $env:USERPROFILE '.chatgpt'),
            $env:TEMP
          )
          foreach ($root in $seedRoots) {
            if ($root -and (Test-Path -LiteralPath $root)) { $roots.Add($root) }
          }

          foreach ($base in @($env:LOCALAPPDATA, $env:APPDATA)) {
            if (-not $base -or -not (Test-Path -LiteralPath $base)) { continue }
            Get-ChildItem -LiteralPath $base -Directory -Force -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '(?i)(openai|chatgpt|codex)' } |
              ForEach-Object { $roots.Add($_.FullName) }
            Get-ChildItem -LiteralPath $base -Directory -Force -ErrorAction SilentlyContinue |
              ForEach-Object {
                Get-ChildItem -LiteralPath $_.FullName -Directory -Force -ErrorAction SilentlyContinue |
                  Where-Object { $_.Name -match '(?i)(openai|chatgpt|codex)' } |
                  ForEach-Object { $roots.Add($_.FullName) }
              }
          }

          $roots = $roots | Select-Object -Unique
          $match = $null
          foreach ($root in $roots) {
            foreach ($name in $names) {
              $items = Get-ChildItem -LiteralPath $root -Filter $name -File -Recurse -Force -ErrorAction SilentlyContinue
              foreach ($item in $items) {
                if ($item.Length -ne $expectedSize) { continue }
                $hash = (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash
                if ($hash -eq $expectedHash) { $match = $item; break }
              }
              if ($match) { break }
            }
            if ($match) { break }
          }

          if (-not $match) {
            Write-Error 'CANON_NOT_FOUND_TARGETED: exact SHA-256 canonical PNG was not found in user folders or likely ChatGPT/Codex caches.'
          }

          New-Item -ItemType Directory -Force -Path assets | Out-Null
          Copy-Item -LiteralPath $match.FullName -Destination 'assets/modaryx-finishline-canon.png' -Force
          $copied = Get-Item 'assets/modaryx-finishline-canon.png'
          $copiedHash = (Get-FileHash -LiteralPath $copied.FullName -Algorithm SHA256).Hash
          if ($copied.Length -ne $expectedSize -or $copiedHash -ne $expectedHash) {
            Write-Error 'CANON_COPY_MISMATCH'
          }
          Write-Host ('CANON_FOUND_AND_VERIFIED size=' + $copied.Length + ' sha256=' + $copiedHash)

      - name: Run repository fail-closed canon gate
        shell: powershell
        run: node qa/check-finishline-canon.mjs

      - name: Activate canonical homepage hero only
        shell: powershell
        run: node qa/activate-finishline-home.mjs

      - name: Commit exact binary and gated homepage activation to isolated branch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/modaryx-finishline-canon.png index.html
          if (git diff --cached --quiet) {
            Write-Host 'CANON_ALREADY_COMMITTED'
            exit 0
          }
          git commit -m 'design: activate exact MODARYX Finish Line homepage [skip ci]'
          git push origin HEAD:design/modaryx-true-finishline-20261002
