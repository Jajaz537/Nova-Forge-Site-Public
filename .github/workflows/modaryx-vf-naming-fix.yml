name: MODARYX VF targeted naming fix

on:
  push:
    branches:
      - site/modaryx-vf-premium-hd-v2
    paths:
      - '.github/modaryx-vf-naming-fix-trigger.json'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site/modaryx-vf-premium-hd-v2
          fetch-depth: 0
      - name: Fix only the exact stale public naming hits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          schema_paths = [
            'schemas/community-submission.schema.json',
            'schemas/public-profile.schema.json',
            'schemas/community-write.schema.json',
            'schemas/universal-mod-manifest.schema.json',
            'schemas/search-adapter.schema.json',
            'schemas/collection.schema.json',
            'schemas/moderation-receipt.schema.json',
            'schemas/repair-network.schema.json',
            'schemas/moderation-export.schema.json',
            'schemas/compatibility-graph.schema.json',
            'schemas/publication-receipt.schema.json',
            'schemas/account-security.schema.json',
            'schemas/smart-profile.schema.json',
            'schemas/storage-resolver.schema.json',
          ]
          changed=[]
          for name in schema_paths:
              p=Path(name)
              text=p.read_text(encoding='utf-8')
              new=text.replace('Nova Forge OS','Modaryx OS').replace('Nova Forge','MODARYX MODS').replace('NOVA FORGE','MODARYX MODS')
              if new != text:
                  p.write_text(new,encoding='utf-8',newline='\n')
                  changed.append(name)

          cutover = {
            'schemaVersion': 2,
            'canonicalOrigin': 'https://modaryxmods.com',
            'aliases': [],
            'hostingTarget': 'Cloudflare Pages',
            'pagesProject': 'nova-forge-site-public',
            'httpsRequired': True,
            'httpsStatus': 'ACTIVE',
            'dnssecStatus': 'PENDING_REGISTRAR_DS',
            'status': 'ACTIVE_HTTPS_DNSSEC_PENDING_REGISTRAR_DS',
            'sitemap': 'https://modaryxmods.com/sitemap.xml',
            'notes': [
              'Public brand is MODARYX MODS.',
              'Production domain is modaryxmods.com.',
              'Do not mark DNSSEC green until registrar DS installation and parent-chain verification are proven.'
            ]
          }
          Path('domain-cutover.json').write_text(json.dumps(cutover,ensure_ascii=False,indent=2)+'\n',encoding='utf-8',newline='\n')
          changed.append('domain-cutover.json')

          leftovers=[]
          for name in schema_paths + ['domain-cutover.json']:
              text=Path(name).read_text(encoding='utf-8')
              for token in ('Nova Forge','NOVA FORGE','getnovaforge.com'):
                  if token in text:
                      leftovers.append(f'{name}: {token}')
          if leftovers:
              print('TARGETED_NAMING_FIX_PROOF=FAIL')
              print('\n'.join(leftovers))
              raise SystemExit(1)
          print('TARGETED_NAMING_FIX_PROOF=PASS')
          print('\n'.join(changed))
          PY
      - name: Commit targeted naming repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add domain-cutover.json schemas/*.json
          git commit -m "fix(site): align stale public naming with MODARYX"
          git push origin HEAD:site/modaryx-vf-premium-hd-v2
