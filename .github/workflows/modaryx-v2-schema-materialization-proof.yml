name: MODARYX V2 Schema Materialization Proof

on:
  push:
    branches:
      - 'chatgpt/modaryx-v2-schema-materialization-20261006'
    paths:
      - '.github/workflows/modaryx-v2-schema-materialization-proof.yml'
      - 'schemas/v2/**'
      - 'qa/modaryx-v2-schema-plan-contract.json'
      - 'qa/check-v2-schema-plan-contract.mjs'
      - 'qa/check-v2-schema-materialization.mjs'
      - 'qa/modaryx-v2-preproduction-contract-registry.json'
  pull_request:
    branches:
      - 'design/modaryx-v2-blue-violet-product-20261005'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modaryx-v2-schema-materialization-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Validate strict V2 schemas without migration
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate schema plan and materialization
        run: |
          set -euo pipefail
          node qa/check-v2-schema-plan-contract.mjs
          node qa/check-v2-schema-materialization.mjs
          node qa/check-v2-preproduction-contract-registry.mjs
          echo PASS_V2_SCHEMA_CANDIDATE_PROOF
