name: MODARYX V2 VF Readiness Gate Proof

on:
  push:
    branches:
      - 'audit/modaryx-v2-legacy-boundary-20261003'
    paths:
      - '.github/workflows/modaryx-v2-vf-readiness-gate-proof.yml'
      - 'qa/modaryx-v2-vf-readiness-gate.json'
      - 'qa/check-v2-vf-readiness-gate.mjs'
      - 'CHECKPOINT-CANONIQUE-MODARYX-V2-2026-10-04.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    name: Validate VF readiness blockers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate VF readiness gate
        run: node qa/check-v2-vf-readiness-gate.mjs
