name: MODARYX V2 Threat Model Contract Proof
on:
  push:
    branches: ['audit/modaryx-v2-legacy-boundary-20261003']
    paths:
      - '.github/workflows/modaryx-v2-threat-model-contract-proof.yml'
      - 'qa/modaryx-v2-threat-model-contract.json'
      - 'qa/check-v2-threat-model-contract.mjs'
      - 'docs/MODARYX-V2-THREAT-MODEL-20261003.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false, fetch-depth: 1}
      - run: node qa/check-v2-threat-model-contract.mjs
