name: MODARYX V2 Current Branch Exact-SHA Read-Only Proof

on:
  push:
    branches:
      - 'chatgpt/modaryx-v2-deployment-fingerprint-20261006'
      - 'design/modaryx-v2-blue-violet-product-20261005'
    paths:
      - '.github/workflows/modaryx-v2-current-branch-readonly-proof.yml'
      - 'v2/scripts/prepare-sites-build.mjs'
      - 'qa/check-v2-production-evidence-origin.mjs'
      - 'qa/modaryx-v2-production-evidence-probe-contract.json'
      - 'qa/check-v2-production-evidence-probe-contract.mjs'
      - 'qa/modaryx-v2-build-fingerprint-contract.json'
      - 'qa/check-v2-build-fingerprint.mjs'
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: modaryx-v2-current-branch-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Probe exact branch alias with GET HEAD only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate fingerprint and probe contracts
        run: |
          set -euo pipefail
          node qa/check-v2-build-fingerprint.mjs
          node qa/check-v2-production-evidence-probe-contract.mjs

      - name: Build V2 and prove local fingerprint
        working-directory: v2
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node - <<'NODE'
          const fs=require("fs");
          const info=JSON.parse(fs.readFileSync("dist/client/build-info.json","utf8"));
          if(info.commitSha!==process.env.GITHUB_SHA) throw new Error("local fingerprint SHA mismatch: "+info.commitSha+" != "+process.env.GITHUB_SHA);
          console.log("LOCAL_BUILD_FINGERPRINT",JSON.stringify(info));
          console.log("PASS_V2_LOCAL_BUILD_FINGERPRINT");
          NODE

      - name: Resolve exact immutable Cloudflare preview URL
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require("fs");
          const repo=process.env.GITHUB_REPOSITORY;
          const sha=process.env.GITHUB_SHA;
          const token=process.env.GITHUB_TOKEN;
          if(!repo||!sha||!token) throw new Error("GitHub Actions context missing");
          const api="https://api.github.com/repos/"+repo+"/commits/"+sha+"/check-runs";
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const headers={
            accept:"application/vnd.github+json",
            authorization:"Bearer "+token,
            "x-github-api-version":"2022-11-28"
          };
          let preview=null;
          for(let attempt=1;attempt<=60;attempt++){
            const response=await fetch(api,{headers});
            if(!response.ok) throw new Error("check-runs HTTP "+response.status);
            const body=await response.json();
            const cf=(body.check_runs||[]).find(x=>x.name==="Cloudflare Pages"&&x.status==="completed"&&x.conclusion==="success");
            const summary=cf?.output?.summary||"";
            const match=summary.match(/<strong>Preview URL:<\/strong>[\s\S]*?<a href='(https:\/\/[a-z0-9]+\.nova-forge-site-public\.pages\.dev)'/i);
            if(match){
              preview=match[1];
              console.log("CLOUDFLARE_EXACT_PREVIEW",preview);
              break;
            }
            if(attempt===1||attempt%10===0) console.log("WAIT_CLOUDFLARE_CHECK",attempt);
            await sleep(5000);
          }
          if(!preview) throw new Error("exact Cloudflare Preview URL not found in successful check");
          fs.appendFileSync(process.env.GITHUB_ENV,"MODARYX_BRANCH_ORIGIN="+preview+"\n");
          NODE

      - name: Wait for exact deployed build fingerprint
        run: |
          set -euo pipefail
          matched=0
          for attempt in {1..48}; do
            body="$(curl --fail --silent --show-error --max-time 10 "$MODARYX_BRANCH_ORIGIN/build-info.json" 2>/dev/null || true)"
            got="$(printf '%s' "$body" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{try{const j=JSON.parse(s);process.stdout.write(String(j.commitSha||""))}catch{}})')"
            if [ "$attempt" = "1" ] || [ $((attempt % 8)) = "0" ]; then
              echo "FINGERPRINT_DIAGNOSTIC attempt=${attempt} sha=${got:-NONE}"
            fi
            if [ "$got" = "$GITHUB_SHA" ]; then
              echo "EXACT_DEPLOYMENT_FINGERPRINT ${got}"
              matched=1
              break
            fi
            sleep 5
          done
          test "$matched" = "1"

      - name: Run exact-SHA PRE_CUTOVER read-only probe
        env:
          MODARYX_EXPECTED_MODE: PRE_CUTOVER
          MODARYX_EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          MODARYX_PRODUCTION_ORIGIN="$MODARYX_BRANCH_ORIGIN" node qa/check-v2-production-evidence-origin.mjs
          echo PASS_V2_CURRENT_BRANCH_EXACT_SHA_READ_ONLY_PROOF
