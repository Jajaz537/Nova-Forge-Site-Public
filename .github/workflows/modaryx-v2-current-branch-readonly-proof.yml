name: MODARYX V2 Current Branch Exact-SHA Read-Only Proof

on:
  push:
    branches:
      - 'chatgpt/modaryx-v2-deployment-fingerprint-20261006'
      - 'design/modaryx-v2-blue-violet-product-20261005'
    paths:
      - '.github/workflows/modaryx-v2-current-branch-readonly-proof.yml'
      - 'v2/scripts/prepare-sites-build.mjs'
      - 'qa/check-v2-production-evidence-origin.mjs'
      - 'qa/modaryx-v2-production-evidence-probe-contract.json'
      - 'qa/check-v2-production-evidence-probe-contract.mjs'
      - 'qa/modaryx-v2-build-fingerprint-contract.json'
      - 'qa/check-v2-build-fingerprint.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modaryx-v2-current-branch-readonly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Probe exact branch alias with GET HEAD only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate fingerprint and probe contracts
        run: |
          set -euo pipefail
          node qa/check-v2-build-fingerprint.mjs
          node qa/check-v2-production-evidence-probe-contract.mjs

      - name: Build V2 and prove local fingerprint
        working-directory: v2
        run: |
          set -euo pipefail
          npm ci
          npm run build
          node - <<'NODE'
          const fs=require("fs");
          const info=JSON.parse(fs.readFileSync("dist/client/build-info.json","utf8"));
          if(info.commitSha!==process.env.GITHUB_SHA) throw new Error("local fingerprint SHA mismatch: "+info.commitSha+" != "+process.env.GITHUB_SHA);
          console.log("LOCAL_BUILD_FINGERPRINT",JSON.stringify(info));
          console.log("PASS_V2_LOCAL_BUILD_FINGERPRINT");
          NODE

      - name: Diagnose and wait for exact Cloudflare branch alias
        run: |
          set -euo pipefail
          alias_name="$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')"
          origin="https://${alias_name}.nova-forge-site-public.pages.dev"
          echo "MODARYX_BRANCH_ORIGIN=${origin}" >> "$GITHUB_ENV"
          echo "BRANCH_ALIAS_ORIGIN ${origin}"
          matched=0
          for attempt in {1..24}; do
            root_code="$(curl --silent --show-error --max-time 10 -o /tmp/modaryx-root.html -w '%{http_code}' "${origin}/" 2>/dev/null || printf '000')"
            info_code="$(curl --silent --show-error --max-time 10 -o /tmp/modaryx-build-info.json -w '%{http_code}' "${origin}/build-info.json" 2>/dev/null || printf '000')"
            got=""
            if [ "$info_code" = "200" ]; then
              got="$(node -e 'const fs=require("fs");try{const j=JSON.parse(fs.readFileSync("/tmp/modaryx-build-info.json","utf8"));process.stdout.write(String(j.commitSha||""))}catch{}')"
            fi
            if [ "$attempt" = "1" ] || [ $((attempt % 6)) = "0" ]; then
              root_title="$(grep -o -i '<title>[^<]*' /tmp/modaryx-root.html 2>/dev/null | head -1 | sed -E 's/<title>//I' || true)"
              echo "ALIAS_DIAGNOSTIC attempt=${attempt} root=${root_code} buildInfo=${info_code} sha=${got:-NONE} title=${root_title:-NONE}"
            fi
            if [ "$got" = "$GITHUB_SHA" ]; then
              echo "EXACT_BRANCH_FINGERPRINT ${got}"
              matched=1
              break
            fi
            sleep 5
          done
          if [ "$matched" != "1" ]; then
            echo "ALIAS_FINGERPRINT_NOT_CURRENT expected=${GITHUB_SHA}"
            exit 1
          fi

      - name: Run exact-SHA PRE_CUTOVER read-only probe
        env:
          MODARYX_EXPECTED_MODE: PRE_CUTOVER
          MODARYX_EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          MODARYX_PRODUCTION_ORIGIN="$MODARYX_BRANCH_ORIGIN" node qa/check-v2-production-evidence-origin.mjs
          echo PASS_V2_CURRENT_BRANCH_EXACT_SHA_READ_ONLY_PROOF
