name: MODARYX IA site to SD runner scope probe

on:
  push:
    branches:
      - "chatgpt/modaryx-ai-founder-integration-20261005"
    paths:
      - ".github/workflows/modaryx-ai-site-sd-runner-scope-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 3
    steps:
      - name: Prove site repository can schedule the SD runner
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $out=Join-Path $env:RUNNER_TEMP 'modaryx-site-sd-runner-scope'
          if(Test-Path $out){Remove-Item $out -Recurse -Force}
          New-Item -ItemType Directory -Force -Path $out|Out-Null

          [ordered]@{
            schema='modaryx-site-sd-runner-scope-v1'
            created_at=(Get-Date).ToString('o')
            runner_name=$env:RUNNER_NAME
            runner_os=$env:RUNNER_OS
            runner_arch=$env:RUNNER_ARCH
            repository=$env:GITHUB_REPOSITORY
            secret_values_read=$false
            external_changes_made=$false
            awards_vf_points=$false
          }|ConvertTo-Json -Depth 5|Set-Content (Join-Path $out 'runner-scope.json') -Encoding UTF8

          if($env:RUNNER_NAME -ne 'SD' -or $env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64'){
            throw "Unexpected runner identity: $env:RUNNER_NAME/$env:RUNNER_OS/$env:RUNNER_ARCH"
          }
          Write-Host "MODARYX_SITE_SD_RUNNER_SCOPE_PASS runner=$env:RUNNER_NAME os=$env:RUNNER_OS arch=$env:RUNNER_ARCH"
          "MODARYX_SITE_SD_SCOPE_EVIDENCE=$out"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload runner scope evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: modaryx-ai-site-sd-runner-scope
          path: ${{ env.MODARYX_SITE_SD_SCOPE_EVIDENCE }}
          if-no-files-found: error
          retention-days: 30
