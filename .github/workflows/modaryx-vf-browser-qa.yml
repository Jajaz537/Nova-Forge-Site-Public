name: MODARYX VF browser QA

on:
  push:
    branches:
      - site/modaryx-vf-premium-hd-v3
    paths:
      - '.github/workflows/modaryx-vf-browser-qa.yml'
      - '.github/modaryx-vf-browser-qa-trigger.json'

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZONE_NAME: modaryxmods.com
      PROJECT_NAME: nova-forge-site-public
      TARGET_BRANCH: site/modaryx-vf-premium-hd-v3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site/modaryx-vf-premium-hd-v3
          fetch-depth: 1

      - name: Resolve successful Cloudflare preview
        id: preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          zones="$(curl -fsS "${auth[@]}" "$api/zones?name=$ZONE_NAME")"
          account_id="$(jq -r '.result[0].account.id' <<<"$zones")"
          test -n "$account_id" && test "$account_id" != "null"

          preview_url=""
          for attempt in $(seq 1 36); do
            deployments="$(curl -fsS "${auth[@]}" "$api/accounts/$account_id/pages/projects/$PROJECT_NAME/deployments")"
            candidate="$(DEPLOYMENTS="$deployments" python3 - <<'PY'
          import json, os
          data=json.loads(os.environ['DEPLOYMENTS'])
          target=os.environ['TARGET_BRANCH']
          rows=[]
          for dep in data.get('result',[]):
              meta=((dep.get('deployment_trigger') or {}).get('metadata') or {})
              if meta.get('branch') == target and dep.get('environment') == 'preview':
                  rows.append(dep)
          rows.sort(key=lambda d:d.get('created_on',''), reverse=True)
          if rows:
              d=rows[0]
              print((d.get('latest_stage') or {}).get('status','unknown') + '|' + d.get('url',''))
          PY
            )"
            status="${candidate%%|*}"
            url="${candidate#*|}"
            echo "preview_wait attempt=$attempt status=${status:-none}"
            if [ "$status" = "success" ] && [ -n "$url" ]; then
              preview_url="$url"
              break
            fi
            sleep 5
          done
          test -n "$preview_url"
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "PREVIEW_URL=$preview_url"

      - name: Capture responsive browser proofs
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo 'No Chromium/Chrome executable on hosted runner'
            exit 1
          fi
          echo "CHROME_BIN=$chrome"
          "$chrome" --version
          mkdir -p qa-shots qa-dom

          shot() {
            local name="$1" width="$2" height="$3" path="$4"
            echo "SHOT=$name ${width}x${height} $path"
            "$chrome" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --disable-dev-shm-usage --force-device-scale-factor=1 --window-size="${width},${height}" --screenshot="qa-shots/${name}.png" "${PREVIEW_URL}${path}" >/tmp/chrome-${name}.log 2>&1
          }

          shot home-desktop 1440 900 /
          shot home-tablet 1024 768 /
          shot home-mobile 390 844 /
          shot games 1440 900 /games.html
          shot gta6 1440 900 /gta-6/mods/
          shot rdr2 1440 900 /red-dead-redemption-2/mods/
          shot catalog 1440 900 /catalog.html
          shot creator 1440 900 /creator-studio.html
          shot community 1440 900 /community.html
          shot security 1440 900 /security.html
          shot docs 1440 900 /documentation.html

          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1440,900 --dump-dom "$PREVIEW_URL/" > qa-dom/home-desktop.html 2>/tmp/chrome-dom.log
          grep -Fq 'MODARYX MODS' qa-dom/home-desktop.html
          grep -Fq 'Bébé Loup et Bébé Dragon devant le royaume MODARYX' qa-dom/home-desktop.html
          grep -Fq 'UN ÉCOSYSTÈME POUR TOUS LES MONDES' qa-dom/home-desktop.html
          grep -Fq 'ILS GRANDISSENT AVEC TOI' qa-dom/home-desktop.html

          python3 - <<'PY'
          from pathlib import Path
          import struct, zlib
          expected={
            'home-desktop.png':(1440,900),'home-tablet.png':(1024,768),'home-mobile.png':(390,844),
            'games.png':(1440,900),'gta6.png':(1440,900),'rdr2.png':(1440,900),'catalog.png':(1440,900),
            'creator.png':(1440,900),'community.png':(1440,900),'security.png':(1440,900),'docs.png':(1440,900)
          }
          for name, dims in expected.items():
              p=Path('qa-shots')/name
              data=p.read_bytes()
              if len(data) < 12000:
                  raise SystemExit(f'{name}: screenshot unexpectedly small ({len(data)} bytes)')
              if data[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'{name}: not PNG')
              w,h=struct.unpack('>II',data[16:24])
              if (w,h) != dims:
                  raise SystemExit(f'{name}: dimensions {(w,h)} != {dims}')
              pos=8; raw=b''; ctype=bitdepth=None
              while pos < len(data):
                  n=struct.unpack('>I',data[pos:pos+4])[0]; typ=data[pos+4:pos+8]; chunk=data[pos+8:pos+8+n]; pos += 12+n
                  if typ == b'IHDR':
                      bitdepth=chunk[8]; ctype=chunk[9]
                  elif typ == b'IDAT': raw += chunk
                  elif typ == b'IEND': break
              if bitdepth != 8 or ctype not in (2,6):
                  raise SystemExit(f'{name}: unexpected PNG mode depth={bitdepth} color={ctype}')
              decoded=zlib.decompress(raw)
              sample=decoded[::max(1,len(decoded)//10000)]
              if len(set(sample)) < 12:
                  raise SystemExit(f'{name}: low visual entropy / possible blank render')
              print(f'{name}: {w}x{h} bytes={len(data)} entropy_values={len(set(sample))}')
          print('RESPONSIVE_SCREENSHOT_DIMENSIONS=PASS')
          print('NON_BLANK_RENDER_GUARD=PASS')
          print('RAR_HOMEPAGE_DOM_MARKERS=PASS')
          PY

          echo 'BROWSER_QA_CAPTURE=PASS'
          echo 'PRODUCTION_NOT_CHANGED=yes'
          echo 'DNSSEC_NOT_CHANGED=yes'

      - name: Upload responsive proof screenshots
        uses: actions/upload-artifact@v4
        with:
          name: modaryx-vf-browser-qa-v3
          path: |
            qa-shots/*.png
            qa-dom/home-desktop.html
          if-no-files-found: error
          retention-days: 7
