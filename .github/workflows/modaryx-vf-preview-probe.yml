name: MODARYX VF preview probe

on:
  push:
    branches:
      - site/modaryx-vf-premium-hd-v2
    paths:
      - '.github/modaryx-vf-preview-probe-trigger.json'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ZONE_NAME: modaryxmods.com
      PROJECT_NAME: nova-forge-site-public
      TARGET_BRANCH: site/modaryx-vf-premium-hd-v2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site/modaryx-vf-premium-hd-v2
      - name: Discover and probe Cloudflare Pages preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          zone_json="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME")"
          account_id="$(ZONE_JSON="$zone_json" python3 - <<'PY'
          import json, os
          data=json.loads(os.environ['ZONE_JSON'])
          if not data.get('success') or len(data.get('result',[])) != 1:
              raise SystemExit('zone lookup failed or ambiguous')
          z=data['result'][0]
          if z.get('name') != os.environ['ZONE_NAME']:
              raise SystemExit('unexpected zone')
          print(z['account']['id'])
          PY
          )"

          deployments="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' "https://api.cloudflare.com/client/v4/accounts/$account_id/pages/projects/$PROJECT_NAME/deployments?env=preview&per_page=50")"
          preview_url="$(DEPLOYMENTS="$deployments" python3 - <<'PY'
          import json, os
          data=json.loads(os.environ['DEPLOYMENTS'])
          if not data.get('success'):
              raise SystemExit('Pages deployment lookup failed')
          target=os.environ['TARGET_BRANCH']
          matches=[]
          for dep in data.get('result',[]):
              branch=((dep.get('deployment_trigger') or {}).get('metadata') or {}).get('branch')
              if branch == target:
                  matches.append(dep)
          if not matches:
              raise SystemExit(f'no preview deployment found for {target}')
          matches.sort(key=lambda d: d.get('created_on',''), reverse=True)
          dep=matches[0]
          stage=dep.get('latest_stage') or {}
          if stage.get('status') != 'success':
              raise SystemExit(f"latest preview is not successful: {stage.get('status')}")
          print(dep['url'])
          print(f"PREVIEW_DEPLOYMENT_ID={dep.get('id')}", file=os.sys.stderr)
          print(f"PREVIEW_CREATED_ON={dep.get('created_on')}", file=os.sys.stderr)
          PY
          )"

          echo "PREVIEW_URL=$preview_url"
          headers="$(curl --http2 -fsSI "$preview_url/")"
          printf '%s\n' "$headers" | head -n 20
          printf '%s\n' "$headers" | grep -Eq '^HTTP/[0-9.]+ 200'

          html="$(curl --http2 -fsS "$preview_url/")"
          printf '%s' "$html" | grep -Fq 'MODARYX MODS'
          printf '%s' "$html" | grep -Fq 'modaryx-vf.css'
          printf '%s' "$html" | grep -Fq 'Loup et Dragon devant le royaume MODARYX'

          art_headers="$(curl --http2 -fsSI "$preview_url/assets/modaryx-rar-hero.webp")"
          printf '%s\n' "$art_headers" | grep -Eq '^HTTP/[0-9.]+ 200'
          printf '%s\n' "$art_headers" | grep -Eqi '^content-type:[[:space:]]*image/webp'

          echo 'CLOUDFLARE_PREVIEW_HTTP=PASS'
          echo 'CLOUDFLARE_PREVIEW_MODARYX_HTML=PASS'
          echo 'CLOUDFLARE_PREVIEW_RAR_WEBP=PASS'
          echo 'PRODUCTION_NOT_CHANGED=yes'
          echo 'DNSSEC_NOT_CHANGED=yes'
