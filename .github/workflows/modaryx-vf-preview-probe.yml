name: MODARYX VF preview probe

on:
  push:
    branches:
      - site/modaryx-vf-premium-hd-v3
    paths:
      - '.github/workflows/modaryx-vf-preview-probe.yml'
      - '.github/modaryx-vf-preview-probe-trigger.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ZONE_NAME: modaryxmods.com
      PROJECT_NAME: nova-forge-site-public
      TARGET_BRANCH: site/modaryx-vf-premium-hd-v3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site/modaryx-vf-premium-hd-v3

      - name: Discover and probe Cloudflare Pages preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')

          zone_json="$(curl -fsS "${auth[@]}" "$api/zones?name=$ZONE_NAME")"
          account_id="$(ZONE_JSON="$zone_json" python3 - <<'PY'
          import json, os
          data=json.loads(os.environ['ZONE_JSON'])
          if not data.get('success') or len(data.get('result',[])) != 1:
              raise SystemExit('zone lookup failed or ambiguous')
          z=data['result'][0]
          if z.get('name') != os.environ['ZONE_NAME']:
              raise SystemExit('unexpected zone')
          print(z['account']['id'])
          PY
          )"

          project_json="$(curl -fsS "${auth[@]}" "$api/accounts/$account_id/pages/projects/$PROJECT_NAME")"
          PROJECT_JSON="$project_json" python3 - <<'PY'
          import json, os
          data=json.loads(os.environ['PROJECT_JSON'])
          if not data.get('success'):
              raise SystemExit('Pages project lookup failed')
          r=data['result']
          print('PAGES_PROJECT=' + str(r.get('name')))
          print('PAGES_PRODUCTION_BRANCH=' + str(((r.get('source') or {}).get('config') or {}).get('production_branch')))
          PY

          preview_url=""
          for attempt in $(seq 1 36); do
            deployments="$(curl -fsS "${auth[@]}" "$api/accounts/$account_id/pages/projects/$PROJECT_NAME/deployments")"
            candidate="$(DEPLOYMENTS="$deployments" python3 - <<'PY'
          import json, os
          data=json.loads(os.environ['DEPLOYMENTS'])
          if not data.get('success'):
              raise SystemExit('Pages deployment lookup failed')
          target=os.environ['TARGET_BRANCH']
          matches=[]
          for dep in data.get('result',[]):
              meta=((dep.get('deployment_trigger') or {}).get('metadata') or {})
              if meta.get('branch')==target and dep.get('environment')=='preview':
                  matches.append(dep)
          matches.sort(key=lambda d:d.get('created_on',''), reverse=True)
          if matches:
              dep=matches[0]
              print((dep.get('latest_stage') or {}).get('status','unknown')+'|'+dep.get('url','')+'|'+str(dep.get('id',''))+'|'+str(dep.get('created_on','')))
          PY
            )"
            status="${candidate%%|*}"
            rest="${candidate#*|}"
            url="${rest%%|*}"
            rest2="${rest#*|}"
            dep_id="${rest2%%|*}"
            created="${rest2#*|}"
            echo "preview_wait attempt=$attempt status=${status:-none} deployment=${dep_id:-none}"
            if [ "$status" = "success" ] && [ -n "$url" ]; then
              preview_url="$url"
              echo "PREVIEW_DEPLOYMENT_ID=$dep_id"
              echo "PREVIEW_CREATED_ON=$created"
              break
            fi
            sleep 5
          done
          test -n "$preview_url"

          echo "PREVIEW_URL=$preview_url"
          headers="$(curl --http2 -fsSI "$preview_url/")"
          printf '%s\n' "$headers" | head -n 20
          printf '%s\n' "$headers" | grep -Eq '^HTTP/[0-9.]+ 200'

          html="$(curl --http2 -fsS "$preview_url/")"
          printf '%s' "$html" | grep -Fq 'MODARYX MODS'
          printf '%s' "$html" | grep -Fq 'modaryx-vf.css'
          printf '%s' "$html" | grep -Fq 'Bébé Loup et Bébé Dragon devant le royaume MODARYX'

          art_headers="$(curl --http2 -fsSI "$preview_url/assets/modaryx-rar-hero.webp")"
          printf '%s\n' "$art_headers" | grep -Eq '^HTTP/[0-9.]+ 200'
          printf '%s\n' "$art_headers" | grep -Eqi '^content-type:[[:space:]]*image/webp'

          echo 'CLOUDFLARE_PREVIEW_HTTP=PASS'
          echo 'CLOUDFLARE_PREVIEW_MODARYX_HTML=PASS'
          echo 'CLOUDFLARE_PREVIEW_RAR_WEBP=PASS'
          echo 'PRODUCTION_NOT_CHANGED=yes'
          echo 'DNSSEC_NOT_CHANGED=yes'
