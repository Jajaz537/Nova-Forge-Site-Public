name: MODARYX V2 Production Evidence Read-Only Probe

on:
  push:
    branches:
      - 'chatgpt/modaryx-v2-production-evidence-probe-20261006'
      - 'chatgpt/modaryx-v2-production-probe-rum-20261006'
    paths:
      - '.github/workflows/modaryx-v2-production-evidence-probe.yml'
      - 'qa/modaryx-v2-production-evidence-probe-contract.json'
      - 'qa/check-v2-production-evidence-probe-contract.mjs'
      - 'qa/check-v2-production-evidence-origin.mjs'
      - 'qa/modaryx-v2-preproduction-contract-registry.json'
  pull_request:
    branches:
      - 'design/modaryx-v2-blue-violet-product-20261005'
  workflow_dispatch:
    inputs:
      origin:
        description: Bare HTTPS production/candidate origin
        required: true
        type: string
      mode:
        description: Probe mode
        required: true
        type: choice
        options:
          - PRE_CUTOVER
          - POST_CUTOVER
      expected_sha:
        description: Optional exact deployed git SHA to require
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: modaryx-v2-production-evidence-probe-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Prove read-only production probe contract
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate read-only probe contract
        run: |
          set -euo pipefail
          node qa/check-v2-production-evidence-probe-contract.mjs
          node qa/check-v2-preproduction-contract-registry.mjs
          echo PASS_V2_PRODUCTION_EVIDENCE_PROBE_CONTRACT_WORKFLOW

  live-read-only:
    name: Probe supplied origin with GET/HEAD only
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Read-only origin probe
        env:
          MODARYX_PRODUCTION_ORIGIN: ${{ inputs.origin }}
          MODARYX_EXPECTED_MODE: ${{ inputs.mode }}
          MODARYX_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          node qa/check-v2-production-evidence-origin.mjs
