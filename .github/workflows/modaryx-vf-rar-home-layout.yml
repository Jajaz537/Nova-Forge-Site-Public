name: MODARYX VF RAR homepage layout

on:
  push:
    branches:
      - site/modaryx-vf-premium-hd-v2
    paths:
      - '.github/modaryx-vf-rar-home-layout-trigger.json'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site/modaryx-vf-premium-hd-v2
          fetch-depth: 0
      - name: Apply recovered RAR placement to homepage top
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          page = Path('index.html')
          fragment = Path('.github/modaryx-rar-home-fragment.html')
          text = page.read_text(encoding='utf-8')
          block = fragment.read_text(encoding='utf-8')

          pattern = r'  <header class="nova-topbar">.*?(?=    <section class="catalogue-zone")'
          new, count = re.subn(pattern, block, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected exactly one homepage-top block, replaced={count}')

          if 'Nova Forge' in block or 'getnovaforge.com' in block:
              raise SystemExit('Old public brand leaked into new fragment')

          required = [
              'class="mx-topbar"',
              'class="mx-hero"',
              'UN ÉCOSYSTÈME POUR TOUS LES MONDES',
              '>Bébés<', '>Jeunes<', '>Forgés<', '>Royaux<',
              'MODARYX MODS'
          ]
          missing = [item for item in required if item not in new]
          if missing:
              raise SystemExit('Missing required layout markers: ' + repr(missing))

          page.write_text(new, encoding='utf-8', newline='\n')
          print('RAR_PLACEMENT_HOME_PROOF=PASS')
          print('PUBLIC_BRAND=MODARYX MODS')
          print('LAYOUT=header+hero-left+central-scene+right-manifesto+5-portals+4-growth+vision')
          PY
      - name: Commit recovered placement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat(site): match recovered RAR homepage placement"
          git push origin HEAD:site/modaryx-vf-premium-hd-v2
