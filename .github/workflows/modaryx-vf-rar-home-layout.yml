name: MODARYX VF RAR homepage finalize

on:
  push:
    branches:
      - site/modaryx-vf-premium-hd-v2
    paths:
      - '.github/modaryx-vf-rar-home-layout-trigger.json'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site/modaryx-vf-premium-hd-v2
          fetch-depth: 0
      - name: Finalize recovered homepage placement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          text=text.replace('./assets/modaryx-vf.css?v=20260911-1','./assets/modaryx-vf.css?v=20260911-2',1)
          required=[
            'class="mx-topbar"',
            'class="mx-hero"',
            'UN ÉCOSYSTÈME POUR TOUS LES MONDES',
            '>Bébés<', '>Jeunes<', '>Forgés<', '>Royaux<',
            './assets/modaryx-vf.css?v=20260911-2'
          ]
          missing=[x for x in required if x not in text]
          if missing:
              raise SystemExit('RAR finalization markers missing: '+repr(missing))
          p.write_text(text,encoding='utf-8',newline='\n')
          print('RAR_HOME_FINALIZE_PROOF=PASS')
          print('PUBLIC_BRAND=MODARYX MODS')
          PY
      - name: Remove temporary RAR applicator files and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/modaryx-rar-home-fragment.html
          git rm .github/modaryx-vf-rar-home-layout-trigger.json
          git rm .github/workflows/modaryx-vf-rar-home-layout.yml
          git add index.html
          git commit -m "chore(site): finalize recovered MODARYX homepage layout"
          git push origin HEAD:site/modaryx-vf-premium-hd-v2
