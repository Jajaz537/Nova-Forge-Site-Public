name: MODARYX V2 Data History Candidate Proof

on:
  push:
    branches:
      - 'chatgpt/modaryx-v2-data-history-20261006'
    paths:
      - '.github/workflows/modaryx-v2-data-history-proof.yml'
      - 'migrations/0006_modaryx_v2_data_history.sql'
      - 'functions/_lib/data-history.mjs'
      - 'functions/api/v1/history/**'
      - 'functions/api/v1/profile.js'
      - 'functions/api/v1/notifications/preferences.js'
      - 'v2/src/App.jsx'
      - 'v2/src/api/modaryx-api.js'
      - 'qa/modaryx-v2-data-history-contract.json'
      - 'qa/check-v2-data-history.mjs'
      - 'qa/modaryx-v2-preproduction-contract-registry.json'
  pull_request:
    branches:
      - 'design/modaryx-v2-blue-violet-product-20261005'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modaryx-v2-data-history-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Prove owner-scoped append-only history without remote D1 apply
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate history candidate
        run: |
          set -euo pipefail
          node --experimental-sqlite qa/check-v2-data-history.mjs
          node qa/check-v2-preproduction-contract-registry.mjs
      - name: Build root and V2
        run: |
          set -euo pipefail
          npm run build
          cd v2
          npm ci
          npm run build
      - name: Marker
        run: echo PASS_V2_DATA_HISTORY_PROOF
