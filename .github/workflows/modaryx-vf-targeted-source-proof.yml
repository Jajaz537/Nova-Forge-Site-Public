permissions:
  contents: read

concurrency:
  group: modaryx-site-first-source-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-proof:
    name: Targeted source proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Record runtime
        shell: bash
        run: |
          set -euo pipefail
          node --version
          git rev-parse HEAD

      - name: Run targeted Site First source proof
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-site-first-vf.mjs

      - name: Run targeted integration readiness proof
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-integration-readiness.cjs

      - name: Run targeted storage and repair contract proof
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-storage-repair-contracts.cjs

      - name: Run targeted provenance receipt contract proof
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-provenance-receipt-contracts.cjs

      - name: Run targeted account and community contract proof
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-account-community-contracts.cjs

      - name: Run targeted signature attestation contract proof
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-signature-attestation-contract.cjs

      - name: Run targeted signature verification engine proof
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-signature-verification-engine.mjs

      - name: Run targeted trusted signer gate proof
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-trusted-signers-gate.mjs

      - name: Run targeted distribution trust chain proof
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-distribution-trust-chain.mjs

      - name: Run targeted storage transport primitive proof
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-storage-transport-primitive.mjs

      - name: Run targeted Storage / Repair orchestrator proof
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-storage-repair-orchestrator.mjs

      - name: Run targeted storage repair decision engine proof
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-storage-repair-decision-engine.mjs

      - name: Run targeted integration consent engine proof
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-integration-consent-engine.mjs

      - name: Run targeted integration discovery runtime proof
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-integration-discovery-runtime.mjs

      - name: Run targeted runtime resilience hardening proof
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-runtime-resilience-hardening.mjs

      - name: Run targeted Guide and OS bridge contract proof
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-guide-os-bridge-contracts.cjs

      - name: Run targeted passkey provider readiness proof
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-passkey-provider-readiness.cjs

      - name: Run targeted distribution lock proof
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-download-recovery.cjs
          node qa/check-distribution-lock-contracts.cjs

      - name: Run targeted local platform contract proof
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-local-platform-contracts.cjs

      - name: Run targeted backend DEV foundation proof
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-backend-dev-foundation.mjs

      - name: Run targeted DEV provider readiness proof
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-dev-provider-readiness.cjs

      - name: Run targeted remote write endpoint proof
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-remote-write-endpoints.mjs

      - name: Run targeted Auth0 BFF session proof
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-auth-bff.mjs

      - name: Run targeted Founder DEV proof surface guard
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-founder-dev-proof-surface.cjs

      - name: Run targeted profiles account UI proof
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-profiles-account-ui.cjs

      - name: Run targeted community remote UI proof
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-community-remote-ui.cjs

      - name: Run targeted moderation publication engine proof
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-moderation-publication-engine.mjs

      - name: Run targeted SEO contract proof
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-seo-contract.cjs

      - name: Run targeted anti-forget gate
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-anti-oubli-current.cjs
