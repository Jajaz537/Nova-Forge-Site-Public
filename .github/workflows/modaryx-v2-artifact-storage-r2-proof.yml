name: MODARYX V2 R2 Artifact Storage Adapter Proof

on:
  push:
    branches:
      - 'chatgpt/modaryx-v2-artifact-storage-r2-adapter-20261006'
    paths:
      - '.github/workflows/modaryx-v2-artifact-storage-r2-proof.yml'
      - 'functions/_lib/artifact-storage.mjs'
      - 'qa/modaryx-v2-artifact-storage-r2-contract.json'
      - 'qa/check-v2-artifact-storage-r2.mjs'
      - 'qa/modaryx-v2-preproduction-contract-registry.json'
  pull_request:
    branches:
      - 'design/modaryx-v2-blue-violet-product-20261005'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modaryx-v2-r2-artifact-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Prove R2 adapter on fake binding without Cloudflare mutation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate R2 adapter candidate
        run: |
          set -euo pipefail
          node qa/check-v2-artifact-storage-r2.mjs
          node qa/check-v2-preproduction-contract-registry.mjs
          echo PASS_V2_R2_ARTIFACT_STORAGE_ADAPTER_PROOF
      - name: Mirror Cloudflare root build
        run: npm run build
