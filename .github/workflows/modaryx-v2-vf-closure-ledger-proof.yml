name: MODARYX V2 VF Closure Ledger Proof

on:
  push:
    branches:
      - 'chatgpt/modaryx-v2-vf-closure-ledger-20261006'
    paths:
      - '.github/workflows/modaryx-v2-vf-closure-ledger-proof.yml'
      - 'qa/modaryx-v2-vf-closure-ledger.json'
      - 'qa/check-v2-vf-closure-ledger.mjs'
      - 'qa/modaryx-v2-vf-readiness-gate.json'
      - 'qa/modaryx-v2-preproduction-contract-registry.json'
  pull_request:
    branches:
      - 'design/modaryx-v2-blue-violet-product-20261005'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modaryx-v2-vf-closure-ledger-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Prove closure ledger exactly matches 20 OPEN VF blockers
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate closure ledger
        run: |
          set -euo pipefail
          node qa/check-v2-vf-closure-ledger.mjs
          node qa/check-v2-preproduction-contract-registry.mjs
          echo PASS_V2_VF_CLOSURE_LEDGER_PROOF
