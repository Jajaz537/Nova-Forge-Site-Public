name: Cloudflare MODARYX cutover

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Safe cutover action
        required: true
        default: status
        type: choice
        options:
          - status
          - attach-pages
          - repair-apex-pages
          - enable-dnssec
  push:
    branches: [main]
    paths:
      - '.github/cloudflare-control.json'

permissions:
  contents: read

concurrency:
  group: modaryx-cloudflare-cutover
  cancel-in-progress: false

env:
  CLOUDFLARE_ZONE_NAME: modaryxmods.com
  CLOUDFLARE_PROJECT_NAME: nova-forge-site-public
  CLOUDFLARE_PAGES_HOST: nova-forge-site-public.pages.dev
  EXPECTED_NS_1: dawn.ns.cloudflare.com
  EXPECTED_NS_2: sage.ns.cloudflare.com

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout control state
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve requested safe action
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.mode }}"
          else
            mode="$(jq -r '.mode' .github/cloudflare-control.json)"
          fi
          case "$mode" in
            status|attach-pages|repair-apex-pages|enable-dnssec) ;;
            *) echo "Unsupported mode: $mode"; exit 1 ;;
          esac
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "REQUESTED_MODE=$mode"

      - name: Require scoped Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Missing repository secret CLOUDFLARE_API_TOKEN"
            exit 1
          fi

      - name: Verify MODARYX zone and existing Pages project
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          verify_json="$(curl -fsS "${auth[@]}" "${api}/user/tokens/verify")"
          test "$(jq -r '.success' <<<"$verify_json")" = "true"
          test "$(jq -r '.result.status' <<<"$verify_json")" = "active"

          zones_json="$(curl -fsS "${auth[@]}" "${api}/zones?name=${CLOUDFLARE_ZONE_NAME}")"
          test "$(jq -r '.success' <<<"$zones_json")" = "true"
          test "$(jq '.result | length' <<<"$zones_json")" -eq 1

          zone_id="$(jq -r '.result[0].id' <<<"$zones_json")"
          account_id="$(jq -r '.result[0].account.id' <<<"$zones_json")"
          zone_status="$(jq -r '.result[0].status' <<<"$zones_json")"
          plan_name="$(jq -r '.result[0].plan.name // "unknown"' <<<"$zones_json")"
          ns_json="$(jq -c '.result[0].name_servers // []' <<<"$zones_json")"

          test "$zone_status" = "active"
          jq -e --arg ns "$EXPECTED_NS_1" 'index($ns) != null' <<<"$ns_json" >/dev/null
          jq -e --arg ns "$EXPECTED_NS_2" 'index($ns) != null' <<<"$ns_json" >/dev/null

          project_json="$(curl -fsS "${auth[@]}" "${api}/accounts/${account_id}/pages/projects/${CLOUDFLARE_PROJECT_NAME}")"
          test "$(jq -r '.success' <<<"$project_json")" = "true"
          test "$(jq -r '.result.name' <<<"$project_json")" = "$CLOUDFLARE_PROJECT_NAME"

          source_type="$(jq -r '.result.source.type // "direct-upload-or-unreported"' <<<"$project_json")"
          production_branch="$(jq -r '.result.source.config.production_branch // .result.production_branch // "unknown"' <<<"$project_json")"

          echo "zone_id=${zone_id}" >> "$GITHUB_OUTPUT"
          echo "account_id=${account_id}" >> "$GITHUB_OUTPUT"
          echo "TOKEN=active"
          echo "ZONE_ACTIVE=yes"
          echo "EXPECTED_NAMESERVERS=yes"
          echo "PLAN=${plan_name}"
          echo "PAGES_PROJECT=${CLOUDFLARE_PROJECT_NAME}"
          echo "PAGES_SOURCE_TYPE=${source_type}"
          echo "PAGES_PRODUCTION_BRANCH=${production_branch}"
          echo "OLD_DOMAIN_UNTOUCHED=getnovaforge.com"

      - name: Read current MODARYX status
        if: ${{ steps.request.outputs.mode == 'status' }}
        shell: bash
        env:
          ACCOUNT_ID: ${{ steps.preflight.outputs.account_id }}
          ZONE_ID: ${{ steps.preflight.outputs.zone_id }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          domains_json="$(curl -fsS "${auth[@]}" "${api}/accounts/${ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}/domains")"
          test "$(jq -r '.success' <<<"$domains_json")" = "true"
          apex_status="$(jq -r --arg d "$CLOUDFLARE_ZONE_NAME" '.result[]? | select(.name == $d) | .status' <<<"$domains_json" | head -n1)"
          [ -n "$apex_status" ] || apex_status="not-attached"

          dnssec_json="$(curl -fsS "${auth[@]}" "${api}/zones/${ZONE_ID}/dnssec")"
          test "$(jq -r '.success' <<<"$dnssec_json")" = "true"
          dnssec_status="$(jq -r '.result.status // "unknown"' <<<"$dnssec_json")"

          echo "PAGES_DOMAIN_STATUS=${apex_status}"
          echo "DNSSEC_STATUS=${dnssec_status}"
          if curl -fsSIL --max-time 20 "https://${CLOUDFLARE_ZONE_NAME}/" >/dev/null; then
            echo "HTTPS_ROOT=reachable"
          else
            echo "HTTPS_ROOT=not-yet-reachable"
          fi
          echo "OLD_DOMAIN_UNTOUCHED=getnovaforge.com"

      - name: Attach modaryxmods.com to the existing Pages project
        if: ${{ steps.request.outputs.mode == 'attach-pages' }}
        shell: bash
        env:
          ACCOUNT_ID: ${{ steps.preflight.outputs.account_id }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          domain_api="${api}/accounts/${ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}/domains"

          domains_json="$(curl -fsS "${auth[@]}" "$domain_api")"
          test "$(jq -r '.success' <<<"$domains_json")" = "true"
          current_status="$(jq -r --arg d "$CLOUDFLARE_ZONE_NAME" '.result[]? | select(.name == $d) | .status' <<<"$domains_json" | head -n1)"

          if [ -z "$current_status" ]; then
            create_json="$(curl -fsS -X POST "${auth[@]}" "$domain_api" --data "{\"name\":\"${CLOUDFLARE_ZONE_NAME}\"}")"
            test "$(jq -r '.success' <<<"$create_json")" = "true"
            echo "PAGES_DOMAIN_CREATED=${CLOUDFLARE_ZONE_NAME}"
          else
            echo "PAGES_DOMAIN_ALREADY_PRESENT=${current_status}"
          fi

          status=""
          for attempt in $(seq 1 30); do
            one_json="$(curl -fsS "${auth[@]}" "${domain_api}/${CLOUDFLARE_ZONE_NAME}")"
            test "$(jq -r '.success' <<<"$one_json")" = "true"
            status="$(jq -r '.result.status // "unknown"' <<<"$one_json")"
            validation="$(jq -r '.result.validation_data.status // "unknown"' <<<"$one_json")"
            echo "attempt=${attempt} domain_status=${status} validation=${validation}"
            if [ "$status" = "active" ]; then
              break
            fi
            if [ "$status" = "error" ] || [ "$status" = "blocked" ]; then
              jq '.result | {name,status,validation_data,verification_data}' <<<"$one_json"
              exit 1
            fi
            sleep 20
          done

          if [ "$status" != "active" ]; then
            echo "Pages custom domain did not become active within the guarded wait window. No destructive action taken."
            exit 1
          fi

          curl -fsSIL --max-time 30 "https://${CLOUDFLARE_ZONE_NAME}/" >/dev/null
          echo "PAGES_DOMAIN_ACTIVE=yes"
          echo "HTTPS_ROOT=reachable"
          echo "DNSSEC_NOT_CHANGED=yes"
          echo "OLD_DOMAIN_UNTOUCHED=getnovaforge.com"

      - name: Replace conflicting IONOS apex web records with Pages CNAME
        if: ${{ steps.request.outputs.mode == 'repair-apex-pages' }}
        shell: bash
        env:
          ACCOUNT_ID: ${{ steps.preflight.outputs.account_id }}
          ZONE_ID: ${{ steps.preflight.outputs.zone_id }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          domain_api="${api}/accounts/${ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}/domains/${CLOUDFLARE_ZONE_NAME}"
          records_api="${api}/zones/${ZONE_ID}/dns_records"

          curl -fsSIL --max-time 30 "https://${CLOUDFLARE_PAGES_HOST}/" >/dev/null
          echo "PAGES_HOST_REACHABLE=yes"

          domain_json="$(curl -fsS "${auth[@]}" "$domain_api")"
          test "$(jq -r '.success' <<<"$domain_json")" = "true"
          domain_status="$(jq -r '.result.status' <<<"$domain_json")"
          verify_error="$(jq -r '.result.verification_data.error_message // ""' <<<"$domain_json")"
          if [ "$domain_status" = "active" ]; then
            echo "PAGES_DOMAIN_ALREADY_ACTIVE=yes"
            exit 0
          fi
          test "$domain_status" = "pending" -o "$domain_status" = "initializing"
          if [ -n "$verify_error" ] && [ "$verify_error" != "CNAME record not set" ]; then
            echo "Unexpected Pages verification error: $verify_error"
            exit 1
          fi

          records_json="$(curl -fsS "${auth[@]}" "${records_api}?name=${CLOUDFLARE_ZONE_NAME}&per_page=100")"
          test "$(jq -r '.success' <<<"$records_json")" = "true"

          cname_count="$(jq '[.result[] | select(.type == "CNAME")] | length' <<<"$records_json")"
          a_count="$(jq '[.result[] | select(.type == "A")] | length' <<<"$records_json")"
          aaaa_count="$(jq '[.result[] | select(.type == "AAAA")] | length' <<<"$records_json")"
          test "$cname_count" -eq 0
          test "$a_count" -eq 1
          test "$aaaa_count" -eq 1
          test "$(jq -r '.result[] | select(.type == "A") | .content' <<<"$records_json")" = "217.160.0.52"
          test "$(jq -r '.result[] | select(.type == "AAAA") | .content' <<<"$records_json")" = "2001:8d8:100f:f000::200"

          a_id="$(jq -r '.result[] | select(.type == "A") | .id' <<<"$records_json")"
          aaaa_id="$(jq -r '.result[] | select(.type == "AAAA") | .id' <<<"$records_json")"

          delete_a="$(curl -fsS -X DELETE "${auth[@]}" "${records_api}/${a_id}")"
          test "$(jq -r '.success' <<<"$delete_a")" = "true"
          delete_aaaa="$(curl -fsS -X DELETE "${auth[@]}" "${records_api}/${aaaa_id}")"
          test "$(jq -r '.success' <<<"$delete_aaaa")" = "true"

          cname_json="$(curl -fsS -X POST "${auth[@]}" "$records_api" --data "{\"type\":\"CNAME\",\"name\":\"${CLOUDFLARE_ZONE_NAME}\",\"content\":\"${CLOUDFLARE_PAGES_HOST}\",\"proxied\":true,\"ttl\":1}")"
          test "$(jq -r '.success' <<<"$cname_json")" = "true"
          test "$(jq -r '.result.type' <<<"$cname_json")" = "CNAME"
          test "$(jq -r '.result.content' <<<"$cname_json")" = "$CLOUDFLARE_PAGES_HOST"
          echo "APEX_PAGES_CNAME_CREATED=yes"
          echo "MAIL_MX_TXT_UNTOUCHED=yes"

          status=""
          for attempt in $(seq 1 30); do
            one_json="$(curl -fsS "${auth[@]}" "$domain_api")"
            test "$(jq -r '.success' <<<"$one_json")" = "true"
            status="$(jq -r '.result.status // "unknown"' <<<"$one_json")"
            validation="$(jq -r '.result.validation_data.status // "unknown"' <<<"$one_json")"
            verification="$(jq -r '.result.verification_data.status // "unknown"' <<<"$one_json")"
            echo "attempt=${attempt} domain_status=${status} validation=${validation} verification=${verification}"
            if [ "$status" = "active" ]; then
              break
            fi
            if [ "$status" = "error" ] || [ "$status" = "blocked" ]; then
              jq '.result | {name,status,validation_data,verification_data}' <<<"$one_json"
              exit 1
            fi
            sleep 20
          done

          if [ "$status" != "active" ]; then
            echo "Pages custom domain still pending after targeted DNS repair. DNSSEC remains untouched."
            exit 1
          fi

          curl -fsSIL --max-time 30 "https://${CLOUDFLARE_ZONE_NAME}/" >/dev/null
          echo "PAGES_DOMAIN_ACTIVE=yes"
          echo "HTTPS_ROOT=reachable"
          echo "DNSSEC_NOT_CHANGED=yes"
          echo "OLD_DOMAIN_UNTOUCHED=getnovaforge.com"

      - name: Enable Cloudflare DNSSEC only after Pages and HTTPS are green
        if: ${{ steps.request.outputs.mode == 'enable-dnssec' }}
        shell: bash
        env:
          ACCOUNT_ID: ${{ steps.preflight.outputs.account_id }}
          ZONE_ID: ${{ steps.preflight.outputs.zone_id }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          domain_api="${api}/accounts/${ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PROJECT_NAME}/domains/${CLOUDFLARE_ZONE_NAME}"

          one_json="$(curl -fsS "${auth[@]}" "$domain_api")"
          test "$(jq -r '.success' <<<"$one_json")" = "true"
          test "$(jq -r '.result.status' <<<"$one_json")" = "active"
          curl -fsSIL --max-time 30 "https://${CLOUDFLARE_ZONE_NAME}/" >/dev/null

          dnssec_json="$(curl -fsS "${auth[@]}" "${api}/zones/${ZONE_ID}/dnssec")"
          test "$(jq -r '.success' <<<"$dnssec_json")" = "true"
          status="$(jq -r '.result.status // "unknown"' <<<"$dnssec_json")"
          if [ "$status" = "disabled" ] || [ "$status" = "pending-disabled" ]; then
            dnssec_json="$(curl -fsS -X PATCH "${auth[@]}" "${api}/zones/${ZONE_ID}/dnssec" --data '{"status":"active"}')"
            test "$(jq -r '.success' <<<"$dnssec_json")" = "true"
          fi

          echo "CLOUDFLARE_DNSSEC_RESULT"
          jq '.result | {status,ds,digest,digest_algorithm,algorithm,key_tag,public_key}' <<<"$dnssec_json"
          echo "REGISTRAR_DS_STILL_REQUIRES_CONFIRMATION=yes"
          echo "OLD_DOMAIN_UNTOUCHED=getnovaforge.com"
