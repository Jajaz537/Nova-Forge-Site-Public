name: MODARYX V2 Provider Registry Candidate Proof

on:
  push:
    branches:
      - 'chatgpt/modaryx-v2-provider-registry-20261006'
    paths:
      - '.github/workflows/modaryx-v2-provider-registry-proof.yml'
      - 'functions/_lib/provider-registry.mjs'
      - 'functions/api/v1/providers/status.js'
      - 'v2/src/App.jsx'
      - 'v2/src/api/modaryx-api.js'
      - 'qa/modaryx-v2-provider-registry-contract.json'
      - 'qa/check-v2-provider-registry.mjs'
      - 'qa/modaryx-v2-preproduction-contract-registry.json'
  pull_request:
    branches:
      - 'design/modaryx-v2-blue-violet-product-20261005'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modaryx-v2-provider-registry-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Prove provider registry without activation or secret leakage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate provider registry
        run: |
          set -euo pipefail
          node qa/check-v2-provider-registry.mjs
          node qa/check-v2-preproduction-contract-registry.mjs
      - name: Build root and V2
        run: |
          set -euo pipefail
          npm run build
          cd v2
          npm ci
          npm run build
      - name: Marker
        run: echo PASS_V2_PROVIDER_REGISTRY_PROOF
