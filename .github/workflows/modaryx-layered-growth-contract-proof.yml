name: MODARYX Layered Growth Contract Proof

on:
  pull_request:
    branches:
      - design/modaryx-premium-hd-20260914-work
    paths:
      - '.github/workflows/modaryx-layered-growth-contract-proof.yml'
      - 'qa/check-layered-growth-contract.mjs'
      - 'assets/living-world.js'
      - 'assets/living-world.css'
      - 'data/living-world.json'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layered-growth:
    name: Layered growth contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Check layered growth contract
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-layered-growth-contract.mjs
