name: MODARYX V2 CWV P75 Report Candidate Proof

on:
  push:
    branches:
      - 'chatgpt/modaryx-v2-cwv-p75-report-20261006'
    paths:
      - '.github/workflows/modaryx-v2-cwv-p75-report-proof.yml'
      - 'functions/_lib/cwv-rum-report.mjs'
      - 'functions/api/v1/rum/cwv/report.js'
      - 'qa/modaryx-v2-cwv-p75-report-contract.json'
      - 'qa/check-v2-cwv-p75-report.mjs'
      - 'qa/modaryx-v2-preproduction-contract-registry.json'
  pull_request:
    branches:
      - 'design/modaryx-v2-blue-violet-product-20261005'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modaryx-v2-cwv-p75-report-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Prove read-only p75 aggregation without production claim
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate p75 report candidate
        run: |
          set -euo pipefail
          node qa/check-v2-cwv-p75-report.mjs
          node qa/check-v2-preproduction-contract-registry.mjs
          echo PASS_V2_CWV_P75_REPORT_PROOF
      - name: Mirror Cloudflare root build
        run: npm run build
