name: Bootstrap verified Nova Forge public artifact

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-verified-public.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout empty public mirror
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Download, verify and publish exact artifact
        shell: bash
        env:
          ARTIFACT_URL: 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-4e20-820a-9840-f4fe8dc0fbed/raw?se=2026-09-01T20%3A59%3A18Z&sp=r&sv=2026-02-06&sr=b&scid=f6c5be08-50b8-5cf9-9678-f3d344ce60f6&skoid=1d6acb5b-b3f4-43ec-a5ec-b05c4a7708c8&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-01T10%3A30%3A17Z&ske=2026-09-02T10%3A30%3A17Z&sks=b&skv=2026-02-06&sig=URQqQJ35c0oaWjQIPadFCTdBgSqC4jK4/jK8Mu5blf8%3D'
          EXPECTED_ZIP_SHA256: '1bdbe354e2a2863c4e8dda187a7511f5d11b5797d867533e5dd41128d98e5af5'
          EXPECTED_TAR_SHA256: '59d27a5768dfa694631bbb320c385ff8bb3fe33e13c952280fd19cf42365863a'
          EXPECTED_SURFACE_DIGEST: 'be1f1b0e38adc754dfc6405db9c4957f7ea44cae60ef42c70dd1ce7e6004151e'
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          curl --fail --location --retry 3 --retry-delay 1 "$ARTIFACT_URL" -o "$tmp/artifact.zip"
          echo "$EXPECTED_ZIP_SHA256  $tmp/artifact.zip" | sha256sum -c -

          mkdir "$tmp/outer"
          unzip -q "$tmp/artifact.zip" -d "$tmp/outer"
          echo "$EXPECTED_TAR_SHA256  $tmp/outer/nova-forge-site-public.tar.gz" | sha256sum -c -

          mkdir "$tmp/stage"
          tar -xzf "$tmp/outer/nova-forge-site-public.tar.gz" -C "$tmp/stage"
          root="$tmp/stage/nova-forge-site"
          test -d "$root"

          (cd "$root" && sha256sum -c SHA256SUMS.txt)

          python3 - "$root" "$EXPECTED_SURFACE_DIGEST" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          expected_surface = sys.argv[2]
          build = json.loads((root / 'public-build.json').read_text(encoding='utf-8'))
          status = json.loads((root / 'public-status.json').read_text(encoding='utf-8'))
          actual_surface = hashlib.sha256((root / 'SHA256SUMS.txt').read_bytes()).hexdigest()
          assert actual_surface == expected_surface
          assert build.get('surface_digest_sha256') == expected_surface
          assert build.get('source_revision') == 'withheld-private-source'
          assert status.get('hosting', {}).get('mandatory_monthly_budget_eur') == 0
          assert status.get('hosting', {}).get('paid_plan_allowed') is False
          assert status.get('hosting', {}).get('private_source_repository_must_remain_private') is True
          forbidden = ('Nova-Forge-OS-Private','NovaForgeOS.Founder','FOUNDER_PRIVATE','FounderSecret','founder-only','Fondateur','NovaForgeOS.Site/tools','.github/')
          readable = {'.html','.js','.css','.json','.txt','.svg','.webmanifest'}
          for path in root.rglob('*'):
              if not path.is_file() or path.name in {'SHA256SUMS.txt','public-build.json'}:
                  continue
              if path.suffix.lower() not in readable and path.name != 'site.webmanifest':
                  continue
              text = path.read_text(encoding='utf-8', errors='strict').lower()
              for marker in forbidden:
                  assert marker.lower() not in text, f'forbidden marker in {path}'
          print('PASS_BOOTSTRAP_ARTIFACT_CONTRACT')
          PY

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$root"/. .

          sha256sum -c SHA256SUMS.txt
          test ! -e .github
          test ! -e NovaForgeOS.Site

          git config user.name 'Nova Forge Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Publish verified Nova Forge public artifact'
          git push origin HEAD:main
