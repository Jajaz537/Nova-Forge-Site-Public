name: MODARYX V2 Production Surface Map Proof

on:
  push:
    branches:
      - 'audit/modaryx-v2-legacy-boundary-20261003'
    paths:
      - '.github/workflows/modaryx-v2-production-surface-map-proof.yml'
      - 'qa/modaryx-v2-production-surface-map.json'
      - 'qa/check-v2-production-surface-map.mjs'
      - 'docs/MODARYX-V2-LIVING-THRESHOLD-PRODUCTION-MAPPING-20261004.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  surface-map:
    name: Validate production surface coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate surface map
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-v2-production-surface-map.mjs
