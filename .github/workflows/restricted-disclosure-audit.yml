name: Restricted Disclosure Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Scan public repository for restricted disclosure markers
        shell: bash
        run: |
          set -euo pipefail
          p1="$(printf '%s' 'Rm91bmRlcg==' | base64 -d)"
          p2="$(printf '%s' 'Rm9uZGF0ZXVy' | base64 -d)"
          mapfile -t hits < <(grep -RIlE "${p1}|${p2}" . --exclude-dir=.git --exclude-dir=.github || true)
          if (( ${#hits[@]} > 0 )); then
            printf 'RESTRICTED_DISCLOSURE_HITS_BEGIN\n'
            printf '%s\n' "${hits[@]}"
            printf 'RESTRICTED_DISCLOSURE_HITS_END\n'
            exit 1
          fi
          echo 'RESTRICTED_DISCLOSURE_AUDIT_PASS hits=0'
