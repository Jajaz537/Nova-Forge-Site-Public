name: MODARYX V2 Notifications Preferences Contract Proof

on:
  push:
    branches:
      - 'audit/modaryx-v2-legacy-boundary-20261003'
    paths:
      - '.github/workflows/modaryx-v2-notifications-preferences-contract-proof.yml'
      - 'qa/modaryx-v2-notifications-preferences-contract.json'
      - 'qa/check-v2-notifications-preferences-contract.mjs'
      - 'docs/MODARYX-V2-NOTIFICATIONS-PREFERENCES-CONTRACT-20261003.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Validate notifications and preferences invariants
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate notifications preferences contract
        shell: bash
        run: |
          set -euo pipefail
          node qa/check-v2-notifications-preferences-contract.mjs
