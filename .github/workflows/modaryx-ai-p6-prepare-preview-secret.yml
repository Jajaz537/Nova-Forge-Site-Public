name: MODARYX IA P6 prepare encrypted preview secret

on:
  push:
    branches:
      - "chatgpt/modaryx-ai-founder-integration-20261005"
    paths:
      - ".github/workflows/modaryx-ai-p6-prepare-preview-secret.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZONE_NAME: modaryxmods.com
      PROJECT_NAME: nova-forge-site-public
      SD_PUBLIC_KEY_FINGERPRINT: 82375c4a6ce12165dd7c2319848e8bffc2cc53caf983b09d0af9c6df8947f20f
    steps:
      - name: Checkout exact site branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Generate preview HMAC and encrypt for SD only
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p evidence
          pub=".github/modaryx-p6-sd-public.pem"
          test -f "$pub"

          openssl pkey -pubin -in "$pub" -outform DER -out evidence/public.der
          fp="$(sha256sum evidence/public.der | awk '{print $1}')"
          rm -f evidence/public.der
          test "$fp" = "$SD_PUBLIC_KEY_FINGERPRINT"

          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")
          zones="$(curl -fsS "${auth[@]}" --get --data-urlencode "name=$ZONE_NAME" "$api/zones")"
          account_id="$(jq -r '.result[0].account.id' <<<"$zones")"
          test -n "$account_id"

          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          openssl rand 32 > "$key_file"
          key_hex="$(xxd -p -c 256 "$key_file")"
          test "$(printf '%s' "$key_hex" | wc -c)" -eq 64

          payload="$(jq -n \
            --arg bridge_key "$key_hex" \
            '{
              deployment_configs:{
                preview:{
                  env_vars:{
                    MODARYX_AI_BRIDGE_KEY_HEX:{type:"secret_text",value:$bridge_key},
                    MODARYX_P6_EVIDENCE_MODE:{type:"plain_text",value:"enabled"}
                  }
                }
              }
            }')"

          response="$(curl -fsS "${auth[@]}" \
            --request PATCH \
            --data "$payload" \
            "$api/accounts/$account_id/pages/projects/$PROJECT_NAME")"
          test "$(jq -r '.success' <<<"$response")" = "true"

          project="$(curl -fsS "${auth[@]}" "$api/accounts/$account_id/pages/projects/$PROJECT_NAME")"
          test "$(jq -r '.success' <<<"$project")" = "true"
          test "$(jq -r '(.result.deployment_configs.preview.env_vars // {}) | has("MODARYX_AI_BRIDGE_KEY_HEX")' <<<"$project")" = "true"
          test "$(jq -r '(.result.deployment_configs.preview.env_vars // {}) | has("MODARYX_P6_EVIDENCE_MODE")' <<<"$project")" = "true"

          encrypted="evidence/bridge-key.rsa.bin"
          openssl pkeyutl -encrypt \
            -pubin \
            -inkey "$pub" \
            -in "$key_file" \
            -out "$encrypted" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -pkeyopt rsa_mgf1_md:sha256

          base64 -w 0 "$encrypted" > evidence/bridge-key.rsa.b64
          rm -f "$encrypted" "$key_file"
          trap - EXIT
          unset key_hex payload response

          cipher_sha="$(base64 -d evidence/bridge-key.rsa.b64 | sha256sum | awk '{print $1}')"
          jq -n \
            --arg schema "modaryx-p6-preview-secret-preparation-v1" \
            --arg public_key_fingerprint "$SD_PUBLIC_KEY_FINGERPRINT" \
            --arg ciphertext_sha256 "$cipher_sha" \
            '{
              schema:$schema,
              status:"PASS",
              pages_scope:"preview",
              bridge_key_set:true,
              evidence_mode_enabled:true,
              bridge_url_set:false,
              sd_public_key_fingerprint:$public_key_fingerprint,
              encrypted_key_ciphertext_sha256:$ciphertext_sha256,
              encryption:"RSA-4096-OAEP-SHA256",
              plaintext_secret_artifacts:false,
              secret_values_logged:false,
              production_modified:false,
              awards_vf_points:false
            }' > evidence/preparation.json

          echo "MODARYX_P6_PREVIEW_SECRET_PASS scope=preview encryptedForSD=true productionModified=false"

      - name: Upload encrypted preview secret
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: modaryx-ai-p6-preview-secret
          path: evidence
          if-no-files-found: error
          retention-days: 7
