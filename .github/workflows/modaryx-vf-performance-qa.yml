name: MODARYX VF performance QA

on:
  push:
    branches:
      - site/modaryx-vf-premium-hd-v2
    paths:
      - '.github/modaryx-vf-performance-qa-trigger.json'

permissions:
  contents: read

jobs:
  performance-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZONE_NAME: modaryxmods.com
      PROJECT_NAME: nova-forge-site-public
      TARGET_BRANCH: site/modaryx-vf-premium-hd-v2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site/modaryx-vf-premium-hd-v2
          fetch-depth: 1

      - name: Verify critical local byte budgets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          files = {
              'index.html': 30_000,
              'assets/modaryx-rar-hero.webp': 100_000,
              'assets/tokens.css': 10_000,
              'assets/nova-premium-hd.css': 40_000,
              'assets/modaryx-vf.css': 40_000,
              'assets/shell.js': 10_000,
              'assets/app.js': 25_000,
              'assets/nova-premium-hd.js': 10_000,
          }
          total = 0
          for raw, limit in files.items():
              path = Path(raw)
              if not path.is_file():
                  raise SystemExit(f'missing critical file: {raw}')
              size = path.stat().st_size
              total += size
              print(f'BUDGET {raw} bytes={size} limit={limit}')
              if size > limit:
                  raise SystemExit(f'critical byte budget exceeded: {raw} {size}>{limit}')
          if total > 220_000:
              raise SystemExit(f'critical first-party byte budget exceeded: {total}>220000')
          print(f'CRITICAL_FIRST_PARTY_BYTES={total}')
          print('CRITICAL_LOCAL_BYTE_BUDGETS=PASS')
          PY

      - name: Resolve successful Cloudflare preview
        id: preview
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          zones="$(curl -fsS "${auth[@]}" "$api/zones?name=$ZONE_NAME")"
          account_id="$(jq -r '.result[0].account.id' <<<"$zones")"
          test -n "$account_id" && test "$account_id" != "null"

          preview_url=""
          for attempt in $(seq 1 36); do
            deployments="$(curl -fsS "${auth[@]}" "$api/accounts/$account_id/pages/projects/$PROJECT_NAME/deployments")"
            candidate="$(DEPLOYMENTS="$deployments" python3 - <<'PY'
          import json, os
          data=json.loads(os.environ['DEPLOYMENTS'])
          target=os.environ['TARGET_BRANCH']
          rows=[]
          for dep in data.get('result',[]):
              meta=((dep.get('deployment_trigger') or {}).get('metadata') or {})
              if meta.get('branch') == target and dep.get('environment') == 'preview':
                  rows.append(dep)
          rows.sort(key=lambda d:d.get('created_on',''), reverse=True)
          if rows:
              d=rows[0]
              print((d.get('latest_stage') or {}).get('status','unknown') + '|' + d.get('url',''))
          PY
            )"
            status="${candidate%%|*}"
            url="${candidate#*|}"
            echo "preview_wait attempt=$attempt status=${status:-none}"
            if [ "$status" = "success" ] && [ -n "$url" ]; then
              preview_url="$url"
              break
            fi
            sleep 5
          done
          test -n "$preview_url"
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "PREVIEW_URL=$preview_url"

      - name: Probe preview transport and critical resources
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail
          mkdir -p perf-proof
          paths=(
            '/'
            '/assets/modaryx-rar-hero.webp'
            '/assets/tokens.css'
            '/assets/nova-premium-hd.css'
            '/assets/modaryx-vf.css?v=20260911-2'
            '/assets/shell.js'
            '/assets/app.js'
            '/assets/nova-premium-hd.js'
          )
          : > perf-proof/curl-metrics.tsv
          for path in "${paths[@]}"; do
            metrics="$(curl --http2 --compressed -fsSL -o /dev/null \
              -w '%{http_code}\t%{http_version}\t%{size_download}\t%{time_starttransfer}\t%{time_total}' \
              "${PREVIEW_URL}${path}")"
            printf '%s\t%s\n' "$path" "$metrics" | tee -a perf-proof/curl-metrics.tsv
          done

          python3 - <<'PY'
          from pathlib import Path
          rows=[]
          for line in Path('perf-proof/curl-metrics.tsv').read_text().splitlines():
              path, code, version, size, ttfb, total = line.split('\t')
              rows.append((path, int(code), version, int(size), float(ttfb), float(total)))
          bad=[r for r in rows if r[1] != 200]
          if bad:
              raise SystemExit(f'critical resource HTTP failure: {bad}')
          if rows[0][2] not in ('2', '2.0', '3'):
              raise SystemExit(f'homepage transport below HTTP/2: {rows[0][2]}')
          if rows[0][5] > 6.0:
              raise SystemExit(f'homepage curl total sanity threshold exceeded: {rows[0][5]:.3f}s')
          if rows[1][3] > 100_000:
              raise SystemExit(f'hero transfer budget exceeded: {rows[1][3]} bytes')
          print('CRITICAL_PREVIEW_HTTP=PASS')
          print(f'HOME_HTTP_VERSION={rows[0][2]}')
          print(f'HOME_TTFB_SECONDS={rows[0][4]:.3f}')
          print(f'HOME_CURL_TOTAL_SECONDS={rows[0][5]:.3f}')
          print(f'HERO_TRANSFER_BYTES={rows[1][3]}')
          PY

      - name: Run three cold Chrome render sanity samples
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo 'No Chromium/Chrome executable on hosted runner'
            exit 1
          fi
          "$chrome" --version
          mkdir -p perf-proof/chrome
          : > perf-proof/chrome-render-ms.txt

          for sample in 1 2 3; do
            profile="/tmp/modaryx-perf-${sample}"
            rm -rf "$profile"
            start_ms="$(date +%s%3N)"
            "$chrome" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --hide-scrollbars \
              --window-size=1440,900 \
              --user-data-dir="$profile" \
              --dump-dom "$PREVIEW_URL/" \
              > "perf-proof/chrome/home-${sample}.html" \
              2> "perf-proof/chrome/home-${sample}.log"
            end_ms="$(date +%s%3N)"
            elapsed=$((end_ms-start_ms))
            echo "$elapsed" | tee -a perf-proof/chrome-render-ms.txt
            grep -Fq 'MODARYX MODS' "perf-proof/chrome/home-${sample}.html"
            grep -Fq 'Loup et Dragon devant le royaume MODARYX' "perf-proof/chrome/home-${sample}.html"
            grep -Fq 'UN ÉCOSYSTÈME POUR TOUS LES MONDES' "perf-proof/chrome/home-${sample}.html"
            rm -rf "$profile"
          done

          python3 - <<'PY'
          from pathlib import Path
          import statistics
          values=[int(x) for x in Path('perf-proof/chrome-render-ms.txt').read_text().split()]
          if len(values) != 3:
              raise SystemExit(f'expected 3 Chrome samples, got {values}')
          median=int(statistics.median(values))
          maximum=max(values)
          print(f'CHROME_COLD_RENDER_MS={values}')
          print(f'CHROME_COLD_RENDER_MEDIAN_MS={median}')
          print(f'CHROME_COLD_RENDER_MAX_MS={maximum}')
          if median > 10_000:
              raise SystemExit(f'Chrome median render sanity threshold exceeded: {median}ms')
          if maximum > 20_000:
              raise SystemExit(f'Chrome max render sanity threshold exceeded: {maximum}ms')
          for p in Path('perf-proof/chrome').glob('home-*.html'):
              if p.stat().st_size < 10_000:
                  raise SystemExit(f'Chrome DOM unexpectedly small: {p} {p.stat().st_size} bytes')
          print('COLD_CHROME_RENDER_SANITY=PASS')
          print('RAR_HERO_RENDER_MARKERS=PASS')
          PY

      - name: Publish performance summary
        if: always()
        shell: bash
        run: |
          {
            echo '## MODARYX VF targeted performance QA'
            echo
            echo '- Critical local byte budgets: checked above.'
            if [ -f perf-proof/curl-metrics.tsv ]; then
              echo '- Cloudflare preview HTTP metrics:'
              echo '```text'
              cat perf-proof/curl-metrics.tsv
              echo '```'
            fi
            if [ -f perf-proof/chrome-render-ms.txt ]; then
              echo '- Cold Chrome render samples (ms): `'
              tr '\n' ' ' < perf-proof/chrome-render-ms.txt
              echo '`'
            fi
            echo '- Production cutover: untouched.'
            echo '- DNSSEC: untouched.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload performance proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modaryx-vf-performance-qa
          path: perf-proof/
          if-no-files-found: warn
          retention-days: 7