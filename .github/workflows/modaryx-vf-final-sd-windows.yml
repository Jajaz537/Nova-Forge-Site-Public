name: MODARYX VF Final SD Windows Gate

on:
  push:
    branches:
      - runner/modaryx-vf-final-sd-20261001

permissions:
  contents: read

jobs:
  final-sd-windows:
    name: Final SD Windows replay
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    env:
      CANDIDATE_SHA: 536a901615f4f4dbe26863814375fbe77bb268dd
    steps:
      - name: Checkout exact frozen candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Provision isolated Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Verify exact candidate SHA
        shell: powershell
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:CANDIDATE_SHA) { throw "Wrong candidate: $actual" }
          Write-Host "Exact candidate verified: $actual"

      - name: Runtime inventory
        shell: powershell
        run: |
          node --version
          npm --version
          python --version
          git --version

      - name: Install project dependencies
        shell: powershell
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install --ignore-scripts }

      - name: Build and source validation
        shell: powershell
        run: |
          npm run build

      - name: Targeted Finish Line source proof
        shell: powershell
        run: node qa/check-site-first-vf.mjs

      - name: Import race proof
        shell: powershell
        run: node qa/check-import-races.cjs

      - name: Profile detection proof
        shell: powershell
        run: node qa/check-profile-detection.cjs

      - name: Public metadata proof
        shell: powershell
        run: node qa/check-public-metadata.cjs

      - name: Living chronicle proof
        shell: powershell
        run: node qa/check-living-chronicle.mjs

      - name: Living world offline state proof
        shell: powershell
        run: node qa/check-living-world-offline-state.mjs

      - name: Layered growth contract and asset gate
        shell: powershell
        run: |
          node qa/check-layered-growth-contract.mjs
          node qa/check-layered-growth-assets.mjs

      - name: Prepare Windows browser proof environment
        shell: powershell
        run: |
          $candidates = @(
            "$env:ProgramFiles(x86)\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles(x86)\Google\Chrome\Application\chrome.exe",
            "E:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe",
            "E:\Program Files\Microsoft\Edge\Application\msedge.exe",
            "E:\Program Files\Google\Chrome\Application\chrome.exe",
            "E:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
          )
          $browser = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $browser) {
            $browser = (Get-Process msedge -ErrorAction SilentlyContinue | Where-Object { $_.Path -and (Test-Path $_.Path) } | Select-Object -First 1 -ExpandProperty Path)
          }
          if (-not $browser) {
            $cmd = Get-Command msedge,chrome -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($cmd) { $browser = $cmd.Source }
          }
          if (-not $browser) { throw 'No supported Chromium browser found on SD-MODARYX' }
          "CHROME_BIN=$browser" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MODARYX_TEST_ORIGIN=http://127.0.0.1:4175" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:PORT='4175'
          $preview = Start-Process -FilePath node -ArgumentList 'preview.mjs' -PassThru -WindowStyle Hidden
          "MODARYX_PREVIEW_PID=$($preview.Id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $deadline=(Get-Date).AddSeconds(20)
          do {
            try { $ok=(Invoke-WebRequest -UseBasicParsing http://127.0.0.1:4175/index.html -TimeoutSec 2).StatusCode -eq 200 } catch { $ok=$false }
            if(-not $ok){ Start-Sleep -Milliseconds 300 }
          } until($ok -or (Get-Date) -gt $deadline)
          if(-not $ok){ throw 'MODARYX preview did not become ready on port 4175' }
          Write-Host "Browser: $browser"
          Write-Host "Preview ready: http://127.0.0.1:4175"

      - name: Browser accessibility proof
        shell: powershell
        run: node qa/check-browser-a11y.mjs

      - name: Browser reflow proof
        shell: powershell
        run: node qa/check-browser-reflow.mjs

      - name: Local functional browser proof
        shell: powershell
        run: node qa/check-local-functional-browser.mjs

      - name: PWA installability proof
        shell: powershell
        run: node qa/check-pwa-installability.mjs

      - name: Real-world sync browser supplemental proof
        continue-on-error: true
        timeout-minutes: 3
        shell: powershell
        run: node qa/check-real-world-sync-browser.mjs

      - name: Lab performance proof
        timeout-minutes: 3
        shell: powershell
        run: node qa/check-lab-performance.mjs
