name: MODARYX VF Final SD Windows Gate

on:
  push:
    branches:
      - runner/modaryx-vf-final-sd-20261001

concurrency:
  group: modaryx-vf-final-sd-windows-v3
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  final-sd-windows:
    name: Final SD Windows replay
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    env:
      CANDIDATE_SHA: fix/modaryx-vf-a11y-navigation-20261001
    steps:
      - name: Checkout exact frozen candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1

      - name: Provision isolated Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Verify exact candidate SHA
        shell: powershell
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($env:CANDIDATE_SHA -match '^[0-9a-f]{40}
          Write-Host "Exact candidate verified: $actual"

      - name: Runtime inventory
        shell: powershell
        run: |
          node --version
          npm --version
          python --version
          git --version

      - name: Install project dependencies
        shell: powershell
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install --ignore-scripts }

      - name: Build and source validation
        shell: powershell
        run: npm run build

      - name: Prepare Windows browser proof environment
        shell: powershell
        run: |
          $browser = (Get-Process msedge -ErrorAction SilentlyContinue | Where-Object { $_.Path -and (Test-Path $_.Path) } | Select-Object -First 1 -ExpandProperty Path)
          if (-not $browser) {
            $cmd = Get-Command msedge,chrome -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($cmd) { $browser = $cmd.Source }
          }
          if (-not $browser) { throw 'No supported Chromium browser found on SD-MODARYX' }
          "CHROME_BIN=$browser" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MODARYX_TEST_ORIGIN=http://127.0.0.1:4175" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:PORT='4175'
          Start-Process -FilePath node -ArgumentList 'preview.mjs' -WindowStyle Hidden
          Start-Sleep -Seconds 2

      - name: Local functional targeted proof
        shell: powershell
        run: node qa/check-local-functional-browser.mjs
 -and $actual -ne $env:CANDIDATE_SHA) { throw "Wrong candidate: $actual" }
          Write-Host "Exact candidate verified: $actual"

      - name: Runtime inventory
        shell: powershell
        run: |
          node --version
          npm --version
          python --version
          git --version

      - name: Install project dependencies
        shell: powershell
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install --ignore-scripts }

      - name: Build and source validation
        shell: powershell
        run: npm run build

      - name: Prepare Windows browser proof environment
        shell: powershell
        run: |
          $browser = (Get-Process msedge -ErrorAction SilentlyContinue | Where-Object { $_.Path -and (Test-Path $_.Path) } | Select-Object -First 1 -ExpandProperty Path)
          if (-not $browser) {
            $cmd = Get-Command msedge,chrome -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($cmd) { $browser = $cmd.Source }
          }
          if (-not $browser) { throw 'No supported Chromium browser found on SD-MODARYX' }
          "CHROME_BIN=$browser" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MODARYX_TEST_ORIGIN=http://127.0.0.1:4175" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:PORT='4175'
          Start-Process -FilePath node -ArgumentList 'preview.mjs' -WindowStyle Hidden
          Start-Sleep -Seconds 2

      - name: Local functional targeted proof
        shell: powershell
        run: node qa/check-local-functional-browser.mjs
