name: Nova Site Super Nova Lot 7E Canonical Reconciliation Proof

on:
  push:
    branches:
      - supernova/accelerated-all-ideas-20260913
    paths:
      - 'assets/site-fabric.mjs'
      - 'governance/SUPER-NOVA-SITE-LOT7E.json'
      - 'public-status.json'
      - 'eng/site/Test-NovaSiteSuperNovaLot7E.mjs'
      - 'eng/site/Test-NovaSiteSuperNovaLot7E.ps1'
      - '.github/workflows/nova-site-supernova-lot7e-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-lot7e:
    name: Targeted Site Lot 7E Windows proof
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Prove 23 retained Site ideas are no longer architecture-only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "SOURCE_COMMIT=$env:GITHUB_SHA"
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./eng/site/Test-NovaSiteSuperNovaLot7E.ps1
