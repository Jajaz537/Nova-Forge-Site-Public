name: MODARYX IA P6 Founder entrypoint readiness

on:
  push:
    branches:
      - "chatgpt/modaryx-ai-founder-integration-20261005"
    paths:
      - ".github/workflows/modaryx-ai-p6-founder-entrypoint-readiness.yml"
  workflow_dispatch:
    inputs:
      site_origin:
        description: Immutable Cloudflare Pages preview origin
        required: true
        type: string
        default: "https://e1b00663.nova-forge-site-public.pages.dev"
      site_sha:
        description: Exact Git SHA deployed to that origin
        required: true
        type: string
        default: "39be013ebf418648cc5c6fa5332e3d532209ebfa"

permissions:
  contents: read
  checks: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SITE_ORIGIN: ${{ inputs.site_origin || 'https://e1b00663.nova-forge-site-public.pages.dev' }}
      EXPECTED_SITE_SHA: ${{ inputs.site_sha || '39be013ebf418648cc5c6fa5332e3d532209ebfa' }}
    steps:
      - name: Prepare non-sensitive readiness evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          jq -n '{schema:"modaryx-p6-founder-entrypoint-readiness-v1",overall_status:"NOT_RUN",founder_qualification:"NOT_RUN",awards_vf_points:false}' > evidence/readiness.json

      - name: Verify immutable preview origin against exact deployed Git SHA
        env:
          GH_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import json, os, re, urllib.request
          from html.parser import HTMLParser
          from pathlib import Path
          origin=os.environ['SITE_ORIGIN']
          sha=os.environ['EXPECTED_SITE_SHA']
          if not re.fullmatch(r'https://[0-9a-f]{8}\.nova-forge-site-public\.pages\.dev',origin):
              raise SystemExit('P6 invalid immutable preview origin')
          if not re.fullmatch(r'[0-9a-f]{40}',sha):
              raise SystemExit('P6 invalid deployed Git SHA')
          class Links(HTMLParser):
              def __init__(self):
                  super().__init__(); self.urls=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='a':
                      self.urls.extend(v for k,v in attrs if k=='href')
          api=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/commits/{sha}/check-runs?per_page=100"
          request=urllib.request.Request(api,headers={
              'Authorization':'Bearer '+os.environ['GH_READ_TOKEN'],
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
          })
          try:
              with urllib.request.urlopen(request,timeout=20) as response:
                  data=json.load(response)
          except Exception:
              raise SystemExit('P6 deployed SHA provenance unavailable')
          matches=[]
          for check in data.get('check_runs',[]):
              if check.get('head_sha')!=sha or check.get('name')!='Cloudflare Pages' or check.get('conclusion')!='success':
                  continue
              links=Links(); links.feed((check.get('output') or {}).get('summary') or '')
              if origin in links.urls:
                  matches.append({'check_id':check['id'],'check_url':check.get('html_url'),'deployment_id':check.get('external_id')})
          if not matches:
              raise SystemExit('P6 origin does not match successful exact-SHA Pages deployment')
          Path('evidence/deployment-provenance.json').write_text(json.dumps({
              'schema':'modaryx-p6-deployment-provenance-v1',
              'site_origin':origin,'site_sha':sha,'checks':matches,
              'status':'PASS','awards_vf_points':False,
          },indent=2),encoding='utf-8')
          print('MODARYX_P6_DEPLOYMENT_PROVENANCE_PASS')
          PY

      - name: Measure anonymous entrypoint readiness without Founder qualification
        shell: bash
        run: |
          set -euo pipefail
          login="${SITE_ORIGIN}/api/v1/auth/login?returnTo=%2Fapi%2Ffounder%2Fai%2Fe2e-proof"
          headers="$(mktemp)"
          body="$(mktemp)"
          evidence_body="$(mktemp)"
          denial_body="$(mktemp)"
          trap 'rm -f "$headers" "$body" "$evidence_body" "$denial_body"' EXIT

          code="$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' --max-time 15 "$login" || true)"
          location="$(awk 'BEGIN{IGNORECASE=1}/^location:/{sub(/^location:[[:space:]]*/,""); print; exit}' "$headers" | tr -d '\r')"
          auth_redirect=false
          if [ "$code" = "302" ] && printf '%s' "$location" | grep -Eq '^https://[^/]+/authorize[?]'; then auth_redirect=true; fi

          ev_code="$(curl -sS -o "$evidence_body" -w '%{http_code}' --max-time 15 "${SITE_ORIGIN}/api/p6/evidence" || true)"
          receipt_state=invalid
          if [ "$ev_code" = "200" ]; then
            receipt_state="$(jq -r 'if type=="object" then if .ready==false then "false" elif .ready==true then "true" else "invalid" end else "invalid" end' "$evidence_body" 2>/dev/null || echo invalid)"
          fi

          denial_code="$(curl -sS -o "$denial_body" -w '%{http_code}' --max-time 15 "${SITE_ORIGIN}/api/founder/ai/e2e-proof" || true)"
          measured_ok=false
          if [ "$auth_redirect" = "true" ] && [ "$ev_code" = "200" ] && [[ "$receipt_state" =~ ^(false|true)$ ]] && [ "$denial_code" = "404" ]; then measured_ok=true; fi
          jq -n \
            --arg origin "$SITE_ORIGIN" --arg sha "$EXPECTED_SITE_SHA" \
            --arg login_http "$code" --argjson auth_redirect "$auth_redirect" \
            --arg evidence_http "$ev_code" --arg receipt_state "$receipt_state" \
            --arg denial_http "$denial_code" --argjson measured_ok "$measured_ok" \
            '{
              schema:"modaryx-p6-founder-entrypoint-readiness-v1",
              deployment_url:$origin,deployed_sha:$sha,
              login_http:$login_http,auth0_redirect:$auth_redirect,
              evidence_http:$evidence_http,
              receipt_ready:(if $receipt_state=="false" then false elif $receipt_state=="true" then true else null end),
              guest_e2e_denial_http:$denial_http,
              measured_readiness_status:(if $measured_ok then "PASS" else "FAIL" end),
              overall_status:(if $measured_ok then "INCONCLUSIVE" else "FAIL" end),
              founder_qualification:"NOT_RUN",authenticated_non_founder:"NOT_RUN",
              identity_recorded:false,secret_values_recorded:false,receipt_body_recorded:false,
              signed_bridge_request_performed:false,awards_vf_points:false
            }' > evidence/readiness.json

          if [ "$measured_ok" != "true" ]; then
            echo "MODARYX_P6_ANONYMOUS_READINESS_FAIL founderQualification=NOT_RUN awards=false" >&2
            exit 4
          fi
          echo "MODARYX_P6_ANONYMOUS_READINESS_MEASURED founderQualification=NOT_RUN overall=INCONCLUSIVE awards=false"

      - name: Seal prepared readiness evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from datetime import datetime,timezone
          root=Path('evidence')
          files=[]
          for path in sorted(root.rglob('*')):
              if path.is_file() and path.name!='seal-manifest.json':
                  data=path.read_bytes()
                  files.append({'path':path.relative_to(root).as_posix(),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          (root/'seal-manifest.json').write_text(json.dumps({
              'schema':'modaryx-p6-readiness-seal-v1',
              'created_at':datetime.now(timezone.utc).isoformat(),
              'site_origin':os.environ['SITE_ORIGIN'],'deployed_sha':os.environ['EXPECTED_SITE_SHA'],
              'workflow_sha':os.environ['GITHUB_SHA'],'workflow_run_id':os.environ['GITHUB_RUN_ID'],
              'files':files,'awards_vf_points':False,
          },indent=2),encoding='utf-8')
          print('MODARYX_P6_READINESS_EVIDENCE_SEALED awards=false')
          PY

      - name: Upload Founder entrypoint readiness
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: modaryx-ai-p6-founder-entrypoint-readiness
          path: evidence
          if-no-files-found: error
          retention-days: 30


