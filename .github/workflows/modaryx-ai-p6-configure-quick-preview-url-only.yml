name: MODARYX IA P6 configure Quick Tunnel preview URL only

on:
  push:
    branches:
      - "chatgpt/modaryx-ai-founder-integration-20261005"
    paths:
      - ".github/workflows/modaryx-ai-p6-configure-quick-preview-url-only.yml"
      - "qa/p6-quick-url.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZONE_NAME: modaryxmods.com
      PROJECT_NAME: nova-forge-site-public
    steps:
      - name: Checkout exact preview branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Update only preview bridge URL and redeploy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence

          quick_url="$(tr -d '\r\n ' < qa/p6-quick-url.txt)"
          if ! [[ "$quick_url" =~ ^https://[a-zA-Z0-9-]+[.]trycloudflare[.]com$ ]]; then
            echo "Invalid Quick Tunnel URL" >&2
            exit 2
          fi

          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H "Content-Type: application/json")

          zones="$(curl -fsS "${auth[@]}" --get --data-urlencode "name=$ZONE_NAME" "$api/zones")"
          account_id="$(jq -r '.result[0].account.id' <<<"$zones")"
          test -n "$account_id"

          before="$(curl -fsS "${auth[@]}" "$api/accounts/$account_id/pages/projects/$PROJECT_NAME")"
          test "$(jq -r '.success' <<<"$before")" = "true"
          test "$(jq -r '(.result.deployment_configs.preview.env_vars // {}) | has("MODARYX_AI_BRIDGE_KEY_HEX")' <<<"$before")" = "true"

          payload="$(jq -n --arg bridge_url "$quick_url" '{
            deployment_configs:{
              preview:{
                env_vars:{
                  MODARYX_AI_BRIDGE_URL:{type:"plain_text",value:$bridge_url},
                  MODARYX_P6_EVIDENCE_MODE:{type:"plain_text",value:"enabled"}
                }
              }
            }
          }')"

          update="$(curl -fsS "${auth[@]}" --request PATCH --data "$payload" "$api/accounts/$account_id/pages/projects/$PROJECT_NAME")"
          test "$(jq -r '.success' <<<"$update")" = "true"

          after="$(curl -fsS "${auth[@]}" "$api/accounts/$account_id/pages/projects/$PROJECT_NAME")"
          test "$(jq -r '.success' <<<"$after")" = "true"
          test "$(jq -r '(.result.deployment_configs.preview.env_vars // {}) | has("MODARYX_AI_BRIDGE_KEY_HEX")' <<<"$after")" = "true"
          test "$(jq -r '(.result.deployment_configs.preview.env_vars // {}) | has("MODARYX_AI_BRIDGE_URL")' <<<"$after")" = "true"
          test "$(jq -r '(.result.deployment_configs.preview.env_vars // {}) | has("MODARYX_P6_EVIDENCE_MODE")' <<<"$after")" = "true"

          deployments="$(curl -fsS "${auth[@]}" --get --data-urlencode "env=preview" "$api/accounts/$account_id/pages/projects/$PROJECT_NAME/deployments")"
          source_deployment="$(jq -c --arg b "$GITHUB_REF_NAME" '[.result[] | select(((.deployment_trigger.metadata.branch // "") == $b) and ((.latest_stage.status // "") == "success"))] | sort_by(.created_on) | reverse | .[0] // null' <<<"$deployments")"
          test "$(jq -r '. != null' <<<"$source_deployment")" = "true"
          source_id="$(jq -r '.id' <<<"$source_deployment")"

          retried="$(curl -fsS "${auth[@]}" --request POST "$api/accounts/$account_id/pages/projects/$PROJECT_NAME/deployments/$source_id/retry")"
          test "$(jq -r '.success' <<<"$retried")" = "true"
          retry_id="$(jq -r '.result.id // ""' <<<"$retried")"
          test -n "$retry_id"

          retry_url=""
          retry_success=false
          retry_uses_functions=false
          for i in $(seq 1 90); do
            sleep 4
            dep="$(curl -fsS "${auth[@]}" "$api/accounts/$account_id/pages/projects/$PROJECT_NAME/deployments/$retry_id")"
            test "$(jq -r '.success' <<<"$dep")" = "true"
            retry_status="$(jq -r '.result.latest_stage.status // ""' <<<"$dep")"
            retry_url="$(jq -r '.result.url // ""' <<<"$dep")"
            retry_uses_functions="$(jq -r '.result.uses_functions // false' <<<"$dep")"
            if [ "$retry_status" = "success" ]; then retry_success=true; break; fi
            if [ "$retry_status" = "failure" ]; then break; fi
          done
          test "$retry_success" = "true"

          jq -n \
            --arg schema "modaryx-p6-quick-preview-url-only-v1" \
            --arg bridge_url "$quick_url" \
            --arg retry_deployment_id "$retry_id" \
            --arg retry_deployment_url "$retry_url" \
            --argjson retry_uses_functions "$retry_uses_functions" \
            '{
              schema:$schema,
              status:"PASS",
              bridge_url:$bridge_url,
              preview_bridge_url_set:true,
              preview_bridge_key_preserved:true,
              preview_evidence_mode_enabled:true,
              retry_deployment_id:$retry_deployment_id,
              retry_deployment_url:$retry_deployment_url,
              retry_deployment_success:true,
              retry_deployment_uses_functions:$retry_uses_functions,
              production_modified:false,
              secret_values_logged:false,
              awards_vf_points:false
            }' > evidence/config.json

          echo "MODARYX_P6_QUICK_URL_ONLY_PASS deployment=$retry_url keyPreserved=true"

      - name: Upload URL-only preview configuration
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: modaryx-ai-p6-quick-preview-url-only
          path: evidence
          if-no-files-found: error
          retention-days: 7
