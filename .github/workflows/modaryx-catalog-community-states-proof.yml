name: MODARYX Catalog Community States Proof

on:
  pull_request:
    branches:
      - design/modaryx-premium-hd-20260914-work
    paths:
      - '.github/workflows/modaryx-catalog-community-states-proof.yml'
      - 'qa/check-catalog-community-states.mjs'
      - 'catalog.html'
      - 'community.html'
      - 'assets/catalog.js'
      - 'assets/community.js'
      - 'data/catalog.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modaryx-catalog-community-states-${{ github.ref }}
  cancel-in-progress: true

jobs:
  states:
    name: Chromium catalog community states
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Locate Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --version
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Start local HTTP server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 >"$RUNNER_TEMP/modaryx-catalog-community-http.log" 2>&1 &
          SERVER_PID=$!
          echo "MODARYX_CATALOG_COMMUNITY_SERVER_PID=$SERVER_PID" >> "$GITHUB_ENV"
          for attempt in {1..40}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/catalog.html >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat "$RUNNER_TEMP/modaryx-catalog-community-http.log"
          exit 1

      - name: Run targeted browser state proof
        shell: bash
        env:
          MODARYX_TEST_ORIGIN: http://127.0.0.1:4173
        run: |
          set -euo pipefail
          node --version
          node qa/check-catalog-community-states.mjs

      - name: Stop local HTTP server
        if: always()
        shell: bash
        run: |
          if test -n "${MODARYX_CATALOG_COMMUNITY_SERVER_PID:-}"; then
            kill "$MODARYX_CATALOG_COMMUNITY_SERVER_PID" 2>/dev/null || true
          fi
