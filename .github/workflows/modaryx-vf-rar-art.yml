name: MODARYX VF rebuild RAR hero art

on:
  push:
    branches:
      - site/modaryx-vf-premium-hd-v2
    paths:
      - '.github/modaryx-vf-rar-art-trigger.json'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site/modaryx-vf-premium-hd-v2
          fetch-depth: 0
      - name: Rebuild exact RAR hero asset and wire homepage
        shell: bash
        run: |
          set -euo pipefail
          cat .github/rar-art/part-00.b64 .github/rar-art/part-01.b64 .github/rar-art/part-02.b64 .github/rar-art/part-03.b64 .github/rar-art/part-04.b64 .github/rar-art/part-05.b64 | tr -d '\n\r ' | base64 -d > assets/modaryx-rar-hero.webp

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          p = Path('assets/modaryx-rar-hero.webp')
          data = p.read_bytes()
          if len(data) < 50000:
              raise SystemExit(f'RAR hero unexpectedly small: {len(data)} bytes')
          if data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit('RAR hero is not a valid RIFF/WEBP container')
          riff_size = int.from_bytes(data[4:8], 'little') + 8
          if riff_size != len(data):
              raise SystemExit(f'RIFF size mismatch: header={riff_size} actual={len(data)}')
          print(f'RAR_HERO_BYTES={len(data)}')
          print(f'RAR_HERO_SHA256={hashlib.sha256(data).hexdigest()}')
          print('RAR_HERO_CONTAINER=WEBP')

          css_path = Path('assets/modaryx-vf.css')
          css = css_path.read_text(encoding='utf-8')
          old_hero = """  background:\n    linear-gradient(90deg,rgba(5,7,10,.985) 0%,rgba(6,8,11,.90) 26%,rgba(6,8,11,.24) 52%,rgba(6,8,11,.08) 70%,rgba(6,8,11,.78) 100%),\n    url('./modaryx-kingdom-panorama.svg') center/cover no-repeat;"""
          new_hero = """  background:\n    linear-gradient(90deg,rgba(5,7,10,.99) 0%,rgba(6,8,11,.96) 31%,rgba(6,8,11,.90) 82%,rgba(5,7,10,.98) 100%),\n    radial-gradient(circle at 62% 42%,rgba(205,168,91,.11),transparent 34%),\n    #06080b;"""
          if old_hero not in css:
              raise SystemExit('homepage hero background anchor not found')
          css = css.replace(old_hero, new_hero, 1)

          old_scene = ".mx-hero-scene{min-height:560px;isolation:isolate}"
          new_scene = ".mx-hero-scene{min-height:560px;isolation:isolate;background:linear-gradient(90deg,rgba(5,7,10,.38),transparent 13%,transparent 87%,rgba(5,7,10,.4)),url('./modaryx-rar-hero.webp') 52% 50%/cover no-repeat}"
          if old_scene not in css:
              raise SystemExit('hero scene anchor not found')
          css = css.replace(old_scene, new_scene, 1)

          old_guard = ".mx-guardian-focus{position:absolute;left:10%;right:14%;bottom:7%;height:55%;border-bottom:1px solid rgba(230,195,113,.23);filter:drop-shadow(0 25px 22px rgba(0,0,0,.42))}"
          new_guard = ".mx-guardian-focus{display:none}"
          if old_guard not in css:
              raise SystemExit('guardian placeholder anchor not found')
          css = css.replace(old_guard, new_guard, 1)
          css_path.write_text(css, encoding='utf-8', newline='\n')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          old_label = 'aria-label="Royaume MODARYX, scène centrale réservée au duo Loup et Dragon"'
          new_label = 'aria-label="Loup et Dragon devant le royaume MODARYX, illustration issue de la maquette de référence"'
          if old_label not in html:
              raise SystemExit('hero accessible label anchor not found')
          html = html.replace(old_label, new_label, 1)
          index_path.write_text(html, encoding='utf-8', newline='\n')

          if "url('./modaryx-rar-hero.webp')" not in css:
              raise SystemExit('RAR hero CSS reference missing after patch')
          if 'MODARYX MODS' not in html:
              raise SystemExit('public MODARYX brand missing')
          for stale in ('Nova Forge','NOVA FORGE','getnovaforge.com'):
              if stale in html:
                  raise SystemExit(f'stale public brand in homepage: {stale}')
          print('RAR_HOMEPAGE_WIRING=PASS')
          print('PLACEHOLDER_GUARDIANS=REMOVED')
          print('PUBLIC_BRAND=MODARYX MODS')
          PY
      - name: Commit reconstructed art and homepage wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/modaryx-rar-hero.webp assets/modaryx-vf.css index.html
          git commit -m "feat(site): wire recovered RAR hero art into MODARYX homepage"
          git push origin HEAD:site/modaryx-vf-premium-hd-v2
