name: MODARYX VF game hub links

on:
  push:
    branches:
      - site/modaryx-vf-premium-hd-v2
    paths:
      - '.github/modaryx-vf-game-hub-links-trigger.json'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site/modaryx-vf-premium-hd-v2
          fetch-depth: 0
      - name: Add game hub entry points only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one target, got {count}')
              p.write_text(text.replace(old,new,1),encoding='utf-8',newline='\n')

          replace_once(
              'index.html',
              '      <a class="active" href="#top">Accueil</a>\n      <a href="./catalog.html">Mods</a>',
              '      <a class="active" href="#top">Accueil</a>\n      <a href="./games.html">Jeux</a>\n      <a href="./catalog.html">Mods</a>'
          )

          replace_once(
              'catalog.html',
              '<nav aria-label="Navigation principale"><a href="./index.html">Accueil</a><a href="./catalog.html" aria-current="page">Catalogue</a>',
              '<nav aria-label="Navigation principale"><a href="./index.html">Accueil</a><a href="./games.html">Jeux</a><a href="./catalog.html" aria-current="page">Catalogue</a>'
          )

          replace_once(
              'catalog.html',
              '  <title>Catalogue — MODARYX MODS</title>\n',
              '  <title>Catalogue — MODARYX MODS</title>\n  <link rel="canonical" href="https://modaryxmods.com/catalog">\n'
          )

          required={
              'index.html':['href="./games.html">Jeux</a>'],
              'catalog.html':['href="./games.html">Jeux</a>','rel="canonical" href="https://modaryxmods.com/catalog"'],
              'games.html':['href="./gta-6/mods/"','href="./red-dead-redemption-2/mods/"'],
              'gta-6/mods/index.html':['GTA 6 Mods — MODARYX MODS','https://modaryxmods.com/gta-6/mods/'],
              'red-dead-redemption-2/mods/index.html':['Red Dead Redemption 2 Mods — MODARYX MODS','https://modaryxmods.com/red-dead-redemption-2/mods/'],
              'sitemap.xml':['https://modaryxmods.com/games','https://modaryxmods.com/gta-6/mods/','https://modaryxmods.com/red-dead-redemption-2/mods/'],
          }
          for path, needles in required.items():
              text=Path(path).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'{path}: missing {needle}')

          for path in ('games.html','gta-6/mods/index.html','red-dead-redemption-2/mods/index.html'):
              text=Path(path).read_text(encoding='utf-8')
              for forbidden in ('Nova Forge','NOVA FORGE','getnovaforge.com'):
                  if forbidden in text:
                      raise SystemExit(f'{path}: stale brand {forbidden}')

          print('MODARYX_GAME_HUB_LINK_PROOF=PASS')
          print('HUBS=games+gta6+rdr2')
          print('PUBLIC_BRAND=MODARYX MODS')
          PY
      - name: Commit targeted entry points
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html catalog.html
          git commit -m "feat(site): link premium game hubs"
          git push origin HEAD:site/modaryx-vf-premium-hd-v2
