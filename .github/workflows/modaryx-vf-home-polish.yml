name: MODARYX VF home polish

on:
  push:
    branches:
      - site/modaryx-vf-premium-hd-v2
    paths:
      - '.github/modaryx-vf-home-polish-trigger.json'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site/modaryx-vf-premium-hd-v2
          fetch-depth: 0
      - name: Attach VF polish layer to homepage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          marker='  <link rel="stylesheet" href="./assets/nova-premium-hd.css">\n'
          addition=marker+'  <link rel="stylesheet" href="./assets/modaryx-vf.css?v=20260911-1">\n'
          if './assets/modaryx-vf.css' not in text:
              if marker not in text:
                  raise SystemExit('Expected Premium HD stylesheet marker missing')
              text=text.replace(marker,addition,1)
              p.write_text(text,encoding='utf-8',newline='\n')
          proof=p.read_text(encoding='utf-8')
          assert proof.count('./assets/modaryx-vf.css') == 1
          assert proof.index('./assets/modaryx-vf.css') > proof.index('./assets/nova-premium-hd.css')
          print('MODARYX_VF_HOME_POLISH_PROOF=PASS')
          PY
      - name: Commit targeted homepage hook
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "NO_CHANGES=yes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat(site): attach MODARYX VF polish to homepage"
          git push origin HEAD:site/modaryx-vf-premium-hd-v2
