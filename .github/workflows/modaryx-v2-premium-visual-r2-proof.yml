name: MODARYX V2 Premium Visual Reconciliation R2 Proof

on:
  push:
    branches:
      - 'proof/modaryx-v2-premium-visual-r2-20261008'
    paths:
      - '.github/workflows/modaryx-v2-premium-visual-r2-proof.yml'
      - 'qa/capture-v2-premium-reconciliation-r2.mjs'

permissions:
  contents: read

concurrency:
  group: modaryx-v2-premium-visual-r2-proof
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODARYX_CANDIDATE_SHA: 'b58594b4633e7331f1693b41bae88e0be0af5ca3'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact candidate ancestry and proof-only delta
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$MODARYX_CANDIDATE_SHA" HEAD
          mapfile -t delta < <(git diff --name-only "$MODARYX_CANDIDATE_SHA..HEAD")
          printf 'PROOF_DELTA %s\n' "${delta[*]}"
          test "${#delta[@]}" -eq 2
          printf '%s\n' "${delta[@]}" | grep -Fx '.github/workflows/modaryx-v2-premium-visual-r2-proof.yml'
          printf '%s\n' "${delta[@]}" | grep -Fx 'qa/capture-v2-premium-reconciliation-r2.mjs'

      - name: Locate Chrome
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_BIN"
          "$CHROME_BIN" --version
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Build exact V2 candidate
        shell: bash
        working-directory: v2
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm run test:sites

      - name: Start exact V2 preview
        shell: bash
        working-directory: v2
        run: |
          set -euo pipefail
          node ./node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4194 >/tmp/modaryx-v2-premium-r1.log 2>&1 &
          echo $! >/tmp/modaryx-v2-premium-r1.pid
          for attempt in {1..80}; do
            if curl --fail --silent http://127.0.0.1:4194/ >/dev/null; then exit 0; fi
            sleep 0.25
          done
          cat /tmp/modaryx-v2-premium-r1.log
          exit 1

      - name: Capture 16 fresh Premium review images
        shell: bash
        env:
          MODARYX_REVIEW_ORIGIN: http://127.0.0.1:4194
        run: |
          set -euo pipefail
          node qa/capture-v2-premium-reconciliation-r2.mjs

      - name: Upload Premium visual evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MODARYX-V2-PREMIUM-VISUAL-R2
          path: proof-output/modaryx-v2-premium-visual-r2
          if-no-files-found: error
          retention-days: 30

      - name: Stop preview
        if: always()
        shell: bash
        run: |
          if test -f /tmp/modaryx-v2-premium-r1.pid; then
            kill "$(cat /tmp/modaryx-v2-premium-r1.pid)" 2>/dev/null || true
          fi
